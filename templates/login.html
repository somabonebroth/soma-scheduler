<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma Bone Broth - Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: #fff; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.login-card img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 16px; }
.login-card h1 { font-size: 20px; color: var(--dark); margin-bottom: 4px; }
.login-card p { color: var(--text-light); font-size: 13px; margin-bottom: 24px; }
.login-card input { width: 100%; padding: 12px 16px; border: 1px solid #e0e0d8; border-radius: 6px; font-size: 15px; margin-bottom: 12px; text-align: center; }
.login-card input:focus { outline: none; border-color: var(--accent); }
.login-card button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
.login-card button:hover { background: #5a7d4f; }
.error { color: #dc3545; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="login-card">
<img src="/static/logo.jpg" alt="Soma">
<h1>SOMA BONE BROTH</h1>
<p>Production Scheduler</p>
<input type="password" id="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
<button onclick="doLogin()">Log In</button>
<div class="error" id="error-msg">Incorrect password</div>
</div>
<script>
async function doLogin() {
var pw = document.getElementById('password').value;
var res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})});
if (res.ok) { window.location.href = '/'; }
else { document.getElementById('error-msg').style.display = 'block'; }
}
</script>
</body>
</html>
