<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Production Tracker</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.view-toggle { display: flex; gap: 0; margin-bottom: 16px; }
.view-toggle button { padding: 8px 20px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; background: var(--card-bg); color: var(--text); }
.view-toggle button:first-child { border-radius: 6px 0 0 6px; }
.view-toggle button:last-child { border-radius: 0 6px 6px 0; }
.view-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.picker-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.picker-bar input[type="date"], .picker-bar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
.chart-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 16px; }
.chart-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--dark); }
.legend { display: flex; gap: 16px; margin-bottom: 16px; font-size: 12px; flex-wrap: wrap; }
.legend-group { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; background: #fafaf5; border-radius: 6px; border: 1px solid var(--border); }
.legend-group-title { font-size: 11px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 280px; padding: 0 8px; border-bottom: 2px solid var(--border); }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 100%; }
.bar-stack { width: 70%; display: flex; flex-direction: column-reverse; }
.bar-segment { width: 100%; min-height: 0; transition: height 0.5s; }
.bar-empty { background: var(--border); border-radius: 3px; min-height: 4px; }
.bar-value { font-size: 11px; font-weight: 600; color: var(--dark); }
.bar-label { font-size: 11px; color: var(--text-light); margin-top: 8px; text-align: center; }
.total-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.total-row:last-child { border-bottom: none; }
.total-sub { padding-left: 20px; }
.total-sub .total-label { color: var(--text-light); font-size: 12px; }
.total-label { font-size: 13px; color: var(--text); }
.total-value { font-size: 15px; font-weight: 700; }
.total-all { color: var(--dark); font-size: 18px; }
.total-section-head { font-size: 12px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 0 4px; border-bottom: none; }
.no-data { text-align: center; padding: 60px 20px; color: var(--text-light); font-size: 14px; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Production Tracker</h1><p>Output overview</p></div>
    <div class="header-right"><a href="/" class="header-btn">Back to Dashboard</a></div>
</div>
<div class="main">
    <div class="view-toggle">
        <button id="btn-week" class="active" onclick="setView('week')">Week</button>
        <button id="btn-month" onclick="setView('month')">Month</button>
        <button id="btn-year" onclick="setView('year')">Year</button>
    </div>
    <div class="picker-bar" id="picker-bar"></div>
    <div id="chart-area"></div>
</div>
<script>
var currentView='week';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function getCurrentMonday(){var t=new Date();var d=t.getDay();var diff=d===0?-6:1-d;var m=new Date(t);m.setDate(t.getDate()+diff);return m;}
function formatDate(d){return d.toISOString().split('T')[0];}

function setView(v){
    currentView=v;
    document.querySelectorAll('.view-toggle button').forEach(function(b){b.classList.remove('active');});
    document.getElementById('btn-'+v).classList.add('active');
    buildPicker();
    loadData();
}

function buildPicker(){
    var bar=document.getElementById('picker-bar');
    var now=new Date();
    if(currentView==='week'){
        bar.innerHTML='<label style="font-size:14px;font-weight:600;">Week of:</label><input type="date" id="week-date" onchange="loadData()">';
        document.getElementById('week-date').value=formatDate(getCurrentMonday());
    }else if(currentView==='month'){
        var html='<label style="font-size:14px;font-weight:600;">Month:</label>';
        html+='<select id="month-sel" onchange="loadData()">';
        for(var i=0;i<12;i++){
            var sel=i===now.getMonth()?' selected':'';
            html+='<option value="'+i+'"'+sel+'>'+MONTHS[i]+'</option>';
        }
        html+='</select>';
        html+='<select id="month-year-sel" onchange="loadData()">';
        for(var y=now.getFullYear()-2;y<=now.getFullYear()+1;y++){
            var sel=y===now.getFullYear()?' selected':'';
            html+='<option value="'+y+'"'+sel+'>'+y+'</option>';
        }
        html+='</select>';
        bar.innerHTML=html;
    }else{
        var html='<label style="font-size:14px;font-weight:600;">Year:</label>';
        html+='<select id="year-sel" onchange="loadData()">';
        for(var y=now.getFullYear()-2;y<=now.getFullYear()+1;y++){
            var sel=y===now.getFullYear()?' selected':'';
            html+='<option value="'+y+'"'+sel+'>'+y+'</option>';
        }
        html+='</select>';
        bar.innerHTML=html;
    }
}

async function loadData(){
    if(currentView==='week') await loadWeek();
    else if(currentView==='month') await loadMonth();
    else await loadYear();
}

async function loadWeek(){
    var weekId=document.getElementById('week-date').value;
    var res=await fetch('/api/production-tracker/'+weekId);
    var data=await res.json();
    renderBarChart(data, function(d){return d.day_name.substring(0,3);}, 'Daily Production Output');
}

async function loadMonth(){
    var m=parseInt(document.getElementById('month-sel').value)+1;
    var y=document.getElementById('month-year-sel').value;
    var ym=y+'-'+(m<10?'0'+m:m);
    var res=await fetch('/api/production-tracker/month/'+ym);
    var data=await res.json();
    renderBarChart(data, function(d){return d.label;}, MONTHS[m-1]+' '+y+' — Weekly Totals');
}

async function loadYear(){
    var y=document.getElementById('year-sel').value;
    var res=await fetch('/api/production-tracker/year/'+y);
    var data=await res.json();
    renderBarChart(data, function(d){return d.label;}, y+' — Monthly Totals');
}

// Bucket order for stacking (bottom to top) and color scheme.
// Three totally different colors for the SS sizes as requested.
var BUCKET_ORDER = ['SS-876ML', 'SS-750ML', 'SS-473ML', 'FZ', 'Other', 'Kettles End', 'BB'];
var BUCKET_COLORS = {
    'SS-876ML': '#008080',      // teal
    'SS-750ML': '#c23b22',      // crimson
    'SS-473ML': '#5b2c6f',      // deep violet
    'FZ': '#4a6cc6',            // cornflower blue
    'Other': '#9e9e9e',         // neutral grey
    'Kettles End': '#b38b00',   // warm ochre
    'BB': '#2d5f3f',            // forest green
};
var BUCKET_LABELS = {
    'SS-876ML': '876 ml',
    'SS-750ML': '750 ml',
    'SS-473ML': '473 ml',
    'FZ': 'Frozen (FZ)',
    'Other': 'Other',
    'Kettles End': "Kettle's End",
    'BB': 'Back Bar (BB)',
};

function renderBarChart(data, labelFn, title){
    var container=document.getElementById('chart-area');
    var maxVal=0;var hasAny=false;
    // Per-bucket totals across all bars
    var grandTotals={};
    BUCKET_ORDER.forEach(function(b){grandTotals[b]=0;});

    for(var i=0;i<data.length;i++){
        var buckets=data[i].buckets||{};
        var rowTotal=0;
        BUCKET_ORDER.forEach(function(b){
            var v=buckets[b]||0;
            rowTotal+=v;
            grandTotals[b]+=v;
        });
        if(rowTotal>maxVal)maxVal=rowTotal;
        if(rowTotal>0)hasAny=true;
    }
    if(!hasAny){
        container.innerHTML='<div class="chart-container"><div class="no-data">No production data for this period yet.</div></div>';
        return;
    }
    if(maxVal===0)maxVal=100;
    var chartH=240;

    var html='<div class="chart-container">';
    html+='<div class="chart-title">'+title+'</div>';

    // Legend — group SS sizes together, then Frozen, Other (if any), Kettle's End, BB
    html+='<div class="legend">';
    html+='<div class="legend-group"><div class="legend-group-title">Standard Production (SS)</div>';
    ['SS-876ML','SS-750ML','SS-473ML'].forEach(function(b){
        html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS[b]+';"></div>'+BUCKET_LABELS[b]+'</div>';
    });
    html+='</div>';
    // Frozen always visible
    html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['FZ']+';"></div>'+BUCKET_LABELS['FZ']+'</div>';
    // Other only if nonzero
    if(grandTotals['Other']>0){
        html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['Other']+';"></div>'+BUCKET_LABELS['Other']+'</div>';
    }
    html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['Kettles End']+';"></div>'+BUCKET_LABELS['Kettles End']+'</div>';
    html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['BB']+';"></div>'+BUCKET_LABELS['BB']+'</div>';
    html+='</div>';

    // Bar chart
    html+='<div class="bar-chart">';
    for(var i=0;i<data.length;i++){
        var d=data[i];
        var buckets=d.buckets||{};
        var rowTotal=0;
        BUCKET_ORDER.forEach(function(b){rowTotal+=(buckets[b]||0);});
        html+='<div class="bar-col"><div class="bar-wrapper">';
        if(rowTotal>0){
            html+='<div class="bar-value">'+rowTotal+'</div><div class="bar-stack">';
            // Stack order is BUCKET_ORDER; column-reverse CSS puts first element on bottom
            BUCKET_ORDER.forEach(function(b){
                var v=buckets[b]||0;
                if(v>0){
                    var h=Math.max(Math.round((v/maxVal)*chartH),4);
                    html+='<div class="bar-segment" style="background:'+BUCKET_COLORS[b]+';height:'+h+'px;" title="'+BUCKET_LABELS[b]+': '+v+'"></div>';
                }
            });
            html+='</div>';
        }else{
            html+='<div class="bar-empty" style="height:4px;width:70%;"></div>';
        }
        html+='</div><div class="bar-label">'+labelFn(d)+'</div></div>';
    }
    html+='</div>';

    // Totals section
    var ssSubtotal=grandTotals['SS-876ML']+grandTotals['SS-750ML']+grandTotals['SS-473ML'];
    var grandTotal=0;
    BUCKET_ORDER.forEach(function(b){grandTotal+=grandTotals[b];});

    html+='<div style="margin-top:16px;">';
    html+='<div class="total-row total-section-head"><span>Standard Production (SS)</span><span>'+ssSubtotal+' units</span></div>';
    ['SS-876ML','SS-750ML','SS-473ML'].forEach(function(b){
        html+='<div class="total-row total-sub"><span class="total-label">'+BUCKET_LABELS[b]+'</span><span class="total-value" style="color:'+BUCKET_COLORS[b]+';">'+grandTotals[b]+' units</span></div>';
    });
    html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['FZ']+'</span><span class="total-value" style="color:'+BUCKET_COLORS['FZ']+';">'+grandTotals['FZ']+' units</span></div>';
    if(grandTotals['Other']>0){
        var whyLink = (currentView==='week') ? ' <a href="#" onclick="showOtherDetails(); return false;" style="font-size:11px;margin-left:8px;">(why?)</a>' : '';
        html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['Other']+whyLink+'</span><span class="total-value" style="color:'+BUCKET_COLORS['Other']+';">'+grandTotals['Other']+' units</span></div>';
    }
    html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['Kettles End']+'</span><span class="total-value" style="color:'+BUCKET_COLORS['Kettles End']+';">'+grandTotals['Kettles End']+' units</span></div>';
    html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['BB']+'</span><span class="total-value" style="color:'+BUCKET_COLORS['BB']+';">'+grandTotals['BB']+' units</span></div>';
    html+='<div class="total-row"><span class="total-label"><strong>Total</strong></span><span class="total-value total-all">'+grandTotal+' units</span></div>';
    html+='</div></div>';
    container.innerHTML=html;
}

async function showOtherDetails(){
    if(currentView!=='week'){alert('Switch to Week view to see Other details.');return;}
    var weekId=document.getElementById('week-date').value;
    var res=await fetch('/api/production-tracker/'+weekId+'/other-details');
    var rows=await res.json();
    if(!rows.length){alert('No entries in Other for this week.');return;}
    var msg='Entries classified as Other for this week:\n\n';
    rows.forEach(function(r){
        msg+='• '+r.day_name+' — '+r.vessel+' — '+r.amount+' units\n';
        msg+='  Recipe: '+(r.scheduled_recipe||'(none)')+'\n';
        msg+='  Format: '+(r.recipe_format||'(none)')+'\n';
        msg+='  Reason: '+r.detail+'\n\n';
    });
    alert(msg);
}

document.addEventListener('DOMContentLoaded',function(){buildPicker();loadData();});
</script>
</body>
</html>
