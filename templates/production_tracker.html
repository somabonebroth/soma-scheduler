<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Production Tracker</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.view-toggle { display: flex; gap: 0; margin-bottom: 16px; }
.view-toggle button { padding: 8px 20px; border: 1px solid var(--border); font-size: 13px; font-weight: 600; cursor: pointer; background: var(--card-bg); color: var(--text); }
.view-toggle button:first-child { border-radius: 6px 0 0 6px; }
.view-toggle button:last-child { border-radius: 0 6px 6px 0; }
.view-toggle button.active { background: var(--accent); color: var(--white); border-color: var(--accent); }
.picker-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.picker-bar input[type="date"], .picker-bar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
.chart-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 16px; }
.chart-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--dark); }
.legend { display: flex; gap: 16px; margin-bottom: 16px; font-size: 12px; flex-wrap: wrap; }
.legend-group { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; background: #fafaf5; border-radius: 6px; border: 1px solid var(--border); }
.legend-group-title { font-size: 11px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 280px; padding: 0 8px; border-bottom: 2px solid var(--border); }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 100%; }
.bar-stack { width: 70%; display: flex; flex-direction: column-reverse; }
.bar-segment { width: 100%; min-height: 0; transition: height 0.5s; }
.bar-empty { background: var(--border); border-radius: 3px; min-height: 4px; }
.bar-value { font-size: 11px; font-weight: 600; color: var(--dark); }
.bar-label { font-size: 11px; color: var(--text-light); margin-top: 8px; text-align: center; }
.total-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.total-row:last-child { border-bottom: none; }
.total-sub { padding-left: 20px; }
.total-sub .total-label { color: var(--text-light); font-size: 12px; }
.total-label { font-size: 13px; color: var(--text); }
.total-value { font-size: 15px; font-weight: 700; }
.total-all { color: var(--dark); font-size: 18px; }
.total-section-head { font-size: 12px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 0 4px; border-bottom: none; }
.no-data { text-align: center; padding: 60px 20px; color: var(--text-light); font-size: 14px; }
/* Produced vs sold overlay */
.ov-controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 4px 0 8px; }
.ov-controls .view-toggle, .ov-controls .picker-bar { margin-bottom: 0; }
.ov-controls label { font-size: 13px; font-weight: 600; }
.ov-sub { font-size: 12px; color: var(--text-light); margin-bottom: 12px; }
.ov-sub strong { color: var(--dark); font-weight: 600; }
.ov-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--text); margin-bottom: 8px; }
.ov-legend span { display: inline-flex; align-items: center; gap: 6px; }
.ov-key { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
.ov-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }
.ov-wrap { position: relative; }
.ov-wrap svg { display: block; width: 100%; height: auto; overflow: visible; font-family: inherit; }
.ov-axis { font-size: 11px; fill: var(--text-light); }
.ov-grid { stroke: var(--border); stroke-width: 1; }
.ov-hair { stroke: var(--text-muted); stroke-width: 1; pointer-events: none; }
.ov-tip { position: absolute; display: none; background: var(--dark); color: var(--white); font-size: 11px; line-height: 1.6; padding: 6px 10px; border-radius: 4px; pointer-events: none; z-index: 5; white-space: nowrap; }
.ov-tip .t-date { font-weight: 600; margin-bottom: 2px; }
.ov-tip .t-row { display: flex; align-items: center; gap: 6px; }
.ov-tip .t-row b { font-weight: 700; min-width: 3.5em; text-align: right; }
.ov-tip .t-key { display: inline-block; width: 12px; border-top: 2px solid; }
.ov-multiples { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.ov-panel { border: 1px solid var(--border); border-radius: 6px; padding: 10px 10px 4px; background: var(--row-alt); }
.ov-panel-title { font-size: 12px; font-weight: 600; color: var(--dark); margin-bottom: 2px; display: flex; justify-content: space-between; }
.ov-panel-title small { font-weight: 400; color: var(--text-light); }
.ov-table { margin-top: 14px; font-size: 12px; }
.ov-table summary { cursor: pointer; color: var(--text-light); }
.ov-table table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.ov-table th, .ov-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
.ov-table th:first-child, .ov-table td:first-child { text-align: left; }
.ov-table th { font-size: 11px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.ov-status { font-size: 13px; color: var(--text-light); padding: 24px 0; text-align: center; }
@media (max-width: 900px) { .ov-multiples { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .ov-multiples { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Production Tracker</h1><p>Output overview</p></div>
    <div class="header-right" style="display:flex;align-items:center;gap:8px;">
    <div class="nav-arrows"><button class="nav-arrow-btn" id="nav-back" title="Back">&#8592;</button><button class="nav-arrow-btn" id="nav-fwd" title="Forward">&#8594;</button></div>
    <a href="/" class="header-btn">⌂ Dashboard</a>
  </div>
</div>
<div class="main">
    <div class="view-toggle">
        <button id="btn-week" class="active" onclick="setView('week')">Week</button>
        <button id="btn-month" onclick="setView('month')">Month</button>
        <button id="btn-year" onclick="setView('year')">Year</button>
    </div>
    <div class="picker-bar" id="picker-bar"></div>
    <div id="chart-area"></div>
    <div class="chart-container" id="overlay-card">
        <div class="chart-title">Produced vs sold</div>
        <div class="ov-controls">
            <div class="view-toggle" id="ov-bucket">
                <button class="active" data-grain="week" onclick="ovSetGrain('week')">Week</button>
                <button data-grain="month" onclick="ovSetGrain('month')">Month</button>
                <button data-grain="year" onclick="ovSetGrain('year')">Year</button>
            </div>
            <div class="picker-bar" id="ov-picker"></div>
        </div>
        <div class="ov-sub" id="ov-sub">Jars only (876 / 750 / 473 ml, frozen, Back Bar). Kettle's End is not a product, so it is left out.</div>
        <div class="ov-legend" id="ov-legend"></div>
        <div id="ov-main"><div class="ov-status">Loading…</div></div>
        <div class="ov-multiples" id="ov-multiples"></div>
        <details class="ov-table" id="ov-table-wrap"><summary>Show the numbers</summary><div id="ov-table"></div></details>
    </div>
</div>
<script>
var currentView='week';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function getCurrentMonday(){var t=new Date();var d=t.getDay();var diff=d===0?-6:1-d;var m=new Date(t);m.setDate(t.getDate()+diff);return m;}
function formatDate(d){return d.toISOString().split('T')[0];}

function setView(v){
    currentView=v;
    document.querySelectorAll('.view-toggle button').forEach(function(b){b.classList.remove('active');});
    document.getElementById('btn-'+v).classList.add('active');
    buildPicker();
    loadData();
}

function buildPicker(){
    var bar=document.getElementById('picker-bar');
    var now=new Date();
    if(currentView==='week'){
        bar.innerHTML='<label style="font-size:14px;font-weight:600;">Week of:</label><input type="date" id="week-date" onchange="loadData()">';
        document.getElementById('week-date').value=formatDate(getCurrentMonday());
    }else if(currentView==='month'){
        var html='<label style="font-size:14px;font-weight:600;">Month:</label>';
        html+='<select id="month-sel" onchange="loadData()">';
        for(var i=0;i<12;i++){
            var sel=i===now.getMonth()?' selected':'';
            html+='<option value="'+i+'"'+sel+'>'+MONTHS[i]+'</option>';
        }
        html+='</select>';
        html+='<select id="month-year-sel" onchange="loadData()">';
        for(var y=now.getFullYear()-2;y<=now.getFullYear()+1;y++){
            var sel=y===now.getFullYear()?' selected':'';
            html+='<option value="'+y+'"'+sel+'>'+y+'</option>';
        }
        html+='</select>';
        bar.innerHTML=html;
    }else{
        var html='<label style="font-size:14px;font-weight:600;">Year:</label>';
        html+='<select id="year-sel" onchange="loadData()">';
        for(var y=now.getFullYear()-2;y<=now.getFullYear()+1;y++){
            var sel=y===now.getFullYear()?' selected':'';
            html+='<option value="'+y+'"'+sel+'>'+y+'</option>';
        }
        html+='</select>';
        bar.innerHTML=html;
    }
}

async function loadData(){
    if(currentView==='week') await loadWeek();
    else if(currentView==='month') await loadMonth();
    else await loadYear();
}

async function loadWeek(){
    var weekId=document.getElementById('week-date').value;
    var res=await fetch('/api/production-tracker/'+weekId);
    var data=await res.json();
    renderBarChart(data, function(d){return d.day_name.substring(0,3);}, 'Daily Production Output');
}

async function loadMonth(){
    var m=parseInt(document.getElementById('month-sel').value)+1;
    var y=document.getElementById('month-year-sel').value;
    var ym=y+'-'+(m<10?'0'+m:m);
    var res=await fetch('/api/production-tracker/month/'+ym);
    var data=await res.json();
    renderBarChart(data, function(d){return d.label;}, MONTHS[m-1]+' '+y+' — Weekly Totals');
}

async function loadYear(){
    var y=document.getElementById('year-sel').value;
    var res=await fetch('/api/production-tracker/year/'+y);
    var data=await res.json();
    renderBarChart(data, function(d){return d.label;}, y+' — Monthly Totals');
}

// Bucket order for stacking (bottom to top) and color scheme.
// Three totally different colors for the SS sizes as requested.
var BUCKET_ORDER = ['SS-876ML', 'SS-750ML', 'SS-473ML', 'FZ', 'Other', 'Kettles End', 'BB'];
var BUCKET_COLORS = {
    'SS-876ML': '#008080',      // teal
    'SS-750ML': '#c23b22',      // crimson
    'SS-473ML': '#5b2c6f',      // deep violet
    'FZ': '#4a6cc6',            // cornflower blue
    'Other': '#9e9e9e',         // neutral grey
    'Kettles End': '#b38b00',   // warm ochre
    'BB': '#2d5f3f',            // forest green
};
var BUCKET_LABELS = {
    'SS-876ML': '876 ml',
    'SS-750ML': '750 ml',
    'SS-473ML': '473 ml',
    'FZ': 'Frozen (FZ)',
    'Other': 'Other',
    'Kettles End': "Kettle's End",
    'BB': 'Back Bar (BB)',
};

function renderBarChart(data, labelFn, title){
    var container=document.getElementById('chart-area');
    var maxVal=0;var hasAny=false;
    // Per-bucket totals across all bars
    var grandTotals={};
    BUCKET_ORDER.forEach(function(b){grandTotals[b]=0;});

    for(var i=0;i<data.length;i++){
        var buckets=data[i].buckets||{};
        var rowTotal=0;
        BUCKET_ORDER.forEach(function(b){
            var v=buckets[b]||0;
            rowTotal+=v;
            grandTotals[b]+=v;
        });
        if(rowTotal>maxVal)maxVal=rowTotal;
        if(rowTotal>0)hasAny=true;
    }
    if(!hasAny){
        container.innerHTML='<div class="chart-container"><div class="no-data">No production data for this period yet.</div></div>';
        return;
    }
    if(maxVal===0)maxVal=100;
    var chartH=240;

    var html='<div class="chart-container">';
    html+='<div class="chart-title">'+title+'</div>';

    // Legend — group SS sizes together, then Frozen, Other (if any), Kettle's End, BB
    html+='<div class="legend">';
    html+='<div class="legend-group"><div class="legend-group-title">Standard Production (SS)</div>';
    ['SS-876ML','SS-750ML','SS-473ML'].forEach(function(b){
        html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS[b]+';"></div>'+BUCKET_LABELS[b]+'</div>';
    });
    html+='</div>';
    // Frozen always visible
    html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['FZ']+';"></div>'+BUCKET_LABELS['FZ']+'</div>';
    // Other only if nonzero
    if(grandTotals['Other']>0){
        html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['Other']+';"></div>'+BUCKET_LABELS['Other']+'</div>';
    }
    html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['Kettles End']+';"></div>'+BUCKET_LABELS['Kettles End']+'</div>';
    html+='<div class="legend-item"><div class="legend-dot" style="background:'+BUCKET_COLORS['BB']+';"></div>'+BUCKET_LABELS['BB']+'</div>';
    html+='</div>';

    // Bar chart
    html+='<div class="bar-chart">';
    for(var i=0;i<data.length;i++){
        var d=data[i];
        var buckets=d.buckets||{};
        var rowTotal=0;
        BUCKET_ORDER.forEach(function(b){rowTotal+=(buckets[b]||0);});
        html+='<div class="bar-col"><div class="bar-wrapper">';
        if(rowTotal>0){
            html+='<div class="bar-value">'+rowTotal+'</div><div class="bar-stack">';
            // Stack order is BUCKET_ORDER; column-reverse CSS puts first element on bottom
            BUCKET_ORDER.forEach(function(b){
                var v=buckets[b]||0;
                if(v>0){
                    var h=Math.max(Math.round((v/maxVal)*chartH),4);
                    html+='<div class="bar-segment" style="background:'+BUCKET_COLORS[b]+';height:'+h+'px;" title="'+BUCKET_LABELS[b]+': '+v+'"></div>';
                }
            });
            html+='</div>';
        }else{
            html+='<div class="bar-empty" style="height:4px;width:70%;"></div>';
        }
        html+='</div><div class="bar-label">'+labelFn(d)+'</div></div>';
    }
    html+='</div>';

    // Totals section
    var ssSubtotal=grandTotals['SS-876ML']+grandTotals['SS-750ML']+grandTotals['SS-473ML'];
    var grandTotal=0;
    BUCKET_ORDER.forEach(function(b){grandTotal+=grandTotals[b];});

    html+='<div style="margin-top:16px;">';
    html+='<div class="total-row total-section-head"><span>Standard Production (SS)</span><span>'+ssSubtotal+' units</span></div>';
    ['SS-876ML','SS-750ML','SS-473ML'].forEach(function(b){
        html+='<div class="total-row total-sub"><span class="total-label">'+BUCKET_LABELS[b]+'</span><span class="total-value" style="color:'+BUCKET_COLORS[b]+';">'+grandTotals[b]+' units</span></div>';
    });
    html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['FZ']+'</span><span class="total-value" style="color:'+BUCKET_COLORS['FZ']+';">'+grandTotals['FZ']+' units</span></div>';
    if(grandTotals['Other']>0){
        var whyLink = (currentView==='week') ? ' <a href="#" onclick="showOtherDetails(); return false;" style="font-size:11px;margin-left:8px;">(why?)</a>' : '';
        html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['Other']+whyLink+'</span><span class="total-value" style="color:'+BUCKET_COLORS['Other']+';">'+grandTotals['Other']+' units</span></div>';
    }
    html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['Kettles End']+'</span><span class="total-value" style="color:'+BUCKET_COLORS['Kettles End']+';">'+grandTotals['Kettles End']+' units</span></div>';
    html+='<div class="total-row"><span class="total-label">'+BUCKET_LABELS['BB']+'</span><span class="total-value" style="color:'+BUCKET_COLORS['BB']+';">'+grandTotals['BB']+' units</span></div>';
    html+='<div class="total-row"><span class="total-label"><strong>Total</strong></span><span class="total-value total-all">'+grandTotal+' units</span></div>';
    html+='</div></div>';
    container.innerHTML=html;
}

async function showOtherDetails(){
    if(currentView!=='week'){alert('Switch to Week view to see Other details.');return;}
    var weekId=document.getElementById('week-date').value;
    var res=await fetch('/api/production-tracker/'+weekId+'/other-details');
    var rows=await res.json();
    if(!rows.length){alert('No entries in Other for this week.');return;}
    var msg='Entries classified as Other for this week:\n\n';
    rows.forEach(function(r){
        msg+='• '+r.day_name+' — '+r.vessel+' — '+r.amount+' units\n';
        msg+='  Recipe: '+(r.scheduled_recipe||'(none)')+'\n';
        msg+='  Format: '+(r.recipe_format||'(none)')+'\n';
        msg+='  Reason: '+r.detail+'\n\n';
    });
    alert(msg);
}

// ── Produced vs sold overlay ─────────────────────────────────────────────
// Two lines in jars on one time axis, fed by /api/production-tracker/overlay.
// Has its OWN bucket toggle + range + end picker, independent of the bars above:
// week = one point per Mon–Sun week, month = one per calendar month,
// year = one per calendar year (annual totals).
const OV_LABELS = {'SS-876ML':'876 ml','SS-750ML':'750 ml','SS-473ML':'473 ml','FZ':'Frozen','BB':'Back Bar'};
const OV_RANGES = { week: [12, 26, 52], month: [6, 12, 24], year: [3, 5, 10] };
let _ovData = null;
let _ovGrain = 'week';

function ovSetGrain(g){
    _ovGrain = g;
    document.querySelectorAll('#ov-bucket button').forEach(b => b.classList.toggle('active', b.dataset.grain === g));
    ovBuildPicker();
    loadOverlay();
}

function ovBuildPicker(){
    const bar = document.getElementById('ov-picker');
    const now = new Date();
    const unit = _ovGrain;
    const ranges = OV_RANGES[unit].map((r, i) => '<option value="' + r + '"' + (i === 1 ? ' selected' : '') + '>' + r + ' ' + unit + 's</option>').join('');
    let html = '<label>Show last</label><select id="ov-n" onchange="loadOverlay()">' + ranges + '</select>';
    html += '<label>ending</label>';
    if (unit === 'week') {
        html += '<input type="date" id="ov-end-date" value="' + formatDate(getCurrentMonday()) + '" onchange="loadOverlay()">';
    } else if (unit === 'month') {
        html += '<select id="ov-end-month" onchange="loadOverlay()">';
        for (let i = 0; i < 12; i++) html += '<option value="' + i + '"' + (i === now.getMonth() ? ' selected' : '') + '>' + MONTHS[i] + '</option>';
        html += '</select><select id="ov-end-year" onchange="loadOverlay()">';
        for (let y = now.getFullYear() - 3; y <= now.getFullYear() + 1; y++) html += '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>';
        html += '</select>';
    } else {
        html += '<select id="ov-end-year" onchange="loadOverlay()">';
        for (let y = now.getFullYear() - 3; y <= now.getFullYear() + 1; y++) html += '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>';
        html += '</select>';
    }
    bar.innerHTML = html;
}

function ovParams(){
    const n = parseInt(document.getElementById('ov-n').value, 10) || OV_RANGES[_ovGrain][1];
    if (_ovGrain === 'week') {
        return {grain:'week', end:document.getElementById('ov-end-date').value, n:n, unit:'week'};
    }
    if (_ovGrain === 'month') {
        const m = parseInt(document.getElementById('ov-end-month').value, 10) + 1;
        const y = document.getElementById('ov-end-year').value;
        return {grain:'month', end:y + '-' + (m < 10 ? '0' + m : m), n:n, unit:'month'};
    }
    return {grain:'year', end:document.getElementById('ov-end-year').value, n:n, unit:'year'};
}

async function loadOverlay(){
    const main=document.getElementById('ov-main');
    const p=ovParams();
    if(!p.end){ main.innerHTML='<div class="ov-status">Pick a period above.</div>'; return; }
    main.style.opacity = _ovData ? '.5' : '1';
    try{
        const res=await fetch('/api/production-tracker/overlay?grain='+p.grain+'&end='+encodeURIComponent(p.end)+'&n='+p.n);
        if(!res.ok) throw new Error('HTTP '+res.status);
        _ovData=await res.json();
        _ovData.unit=p.unit;
        renderOverlay();
    }catch(e){
        main.style.opacity='1';
        main.innerHTML='<div class="ov-status">Could not load produced vs sold: '+e.message+'</div>';
    }
}

function ovColors(){
    const cs=getComputedStyle(document.documentElement);
    return {
        produced: cs.getPropertyValue('--action-green').trim() || '#2e7d32',
        sold:     cs.getPropertyValue('--indigo').trim() || '#3949ab',
        surface:  cs.getPropertyValue('--card-bg').trim() || '#ffffff',
    };
}

function ovNiceStep(max){
    if(max<=0) return 1;
    const raw=max/5, mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const norm=raw/mag;
    const step = norm<=1?1 : norm<=2?2 : norm<=2.5?2.5 : norm<=5?5 : 10;
    return step*mag;
}
function ovFmt(n){ return (+n).toLocaleString(); }

// One SVG line chart. rows = [{label, produced, sold}]; opts.yMax shares a scale
// across panels; opts.compact drops most axis labels + markers for small multiples.
function ovChart(host, rows, opts){
    const C=ovColors();
    const W=Math.max(host.clientWidth||600, 240), H=opts.compact?130:260;
    const padL=opts.compact?42:48, padR=opts.compact?10:64, padT=12, padB=opts.compact?20:26;
    const pw=W-padL-padR, ph=H-padT-padB;
    const n=rows.length;
    const step=ovNiceStep(opts.yMax);
    const yMax=Math.max(step*Math.ceil(opts.yMax/step), step);
    const x=i=> padL + (n===1 ? pw/2 : i*pw/(n-1));
    const y=v=> padT + ph - (v/yMax)*ph;

    let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+(opts.aria||'Produced vs sold')+'">';
    // gridlines + y ticks (hairline, solid, recessive)
    for(let v=0; v<=yMax+1e-9; v+=step){
        const yy=y(v);
        s+='<line class="ov-grid" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy+'" y2="'+yy+'"/>';
        if(!opts.compact || v===0 || Math.abs(v-yMax)<1e-9)
            s+='<text class="ov-axis" x="'+(padL-6)+'" y="'+(yy+4)+'" text-anchor="end">'+ovFmt(v)+'</text>';
    }
    // x labels — thin out when crowded
    // ~48px per label; the END label always shows and any regular label within 44px of it yields
    const every = opts.compact ? Math.max(1,n-1) : Math.max(1, Math.ceil(n*48/pw));
    rows.forEach((r,i)=>{
        const draw = i===n-1 || (i%every===0 && (x(n-1)-x(i)) >= 44);
        if(draw)
            s+='<text class="ov-axis" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+r.label+'</text>';
    });
    // shaded gap between the lines: produced above → produced tint (stock building),
    // sold above → sold tint (stock draining). Split a segment at the crossing.
    for(let i=0;i<n-1;i++){
        const p0=rows[i].produced, p1=rows[i+1].produced, q0=rows[i].sold, q1=rows[i+1].sold;
        const d0=p0-q0, d1=p1-q1;
        const quad=(xa,pa,qa,xb,pb,qb)=>{
            const build=(pa+pb)>=(qa+qb);
            return '<polygon points="'+xa+','+y(pa)+' '+xb+','+y(pb)+' '+xb+','+y(qb)+' '+xa+','+y(qa)+'" fill="'+(build?C.produced:C.sold)+'" fill-opacity=".14"/>';
        };
        if(d0*d1<0){
            const t=d0/(d0-d1), xm=x(i)+(x(i+1)-x(i))*t, pm=p0+(p1-p0)*t;
            s+=quad(x(i),p0,q0,xm,pm,pm)+quad(xm,pm,pm,x(i+1),p1,q1);
        }else{
            s+=quad(x(i),p0,q0,x(i+1),p1,q1);
        }
    }
    const pts=key=>rows.map((r,i)=>x(i)+','+y(r[key])).join(' ');
    s+='<polyline points="'+pts('sold')+'" fill="none" stroke="'+C.sold+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s+='<polyline points="'+pts('produced')+'" fill="none" stroke="'+C.produced+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    if(!opts.compact && n<=26){
        rows.forEach((r,i)=>{
            s+='<circle cx="'+x(i)+'" cy="'+y(r.sold)+'" r="4" fill="'+C.sold+'" stroke="'+C.surface+'" stroke-width="2"/>';
            s+='<circle cx="'+x(i)+'" cy="'+y(r.produced)+'" r="4" fill="'+C.produced+'" stroke="'+C.surface+'" stroke-width="2"/>';
        });
    }
    if(!opts.compact && n){
        // direct labels at the line ends, nudged apart if they collide
        const last=rows[n-1]; let yp=y(last.produced), ys=y(last.sold);
        if(Math.abs(yp-ys)<14){ if(yp<=ys){yp-=7;ys+=7;} else {yp+=7;ys-=7;} }
        s+='<text class="ov-axis" style="fill:var(--text)" x="'+(W-padR+8)+'" y="'+(yp+4)+'">Produced</text>';
        s+='<text class="ov-axis" style="fill:var(--text)" x="'+(W-padR+8)+'" y="'+(ys+4)+'">Sold</text>';
    }
    // hover layer: hairline + hit rect
    s+='<line class="ov-hair" id="'+opts.id+'-hair" x1="0" x2="0" y1="'+padT+'" y2="'+(padT+ph)+'" style="display:none"/>';
    s+='<g id="'+opts.id+'-dots" style="display:none"><circle r="5" fill="'+C.sold+'" stroke="'+C.surface+'" stroke-width="2"/><circle r="5" fill="'+C.produced+'" stroke="'+C.surface+'" stroke-width="2"/></g>';
    s+='<rect x="'+padL+'" y="'+padT+'" width="'+pw+'" height="'+ph+'" fill="transparent" id="'+opts.id+'-hit"/>';
    s+='</svg><div class="ov-tip" id="'+opts.id+'-tip"></div>';
    host.innerHTML='<div class="ov-wrap">'+s+'</div>';

    const wrap=host.firstChild, svg=wrap.querySelector('svg');
    const hit=svg.querySelector('#'+opts.id+'-hit'), hair=svg.querySelector('#'+opts.id+'-hair');
    const dots=svg.querySelector('#'+opts.id+'-dots'), tip=wrap.querySelector('#'+opts.id+'-tip');
    const show=i=>{
        const r=rows[i], xx=x(i);
        hair.setAttribute('x1',xx); hair.setAttribute('x2',xx); hair.style.display='';
        const cs=dots.querySelectorAll('circle');
        cs[0].setAttribute('cx',xx); cs[0].setAttribute('cy',y(r.sold));
        cs[1].setAttribute('cx',xx); cs[1].setAttribute('cy',y(r.produced));
        dots.style.display='';
        tip.textContent='';
        const d=document.createElement('div'); d.className='t-date'; d.textContent=r.title||r.label; tip.appendChild(d);
        [['Produced',r.produced,C.produced],['Sold',r.sold,C.sold]].forEach(([name,val,col])=>{
            const row=document.createElement('div'); row.className='t-row';
            const k=document.createElement('span'); k.className='t-key'; k.style.borderColor=col;
            const b=document.createElement('b'); b.textContent=ovFmt(val);
            const l=document.createElement('span'); l.textContent=name;
            row.appendChild(k); row.appendChild(b); row.appendChild(l); tip.appendChild(row);
        });
        const net=document.createElement('div'); net.className='t-row';
        const nb=document.createElement('b'); const diff=r.produced-r.sold; nb.textContent=(diff>0?'+':'')+ovFmt(diff);
        const nl=document.createElement('span'); nl.textContent=diff>=0?'stock built':'stock drawn';
        net.appendChild(document.createElement('span')).className='t-key'; net.appendChild(nb); net.appendChild(nl); tip.appendChild(net);
        tip.style.display='block';
        const scale=wrap.clientWidth/W, px=xx*scale;
        tip.style.top=(padT*scale)+'px';
        if(px>wrap.clientWidth/2){ tip.style.right=(wrap.clientWidth-px+10)+'px'; tip.style.left='auto'; }
        else { tip.style.left=(px+10)+'px'; tip.style.right='auto'; }
    };
    const hide=()=>{ hair.style.display='none'; dots.style.display='none'; tip.style.display='none'; };
    hit.addEventListener('pointermove',ev=>{
        const rect=svg.getBoundingClientRect();
        const mx=(ev.clientX-rect.left)*(W/rect.width);
        let best=0, bd=Infinity;
        for(let i=0;i<n;i++){ const d=Math.abs(x(i)-mx); if(d<bd){bd=d;best=i;} }
        show(best);
    });
    hit.addEventListener('pointerleave',hide);
}

function renderOverlay(){
    const d=_ovData; if(!d) return;
    const main=document.getElementById('ov-main'); main.style.opacity='1';
    const C=ovColors();
    let periods=(d.periods||[]).filter(p=>!p.future);   // nothing to plot for a period that hasn't started
    // drop leading periods from before the records begin (a 5-year view on 2 years of data), keep ≥2 points
    while(periods.length>2 && !periods[0].produced_total && !periods[0].sold_total) periods=periods.slice(1);
    const unitWord = d.unit || 'week';
    const titleOf=p=>(unitWord==='week'?'Week of '+p.label:p.label)+(p.partial?' (so far)':'');
    const rows=periods.map(p=>({label:p.label, title:titleOf(p), produced:p.produced_total, sold:p.sold_total}));
    const totalP=rows.reduce((a,r)=>a+r.produced,0), totalS=rows.reduce((a,r)=>a+r.sold,0);
    if(!rows.length || (!totalP && !totalS)){
        main.innerHTML='<div class="ov-status">No production or sales in this window.</div>';
        document.getElementById('ov-multiples').innerHTML='';
        document.getElementById('ov-table').innerHTML='';
        document.getElementById('ov-legend').innerHTML='';
        return;
    }
    const net=totalP-totalS;
    document.getElementById('ov-sub').innerHTML =
        'Jars per '+unitWord+', '+rows[0].label+' – '+rows[rows.length-1].label+' ('+rows.length+' '+unitWord+(rows.length===1?'':'s')+(periods[periods.length-1].partial?', the last one still running':'')+'): <strong>'+ovFmt(totalP)+' produced</strong> vs <strong>'+ovFmt(totalS)+' sold</strong>, '
        + (net>=0 ? 'so stock grew by <strong>'+ovFmt(net)+'</strong>.' : 'so stock fell by <strong>'+ovFmt(-net)+'</strong>.')
        + ' <span style="color:var(--text-light)">Jars only (876 / 750 / 473 ml, frozen, Back Bar); Kettle\'s End is not a product, so it is left out.</span>';
    document.getElementById('ov-legend').innerHTML =
        '<span><i class="ov-key" style="border-color:'+C.produced+'"></i>Produced</span>'
        + '<span><i class="ov-key" style="border-color:'+C.sold+'"></i>Sold</span>'
        + '<span><i class="ov-swatch" style="background:'+C.produced+';opacity:.25"></i>stock building</span>'
        + '<span><i class="ov-swatch" style="background:'+C.sold+';opacity:.25"></i>stock drawing down</span>';

    const yMax=Math.max(...rows.map(r=>Math.max(r.produced,r.sold)),1);
    ovChart(main, rows, {id:'ovm', yMax:yMax, aria:'Produced vs sold, all jars'});

    // small multiples, one per format, sharing a y scale
    const mult=document.getElementById('ov-multiples'); mult.innerHTML='';
    let subMax=1;
    d.buckets.forEach(b=>periods.forEach(p=>{ subMax=Math.max(subMax,p.produced[b]||0,p.sold[b]||0); }));
    d.buckets.forEach((b,bi)=>{
        const panel=document.createElement('div'); panel.className='ov-panel';
        const bp=periods.reduce((a,p)=>a+(p.produced[b]||0),0), bs=periods.reduce((a,p)=>a+(p.sold[b]||0),0);
        const t=document.createElement('div'); t.className='ov-panel-title';
        const tn=document.createElement('span'); tn.textContent=OV_LABELS[b]||b;
        const ts=document.createElement('small'); ts.textContent=ovFmt(bp)+' / '+ovFmt(bs);
        t.appendChild(tn); t.appendChild(ts); panel.appendChild(t);
        const host=document.createElement('div'); panel.appendChild(host); mult.appendChild(panel);
        const brows=periods.map(p=>({label:p.label, title:(OV_LABELS[b]||b)+' · '+titleOf(p), produced:p.produced[b]||0, sold:p.sold[b]||0}));
        ovChart(host, brows, {id:'ovs'+bi, yMax:subMax, compact:true, aria:(OV_LABELS[b]||b)+' produced vs sold'});
    });

    // table view — every value reachable without hovering
    const tbl=document.getElementById('ov-table');
    let h='<table><thead><tr><th>'+(unitWord==='week'?'Week of':unitWord==='month'?'Month':'Year')+'</th><th>Produced</th><th>Sold</th><th>Net</th>';
    d.buckets.forEach(b=>{ h+='<th>'+(OV_LABELS[b]||b)+' made</th><th>'+(OV_LABELS[b]||b)+' sold</th>'; });
    h+='</tr></thead><tbody>';
    periods.forEach(p=>{
        const diff=p.produced_total-p.sold_total;
        h+='<tr><td>'+p.label+(p.partial?' <span style="color:var(--text-light)">(so far)</span>':'')+'</td><td>'+ovFmt(p.produced_total)+'</td><td>'+ovFmt(p.sold_total)+'</td><td>'+(diff>0?'+':'')+ovFmt(diff)+'</td>';
        d.buckets.forEach(b=>{ h+='<td>'+ovFmt(p.produced[b]||0)+'</td><td>'+ovFmt(p.sold[b]||0)+'</td>'; });
        h+='</tr>';
    });
    h+='<tr><td><strong>Total</strong></td><td><strong>'+ovFmt(totalP)+'</strong></td><td><strong>'+ovFmt(totalS)+'</strong></td><td><strong>'+(net>0?'+':'')+ovFmt(net)+'</strong></td>';
    d.buckets.forEach(b=>{ h+='<td>'+ovFmt(periods.reduce((a,p)=>a+(p.produced[b]||0),0))+'</td><td>'+ovFmt(periods.reduce((a,p)=>a+(p.sold[b]||0),0))+'</td>'; });
    h+='</tr></tbody></table>';
    tbl.innerHTML=h;
}

let _ovResizeT=null;
window.addEventListener('resize',function(){ clearTimeout(_ovResizeT); _ovResizeT=setTimeout(renderOverlay,150); });

document.addEventListener('DOMContentLoaded',function(){buildPicker();loadData();ovBuildPicker();loadOverlay();});
</script>
<script>
(function(){
  var back = document.getElementById('nav-back');
  var fwd  = document.getElementById('nav-fwd');
  // history.length==1 means no history to go back to
  if(back) back.disabled = (window.history.length <= 1);
  if(back) back.onclick = function(){ window.history.back(); };
  if(fwd)  fwd.onclick  = function(){ window.history.forward(); };
  // Update disabled state after navigation
  window.addEventListener('popstate', function(){
    if(back) back.disabled = (window.history.length <= 1);
  });
})();
</script>
