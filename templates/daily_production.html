<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Soma - Daily Production</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.kettle-block { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
.kettle-header { background: var(--dark); color: #fff; padding: 10px 16px; font-weight: 700; font-size: 14px; text-align: center; }
.t-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: 100px; }
.t-side { padding: 12px 16px; }
.t-side:first-child { border-right: 2px solid var(--border); }
.t-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
.t-label.finish { background: #fce4ec; color: #c62828; }
.t-label.start { background: #e8f5e9; color: #2e7d32; }
.recipe-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--dark); }
.recipe-format { font-size: 11px; color: var(--text-light); margin-bottom: 8px; }
.special-box { background: var(--warning); padding: 6px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
.ingredient-section { margin-bottom: 8px; }
.ingredient-header { background: var(--dark); color: #fff; padding: 4px 8px; font-size: 10px; font-weight: 600; border-radius: 3px; margin-bottom: 4px; }
.ingredient-item { font-size: 11px; padding: 3px 8px; border-bottom: 1px solid var(--border); }
.ingredient-item:last-child { border-bottom: none; }
.finish-inputs { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.finish-inputs label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; }
.finish-inputs input, .finish-inputs textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; font-family: inherit; margin-bottom: 8px; -webkit-appearance: none; }
.finish-inputs textarea { min-height: 50px; resize: vertical; }
.label-btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; }
.label-btn:hover { background: var(--accent-light); }
.no-production { color: var(--text-light); font-size: 12px; padding: 20px; text-align: center; }

/* iPad-friendly checkboxes */
.ccp-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.ccp-header { background: var(--accent); color: #fff; padding: 12px 16px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.ccp-check-wrap { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
.ccp-check-wrap input[type="checkbox"] {
    position: absolute; top: 0; left: 0;
    width: 32px; height: 32px;
    opacity: 0; cursor: pointer; z-index: 2;
    -webkit-appearance: none;
    margin: 0; padding: 0;
}
.ccp-check-visual {
    position: absolute; top: 0; left: 0;
    width: 28px; height: 28px;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    transition: all 0.15s;
}
.ccp-check-wrap input:checked + .ccp-check-visual {
    background: white;
    border-color: white;
}
.ccp-check-wrap input:checked + .ccp-check-visual::after {
    content: '\\2713';
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
}
.ccp-item { font-size: 13px; padding: 8px 16px; border-bottom: 1px solid var(--border); line-height: 1.4; }
.ccp-item:last-child { border-bottom: none; }
.ccp-item:nth-child(even) { background: var(--row-alt); }
.ccp-item.callout { background: var(--warning); font-weight: 600; }

.signoff-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 12px; }
.signoff-row { display: flex; gap: 12px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
.signoff-row label { font-size: 13px; font-weight: 600; width: 140px; }
.signoff-row input { flex: 1; min-width: 160px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; -webkit-appearance: none; }
.complete-bar { text-align: center; padding: 20px; }
.btn-complete { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 16px 36px; font-size: 17px; font-weight: 600; cursor: pointer; -webkit-appearance: none; }
.btn-complete:hover { background: var(--accent-light); }
.btn-complete:disabled { background: #ccc; }
.complete-msg { margin-top: 10px; font-size: 13px; }
.info-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; }
.info-bar strong { color: var(--dark); }
.save-indicator { font-size: 12px; color: var(--text-light); text-align: center; margin-bottom: 8px; }
.save-indicator.saved { color: var(--accent); }
.pct-bar { background: var(--border); border-radius: 4px; height: 8px; margin-bottom: 16px; overflow: hidden; }
.pct-fill { background: var(--accent); height: 100%; transition: width 0.3s; border-radius: 4px; }
.pct-label { font-size: 12px; color: var(--text-light); margin-bottom: 4px; }

@media (max-width: 768px) {
    .t-layout { grid-template-columns: 1fr; }
    .t-side:first-child { border-right: none; border-bottom: 2px solid var(--border); }
    .signoff-row { flex-direction: column; align-items: stretch; }
    .signoff-row label { width: auto; }
}
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Daily Production</h1><p id="header-sub">Loading...</p></div>
    <div class="header-right"><a href="/" class="header-btn">Back to Dashboard</a></div>
</div>
<div class="main">
    <div class="info-bar" id="info-bar">Loading...</div>
    <div class="pct-label"><span id="pct-text">0% Complete</span></div>
    <div class="pct-bar"><div class="pct-fill" id="pct-fill" style="width:0%"></div></div>
    <div id="kettles-container"></div>

    <div class="card"><h2>CCP Checklist</h2><p style="font-size:12px;color:var(--text-light);margin-bottom:12px;">Tap the checkbox on each section header to confirm all items are completed.</p></div>
    <div id="ccp-container"></div>

    <div class="card">
        <h3>Daily Notes</h3>
        <textarea id="day-notes" style="width:100%;min-height:60px;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;-webkit-appearance:none;" oninput="autoSave()"></textarea>
    </div>

    <div class="signoff-section">
        <h3 style="font-size:14px;margin-bottom:12px;">Final Sign-Off</h3>
        <div class="signoff-row"><label>Kitchen Lead:</label><input type="text" id="signoff-kitchen" oninput="autoSave()"></div>
        <div class="signoff-row"><label>Production Manager:</label><input type="text" id="signoff-manager" oninput="autoSave()"></div>
    </div>

    <div id="save-indicator" class="save-indicator">Not yet saved</div>

    <div class="complete-bar">
        <button class="btn-complete" id="complete-btn" onclick="completeAndFile()">Complete & File</button>
        <div class="complete-msg" id="complete-msg"></div>
    </div>
</div>

<script>
var WEEK_ID = '{{ week_id }}';
var DAY_IDX = {{ day_idx }};
var DAYS_LIST = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var VESSELS = ['K1','K2','K3','K4(115L)'];
var productionData = null;
var ccpSections = [];
var saveTimeout = null;

async function init() {
    var prodRes = await fetch('/api/daily-production/' + WEEK_ID + '/' + DAY_IDX);
    var ccpRes = await fetch('/api/ccp-master');
    var clRes = await fetch('/api/checklist/' + WEEK_ID + '/' + DAY_IDX);
    productionData = await prodRes.json();
    ccpSections = await ccpRes.json();
    var clData = await clRes.json();

    document.getElementById('header-sub').textContent = productionData.day_name + ' - ' + productionData.date;
    var infoHtml = '<strong>DATE:</strong> ' + productionData.date;
    infoHtml += '&nbsp;&nbsp;&nbsp;<strong>START LOT#:</strong> ' + productionData.lot;
    infoHtml += '&nbsp;&nbsp;&nbsp;<strong>FINISH LOT#:</strong> ' + productionData.prev_lot;
    document.getElementById('info-bar').innerHTML = infoHtml;

    buildKettles();
    buildCCP();
    if (clData.checklist) restoreData(clData.checklist);
    updatePct();
}

function buildKettles() {
    var container = document.getElementById('kettles-container');
    var html = '';
    for (var vi = 0; vi < VESSELS.length; vi++) {
        var vessel = VESSELS[vi];
        var finish = productionData.finish[vessel];
        var start = productionData.start[vessel];
        if (!finish && !start) continue;
        html += '<div class="kettle-block"><div class="kettle-header">' + vessel + '</div><div class="t-layout">';
        html += '<div class="t-side"><span class="t-label finish">FINISH</span>';
        if (finish) { html += buildRecipeCard(finish, vessel, 'finish'); }
        else { html += '<div class="no-production">No production to finish</div>'; }
        html += '</div>';
        html += '<div class="t-side"><span class="t-label start">START</span>';
        if (start) { html += buildRecipeCard(start, vessel, 'start'); }
        else { html += '<div class="no-production">No production to start</div>'; }
        html += '</div></div></div>';
    }
    if (!html) html = '<div class="card" style="text-align:center;color:var(--text-light);padding:40px;">No production scheduled</div>';
    container.innerHTML = html;
}

function buildRecipeCard(data, vessel, side) {
    var r = data.details;
    var name = data.recipe;
    var html = '<div class="recipe-title">' + name + '</div>';
    html += '<div class="recipe-format">' + (r.format || '') + ' | Target: ' + (r.yield || '--') + ' units</div>';
    if (r.special_instructions && r.special_instructions.length) {
        html += '<div class="special-box">';
        for (var i = 0; i < r.special_instructions.length; i++) html += r.special_instructions[i] + '<br>';
        html += '</div>';
    }
    var secs = [['Add to kettle overnight', r.kettle_overnight],['Add after skim', r.after_skim],['Finishing', r.finishing],['Add to jar/container', r.add_to_jar]];
    for (var s = 0; s < secs.length; s++) {
        var title = secs[s][0]; var items = secs[s][1];
        if (items && items.length) {
            html += '<div class="ingredient-section"><div class="ingredient-header">' + title + '</div>';
            for (var j = 0; j < items.length; j++) html += '<div class="ingredient-item">' + items[j] + '</div>';
            html += '</div>';
        }
    }
    if (side === 'finish') {
        var vid = vessel.replace(/[()]/g, '');
        html += '<div class="finish-inputs">';
        html += '<label>Amount Produced</label><input type="number" id="produced-' + vid + '" placeholder="units" oninput="autoSave();updatePct()">';
        html += '<button class="label-btn" onclick="generateLabel(\'' + name.replace(/'/g, "\\'") + '\')">Generate Label</button>';
        html += '<label style="margin-top:8px;">Notes</label><textarea id="fnotes-' + vid + '" placeholder="Finish notes..." oninput="autoSave()"></textarea>';
        html += '</div>';
    }
    return html;
}

function buildCCP() {
    var container = document.getElementById('ccp-container');
    var html = '';
    for (var i = 0; i < ccpSections.length; i++) {
        var sec = ccpSections[i];
        var checkId = 'section-' + sec.num;
        html += '<div class="ccp-section"><div class="ccp-header"><span>' + sec.num + '  ' + sec.title + '</span>';
        html += '<div class="ccp-check-wrap"><input type="checkbox" id="' + checkId + '" onchange="autoSave();updatePct()"><div class="ccp-check-visual"></div></div>';
        html += '</div>';
        for (var j = 0; j < sec.items.length; j++) {
            var item = sec.items[j];
            var cls = (item.toUpperCase().indexOf('CANNER') >= 0 && item.indexOf('Kitchen Lead') >= 0) ? 'ccp-item callout' : 'ccp-item';
            html += '<div class="' + cls + '">' + item + '</div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

function updatePct() {
    var total = 0; var done = 0;
    // CCP sections
    for (var i = 0; i < ccpSections.length; i++) {
        total++;
        var el = document.getElementById('section-' + ccpSections[i].num);
        if (el && el.checked) done++;
    }
    // Amount produced for each finish kettle
    for (var v = 0; v < VESSELS.length; v++) {
        var vid = VESSELS[v].replace(/[()]/g, '');
        var pel = document.getElementById('produced-' + vid);
        if (pel) { total++; if (pel.value) done++; }
    }
    // Sign-offs
    total += 2;
    if (document.getElementById('signoff-kitchen').value) done++;
    if (document.getElementById('signoff-manager').value) done++;

    var pct = total > 0 ? Math.round(done / total * 100) : 0;
    document.getElementById('pct-text').textContent = pct + '% Complete';
    document.getElementById('pct-fill').style.width = pct + '%';
}

function collectData() {
    var data = {checks: {}, produced: {}, finish_notes: {}, notes: '', signoff_kitchen: '', signoff_manager: ''};
    for (var i = 0; i < ccpSections.length; i++) {
        var el = document.getElementById('section-' + ccpSections[i].num);
        if (el) data.checks['section-' + ccpSections[i].num] = el.checked;
    }
    for (var v = 0; v < VESSELS.length; v++) {
        var vid = VESSELS[v].replace(/[()]/g, '');
        var pel = document.getElementById('produced-' + vid);
        if (pel) data.produced[vid] = pel.value;
        var nel = document.getElementById('fnotes-' + vid);
        if (nel) data.finish_notes[vid] = nel.value;
    }
    data.notes = document.getElementById('day-notes').value;
    data.signoff_kitchen = document.getElementById('signoff-kitchen').value;
    data.signoff_manager = document.getElementById('signoff-manager').value;
    return data;
}

function restoreData(d) {
    if (d.checks) Object.keys(d.checks).forEach(function(k) { var el = document.getElementById(k); if (el) el.checked = d.checks[k]; });
    if (d.produced) Object.keys(d.produced).forEach(function(k) { var el = document.getElementById('produced-' + k); if (el) el.value = d.produced[k]; });
    if (d.finish_notes) Object.keys(d.finish_notes).forEach(function(k) { var el = document.getElementById('fnotes-' + k); if (el) el.value = d.finish_notes[k]; });
    if (d.notes) document.getElementById('day-notes').value = d.notes;
    if (d.signoff_kitchen) document.getElementById('signoff-kitchen').value = d.signoff_kitchen;
    if (d.signoff_manager) document.getElementById('signoff-manager').value = d.signoff_manager;
    updatePct();
}

function autoSave() {
    var ind = document.getElementById('save-indicator');
    ind.textContent = 'Saving...'; ind.className = 'save-indicator';
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async function() {
        try {
            await fetch('/api/daily-production/' + WEEK_ID + '/' + DAY_IDX + '/save', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(collectData()),
            });
            ind.textContent = 'Saved'; ind.className = 'save-indicator saved';
        } catch (e) { ind.textContent = 'Save failed'; }
    }, 800);
}

async function generateLabel(recipeName) {
    try {
        var res = await fetch('/api/label', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({product_name: recipeName, lot: productionData.prev_lot, production_date: productionData.date}),
        });
        if (res.ok) {
            var blob = await res.blob();
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = 'Label_' + recipeName.replace(/[^a-zA-Z0-9]/g, '_') + '.pdf';
            a.click(); URL.revokeObjectURL(url);
        }
    } catch (e) { alert('Label generation failed'); }
}

async function completeAndFile() {
    var btn = document.getElementById('complete-btn');
    var msg = document.getElementById('complete-msg');
    btn.disabled = true; btn.textContent = 'Filing...';
    try {
        var res = await fetch('/api/checklist/' + WEEK_ID + '/' + DAY_IDX + '/complete', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(collectData()),
        });
        var result = await res.json();
        if (result.success) {
            msg.style.color = 'var(--accent)'; msg.textContent = 'Filed successfully! Redirecting...';
            setTimeout(function() { window.location.href = '/'; }, 1500);
        } else {
            msg.style.color = '#dc3545'; msg.textContent = result.error || 'Failed';
            btn.disabled = false; btn.textContent = 'Complete & File';
        }
    } catch (e) {
        msg.style.color = '#dc3545'; msg.textContent = 'Error: ' + e.message;
        btn.disabled = false; btn.textContent = 'Complete & File';
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
