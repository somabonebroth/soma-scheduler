<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Traceability Records</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.week-record { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.week-header { background: var(--dark); color: #fff; padding: 12px 18px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.week-header:hover { background: #2a2a4e; }
.week-days { padding: 0; display: none; }
.week-days.open { display: block; }
.day-record { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.day-record:last-child { border-bottom: none; }
.day-record:nth-child(even) { background: var(--row-alt); }
.day-name { font-weight: 600; }
.day-time { font-size: 11px; color: var(--text-light); }
.organic-badge { font-size: 10px; background: #e8f5e9; color: #2e7d32; padding: 1px 6px; border-radius: 8px; font-weight: 600; margin-left: 6px; }
.day-actions { display: flex; gap: 10px; align-items: center; }
.day-actions a { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 13px; }
.day-actions a:hover { text-decoration: underline; }
.day-actions button { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }
.day-actions button:hover { background: var(--danger); color: #fff; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.download-week { font-size: 12px; }
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.filter-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--card-bg); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Traceability Records</h1><p id="trace-subtitle">Non-Organic Certified</p></div>
    <div class="header-right"><a href="/" class="header-btn">Back to Dashboard</a></div>
</div>
<div class="main">
    <div class="filter-bar">
        <button class="filter-btn active" id="filter-all" onclick="loadRecords('all',this)">All Records</button>
        <button class="filter-btn" id="filter-nonorg" onclick="loadRecords('non-organic',this)">Non-Organic</button>
        <button class="filter-btn" id="filter-org" onclick="loadRecords('organic',this)">Organic</button>
    </div>
    <div id="records-container"><div class="empty-state">Loading...</div></div>
</div>
<script>
var currentFilter='all';

async function loadRecords(filter,btn){
    if(filter)currentFilter=filter;
    if(btn){document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');}
    var subtitle='All Records';
    if(currentFilter==='organic')subtitle='Organic Certified';
    else if(currentFilter==='non-organic')subtitle='Non-Organic Certified';
    document.getElementById('trace-subtitle').textContent=subtitle;

    var url='/api/traceability';
    if(currentFilter!=='all')url+='?filter='+currentFilter;
    var res=await fetch(url);
    var records=await res.json();
    var container=document.getElementById('records-container');
    if(!records.length){container.innerHTML='<div class="empty-state"><h2>No Records</h2><p>Completed daily production checklists will appear here.</p></div>';return;}
    var html='';
    for(var i=0;i<records.length;i++){
        var rec=records[i];
        var weekStart=new Date(rec.week_id+'T00:00:00');
        var label=weekStart.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
        html+='<div class="week-record"><div class="week-header" onclick="toggleWeek(this)"><span>Week of '+label+'</span><span class="download-week"><a href="/api/pdfs/'+rec.week_id+'/download-all" style="color:#aaa;text-decoration:none;" onclick="event.stopPropagation();">Download All</a></span></div><div class="week-days">';
        for(var j=0;j<rec.days.length;j++){
            var day=rec.days[j];
            var timeStr=day.last_updated?day.last_updated.substring(0,16).replace('T',' '):'';
            var orgBadge=day.has_organic?'<span class="organic-badge">Organic</span>':'';
            html+='<div class="day-record"><div><span class="day-name">'+day.day_name+'</span>'+orgBadge+'<br><span class="day-time">Completed: '+timeStr+'</span></div><div class="day-actions"><a href="/daily-production/'+rec.week_id+'/'+day.day_idx+'">View</a><a href="/api/pdf/'+rec.week_id+'/'+day.day_name+'_Completed_Checklist.pdf" target="_blank">Download PDF</a><button onclick="deleteRecord(\''+rec.week_id+'\','+day.day_idx+',\''+day.day_name+'\')">Delete</button></div></div>';
        }
        html+='</div></div>';
    }
    container.innerHTML=html;
}

function toggleWeek(el){el.nextElementSibling.classList.toggle('open');}

async function deleteRecord(weekId,dayIdx,dayName){
    if(!confirm('Delete '+dayName+' record?'))return;
    var res=await fetch('/api/traceability/'+weekId+'/'+dayIdx,{method:'DELETE'});
    if(res.ok)loadRecords();
    else alert('Failed to delete');
}

document.addEventListener('DOMContentLoaded',function(){loadRecords('all',document.getElementById('filter-all'));});
</script>
</body>
</html>
