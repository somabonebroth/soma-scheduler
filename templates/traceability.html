<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="var(--black)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Completed Production</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.week-record { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.week-header { background: var(--dark); color: var(--white); padding: 12px 18px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 12px; }
.week-header:hover { background: #2a2a4e; }
.week-header-label { display: flex; align-items: center; gap: 10px; flex: 1; }
.week-status-badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 700; letter-spacing: 0.4px; }
.week-status-badge.confirmed { background: #2d5f3f; color: var(--white); }
.week-status-badge.ready { background: var(--amber-text); color: var(--white); }
.week-status-badge.partial { background: #6c757d; color: var(--white); }
.week-days { padding: 0; display: none; }
.week-days.open { display: block; }
.day-record { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.day-record:last-child { border-bottom: none; }
.day-record:nth-child(even) { background: var(--row-alt); }
.day-name { font-weight: 600; }
.day-time { font-size: 11px; color: var(--text-light); }
.organic-badge { font-size: 10px; background: var(--action-green-bg); color: var(--action-green); padding: 1px 6px; border-radius: 8px; font-weight: 600; margin-left: 6px; }
.day-actions { display: flex; gap: 10px; align-items: center; }
.day-actions a { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 13px; }
.day-actions a:hover { text-decoration: underline; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.download-week { font-size: 12px; }

/* One line per week: review state + link, then the week's totals (2026-10-01) */
.week-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 18px; background: var(--row-alt); border-bottom: 1px solid var(--border); font-size: 13px; }
.week-meta a { color: var(--accent); font-weight: 600; text-decoration: none; }
.week-totals { padding: 8px 18px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-light); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.week-totals b { color: var(--dark); }
.day-actions a.del { color: var(--text-light); font-weight: 400; font-size: 12px; }
.day-actions a.del:hover { color: var(--danger); }
.show-older { display: block; margin: 8px auto; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Completed Production</h1><p>Soma Bone Broth</p></div>
    <div class="header-right" style="display:flex;align-items:center;gap:8px;">
    <div class="nav-arrows"><button class="nav-arrow-btn" id="nav-back" title="Back">&#8592;</button><button class="nav-arrow-btn" id="nav-fwd" title="Forward">&#8594;</button></div>
    <a href="/" class="header-btn">⌂ Dashboard</a>
  </div>
</div>
<div class="main">
    <div id="records-container"><div class="empty-state">Loading...</div></div>
</div>
<div class="modal-overlay" id="confirm-modal">
    <div class="modal" style="max-width:440px;">
        <h2 id="confirm-title" style="margin-bottom:10px;">Confirm</h2>
        <p id="confirm-message" style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:18px;"></p>
        <div class="modal-actions" style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px;padding-top:14px;border-top:1px solid var(--border);">
            <button class="btn btn-outline" id="confirm-cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="confirm-ok-btn">Confirm</button>
        </div>
    </div>
</div>
<script>
function mobileConfirm(message, opts){
    opts = opts || {};
    return new Promise(function(resolve){
        var modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-title').textContent = opts.title || 'Confirm';
        document.getElementById('confirm-message').textContent = message;
        var okBtn = document.getElementById('confirm-ok-btn');
        var cancelBtn = document.getElementById('confirm-cancel-btn');
        okBtn.textContent = opts.okLabel || 'Confirm';
        cancelBtn.textContent = opts.cancelLabel || 'Cancel';
        if(opts.danger){ okBtn.style.background='#c62828'; okBtn.style.borderColor='#c62828'; }
        else { okBtn.style.background=''; okBtn.style.borderColor=''; }
        function cleanup(result){
            modal.classList.remove('active');
            okBtn.onclick = null; cancelBtn.onclick = null; modal.onclick = null;
            resolve(result);
        }
        okBtn.onclick = function(){ cleanup(true); };
        cancelBtn.onclick = function(){ cleanup(false); };
        modal.onclick = function(e){ if(e.target === modal) cleanup(false); };
        modal.classList.add('active');
    });
}
</script>
<script>
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const WEEKS_SHOWN = 8;
let _records = [], _showAll = false;

async function loadRecords(){
    var res=await fetch('/api/traceability');
    _records=await res.json();
    renderRecords();
}

function dayLine(d){
    var t=d.last_updated?new Date(d.last_updated):null;
    var date=d.date?new Date(d.date+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short',day:'numeric',month:'short'}):d.day_name;
    return date+(t&&!isNaN(t)?' &middot; done '+t.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'}):'');
}

function renderRecords(){
    var container=document.getElementById('records-container');
    if(!_records.length){container.innerHTML='<div class="empty-state"><h2>No Records</h2><p>Completed daily production checklists will appear here.</p></div>';return;}
    var list=_showAll?_records:_records.slice(0,WEEKS_SHOWN);
    var html='';
    list.forEach(function(rec){
        var label=new Date(rec.week_id+'T00:00:00').toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'});
        var days=rec.days||[];
        var pending=days.filter(function(d){return !d.signoff;});
        // Weeks signed under the retired weekly sign-off count as reviewed.
        var done=rec.hoo_signoff||(days.length&&!pending.length);
        var badge=done?'<span class="week-status-badge confirmed">Reviewed</span>'
            :'<span class="week-status-badge ready">'+(days.length-pending.length)+' of '+days.length+' reviewed</span>';
        html+='<div class="week-record"><div class="week-header" onclick="toggleWeek(this,\''+rec.week_id+'\')">'
            +'<div class="week-header-label"><span>Week of '+label+'</span>'+badge+'</div></div><div class="week-days">';
        var meta=done
            ?'<span>&#10003; Every day reviewed</span>'
            :'<span>'+pending.length+' day'+(pending.length===1?'':'s')+' to review &middot; <a href="/daily-review?date='+pending[0].date+'">Review &rarr;</a></span>';
        html+='<div class="week-meta">'+meta+'<a href="/api/pdfs/'+rec.week_id+'/download-all">Download all PDFs</a></div>';
        html+='<div class="week-totals" id="tot-'+rec.week_id+'"></div>';
        days.forEach(function(day){
            var certs=day.certifications||(day.certification?[day.certification]:[]);
            var certBadges=certs.map(function(c){
                return /organic/i.test(c)
                    ? '<span class="organic-badge">'+escHtml(c)+'</span>'
                    : '<span class="organic-badge" style="background:#ececec;color:#555;">'+escHtml(c)+'</span>';
            }).join(' ');
            var certDetail='';
            if(certs.length>1 && day.cert_by_vessel){
                var parts=Object.keys(day.cert_by_vessel).map(function(v){return escHtml(v)+': '+escHtml(day.cert_by_vessel[v]);});
                certDetail='<br><span class="day-time" style="color:#8a6d00;">⚠ Mixed certification — '+parts.join(', ')+'</span>';
            }
            // A reviewed day is locked (the server refuses too).
            var del=(rec.hoo_signoff||day.signoff)?'':'<a href="#" class="del" onclick="deleteRecord(\''+rec.week_id+'\','+day.day_idx+',\''+day.day_name+'\');return false;">Delete</a>';
            html+='<div class="day-record"><div><span class="day-name">'+dayLine(day)+'</span> '+certBadges+certDetail+'</div>'
                +'<div class="day-actions"><a href="/daily-production/'+rec.week_id+'/'+day.day_idx+'">View</a>'
                +'<a href="/api/pdf/'+rec.week_id+'/'+day.day_name+'_Completed_Checklist.pdf" target="_blank">PDF</a>'+del+'</div></div>';
        });
        html+='</div></div>';
    });
    if(!_showAll && _records.length>WEEKS_SHOWN)
        html+='<button class="btn btn-outline show-older" onclick="_showAll=true;renderRecords();">Show older weeks ('+(_records.length-WEEKS_SHOWN)+')</button>';
    container.innerHTML=html;
}

// A week's production totals load when it is opened (one call per week).
async function toggleWeek(el,weekId){
    var box=el.nextElementSibling;
    box.classList.toggle('open');
    var tot=document.getElementById('tot-'+weekId);
    if(!box.classList.contains('open')||tot.dataset.loaded) return;
    tot.dataset.loaded='1';
    try{
        var d=await (await fetch('/api/traceability/'+weekId+'/summary')).json();
        var e=Object.entries(d.total_produced||{});
        if(!e.length){tot.style.display='none';return;}
        var all=e.reduce(function(a,kv){return a+kv[1];},0);
        tot.innerHTML=e.map(function(kv){return '<span>'+escHtml(kv[0])+' <b>'+kv[1]+'</b></span>';}).join('')
            +'<span>Total <b>'+all+' jars</b> ('+Math.floor(all/12)+' cases)</span>';
    }catch(err){tot.style.display='none';}
}

async function deleteRecord(weekId,dayIdx,dayName){
    var ok = await mobileConfirm('Delete '+dayName+' record?',
        {title:'Delete record?', okLabel:'Delete', danger:true});
    if(!ok) return;
    var res=await fetch('/api/traceability/'+weekId+'/'+dayIdx,{method:'DELETE'});
    if(res.ok)loadRecords();
    else alert('Failed to delete');
}

document.addEventListener('DOMContentLoaded',function(){
    loadRecords();
});
</script>
<script>
(function(){
  var back = document.getElementById('nav-back');
  var fwd  = document.getElementById('nav-fwd');
  // history.length==1 means no history to go back to
  if(back) back.disabled = (window.history.length <= 1);
  if(back) back.onclick = function(){ window.history.back(); };
  if(fwd)  fwd.onclick  = function(){ window.history.forward(); };
  // Update disabled state after navigation
  window.addEventListener('popstate', function(){
    if(back) back.disabled = (window.history.length <= 1);
  });
})();

</script>
</body>
</html>
