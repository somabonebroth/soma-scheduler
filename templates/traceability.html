<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="var(--black)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Completed Production</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.week-record { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.week-header { background: var(--dark); color: var(--white); padding: 12px 18px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 12px; }
.week-header:hover { background: #2a2a4e; }
.week-header-label { display: flex; align-items: center; gap: 10px; flex: 1; }
.week-status-badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 700; letter-spacing: 0.4px; }
.week-status-badge.confirmed { background: #2d5f3f; color: var(--white); }
.week-status-badge.ready { background: var(--amber-text); color: var(--white); }
.week-status-badge.partial { background: #6c757d; color: var(--white); }
.week-days { padding: 0; display: none; }
.week-days.open { display: block; }
.day-record { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
.day-record:last-child { border-bottom: none; }
.day-record:nth-child(even) { background: var(--row-alt); }
.day-name { font-weight: 600; }
.day-time { font-size: 11px; color: var(--text-light); }
.organic-badge { font-size: 10px; background: var(--action-green-bg); color: var(--action-green); padding: 1px 6px; border-radius: 8px; font-weight: 600; margin-left: 6px; }
.day-actions { display: flex; gap: 10px; align-items: center; }
.day-actions a { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 13px; }
.day-actions a:hover { text-decoration: underline; }
.day-actions button { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }
.day-actions button:hover { background: var(--danger); color: var(--white); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.download-week { font-size: 12px; }

/* Week Summary Modal */
.summary-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:300; align-items:center; justify-content:center; padding:16px; }
.summary-modal.open { display:flex; }
.summary-box { background:var(--white); border-radius:14px; width:100%; max-width:560px; max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
.summary-header { padding:20px 22px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--white); z-index:1; }
.summary-header h2 { margin:0; font-size:16px; font-weight:700; }
.summary-body { padding:18px 22px; }
.summary-section { margin-bottom:18px; }
.summary-section h3 { font-size:11px; font-weight:700; color:var(--text-light); text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px; }
.summary-flag { background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:7px; padding:9px 12px; font-size:13px; color:#6d4c00; margin-bottom:6px; display:flex; gap:8px; }
.summary-note { background:var(--bg); border-radius:7px; padding:9px 12px; font-size:13px; margin-bottom:6px; }
.summary-note strong { color:var(--dark); }
.summary-ok { background:var(--action-green-bg); border:1px solid var(--green-light); border-radius:7px; padding:12px 16px; font-size:13px; color:var(--action-green); font-weight:600; display:flex; gap:8px; align-items:center; }
.prod-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
.prod-row:last-child { border-bottom:none; }
/* HOO sign-off panel */
.hoo-panel { padding: 14px 18px; background: #fafaf5; border-bottom: 1px solid var(--border); }
.hoo-panel.confirmed { background: #ebf5ee; border-left: 4px solid #2d5f3f; }
.hoo-panel.ready { background: var(--amber-bg); border-left: 4px solid var(--amber-text); }
.hoo-panel.partial { background: var(--bg); border-left: 4px solid var(--text-muted); }
.hoo-panel h4 { margin: 0 0 8px 0; font-size: 13px; }
.hoo-form-row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.hoo-form-row input, .hoo-form-row textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
.hoo-form-row input { min-width: 200px; }
.hoo-form-row textarea { min-width: 260px; min-height: 36px; flex: 1; }
.hoo-meta { font-size: 12px; color: var(--text-light); margin-top: 6px; }
.hoo-confirmed-line { font-size: 13px; }
.hoo-confirmed-name { font-weight: 600; color: #2d5f3f; }
.hoo-notes { background: var(--white); padding: 8px 10px; border-radius: 4px; margin-top: 8px; font-size: 12px; border: 1px solid var(--border); }
.hoo-actions { margin-top: 10px; }
.hoo-incomplete-list { font-size: 12px; color: #555; margin-top: 4px; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Completed Production</h1><p id="trace-subtitle">All production records — review and confirm weekly</p></div>
    <div class="header-right" style="display:flex;align-items:center;gap:8px;">
    <div class="nav-arrows"><button class="nav-arrow-btn" id="nav-back" title="Back">&#8592;</button><button class="nav-arrow-btn" id="nav-fwd" title="Forward">&#8594;</button></div>
    <a href="/mass-balance" class="header-btn">📊 Mass Balance</a>
    <a href="/" class="header-btn">⌂ Dashboard</a>
  </div>
</div>
<div class="main">
    <div id="records-container"><div class="empty-state">Loading...</div></div>
</div>
<div class="modal-overlay" id="confirm-modal">
    <div class="modal" style="max-width:440px;">
        <h2 id="confirm-title" style="margin-bottom:10px;">Confirm</h2>
        <p id="confirm-message" style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:18px;"></p>
        <div class="modal-actions" style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px;padding-top:14px;border-top:1px solid var(--border);">
            <button class="btn btn-outline" id="confirm-cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="confirm-ok-btn">Confirm</button>
        </div>
    </div>
</div>
<script>
function mobileConfirm(message, opts){
    opts = opts || {};
    return new Promise(function(resolve){
        var modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-title').textContent = opts.title || 'Confirm';
        document.getElementById('confirm-message').textContent = message;
        var okBtn = document.getElementById('confirm-ok-btn');
        var cancelBtn = document.getElementById('confirm-cancel-btn');
        okBtn.textContent = opts.okLabel || 'Confirm';
        cancelBtn.textContent = opts.cancelLabel || 'Cancel';
        if(opts.danger){ okBtn.style.background='#c62828'; okBtn.style.borderColor='#c62828'; }
        else { okBtn.style.background=''; okBtn.style.borderColor=''; }
        function cleanup(result){
            modal.classList.remove('active');
            okBtn.onclick = null; cancelBtn.onclick = null; modal.onclick = null;
            resolve(result);
        }
        okBtn.onclick = function(){ cleanup(true); };
        cancelBtn.onclick = function(){ cleanup(false); };
        modal.onclick = function(e){ if(e.target === modal) cleanup(false); };
        modal.classList.add('active');
    });
}
</script>
<script>
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function loadRecords(){
    var res=await fetch('/api/traceability');
    var records=await res.json();
    var container=document.getElementById('records-container');
    if(!records.length){container.innerHTML='<div class="empty-state"><h2>No Records</h2><p>Completed daily production checklists will appear here.</p></div>';return;}
    var html='';
    for(var i=0;i<records.length;i++){
        var rec=records[i];
        var weekStart=new Date(rec.week_id+'T00:00:00');
        var label=weekStart.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

        var statusBadge='';
        var statusClass='partial';
        if(rec.hoo_signoff){statusBadge='<span class="week-status-badge confirmed">CONFIRMED</span>';statusClass='confirmed';}
        else if(rec.completion_state==='all_complete'){statusBadge='<span class="week-status-badge ready">READY TO SIGN</span>';statusClass='ready';}
        else {statusBadge='<span class="week-status-badge partial">IN PROGRESS</span>';statusClass='partial';}

        html+='<div class="week-record"><div class="week-header" onclick="toggleWeek(this)">'+
              '<div class="week-header-label"><span>Week of '+label+'</span>'+statusBadge+'</div>'+
              '<span class="download-week"><a href="/api/pdfs/'+rec.week_id+'/download-all" style="color:#aaa;text-decoration:none;" onclick="event.stopPropagation();">Download All</a></span>'+
              '</div><div class="week-days">';

        // HOO sign-off panel
        html+=renderHooPanel(rec,statusClass);

        for(var j=0;j<rec.days.length;j++){
            var day=rec.days[j];
            var timeStr=day.last_updated?day.last_updated.substring(0,16).replace('T',' '):'';
            // One badge per distinct certification that ran that day, labeled with
            // the actual cert (not always "Organic"). On a mixed-certification day,
            // show the per-vessel breakdown so kettles are never conflated.
            var certs=day.certifications||(day.certification?[day.certification]:[]);
            var certBadges=certs.map(function(c){
                var isOrg=/organic/i.test(c);
                return isOrg
                    ? '<span class="organic-badge">'+escHtml(c)+'</span>'
                    : '<span class="organic-badge" style="background:#ececec;color:#555;">'+escHtml(c)+'</span>';
            }).join(' ');
            var certDetail='';
            if(certs.length>1 && day.cert_by_vessel){
                var parts=Object.keys(day.cert_by_vessel).map(function(v){return escHtml(v)+': '+escHtml(day.cert_by_vessel[v]);});
                certDetail='<br><span class="day-time" style="color:#8a6d00;">⚠ Mixed certification — '+parts.join(', ')+'</span>';
            }
            var deleteBtn=rec.hoo_signoff?'':'<button onclick="deleteRecord(\''+rec.week_id+'\','+day.day_idx+',\''+day.day_name+'\')">Delete</button>';
            html+='<div class="day-record"><div><span class="day-name">'+day.day_name+'</span> '+certBadges+'<br><span class="day-time">Completed: '+timeStr+'</span>'+certDetail+'</div><div class="day-actions"><a href="/daily-production/'+rec.week_id+'/'+day.day_idx+'">View</a><a href="/api/pdf/'+rec.week_id+'/'+day.day_name+'_Completed_Checklist.pdf" target="_blank">Download PDF</a>'+deleteBtn+'</div></div>';
        }
        html+='</div></div>';
    }
    container.innerHTML=html;
}

function renderHooPanel(rec,statusClass){
    var weekId=rec.week_id;
    if(rec.hoo_signoff){
        var so=rec.hoo_signoff;
        var when=so.signed_at?so.signed_at.substring(0,16).replace('T',' '):'';
        var notes=so.notes?'<div class="hoo-notes"><strong>Notes:</strong> '+escHtml(so.notes)+'</div>':'';
        return '<div class="hoo-panel confirmed">'+
               '<h4>✓ Confirmed by Head of Operations</h4>'+
               '<div class="hoo-confirmed-line"><span class="hoo-confirmed-name">'+escHtml(so.name)+'</span> &middot; '+escHtml(when)+'</div>'+
               notes+
               '<div class="hoo-actions"><button class="btn btn-outline" style="font-size:11px;padding:4px 12px;" onclick="unsignWeek(\''+weekId+'\')">Unsign</button></div>'+
               '</div>';
    }
    if(rec.completion_state==='all_complete'){
        return '<div class="hoo-panel ready">'+
               '<h4>Ready for Head of Operations sign-off</h4>'+
               '<p style="font-size:12px;margin:0 0 10px 0;color:#555;">All scheduled days are complete. Review the production summary before signing.</p>'+
               '<div style="margin-bottom:10px;"><button class="btn btn-outline" style="font-size:13px;" onclick="showWeekSummary(\''+weekId+'\')">📋 Review Week Summary</button></div>'+
               '<div class="hoo-form-row">'+
                 '<input type="text" id="hoo-name-'+weekId+'" placeholder="HOO name" autocomplete="off">'+
                 '<textarea id="hoo-notes-'+weekId+'" placeholder="Optional notes (e.g. Reviewed all CCPs, no issues)"></textarea>'+
                 '<button class="btn btn-primary" style="font-size:13px;" onclick="signWeek(\''+weekId+'\')">Sign &amp; Confirm Week</button>'+
               '</div>'+
               '<div class="hoo-meta" id="hoo-status-'+weekId+'"></div>'+
               '</div>';
    }
    // Partial
    var incomplete=rec.scheduled_incomplete_days||[];
    var listed=incomplete.map(function(d){return d.day_name;}).join(', ')||'—';
    return '<div class="hoo-panel partial">'+
           '<h4>Awaiting daily completions</h4>'+
           '<p style="font-size:12px;margin:0;color:#555;">Sign-off becomes available once all scheduled days are completed.</p>'+
           '<div class="hoo-incomplete-list">Pending: '+escHtml(listed)+'</div>'+
           '</div>';
}

async function signWeek(weekId){
    var name=document.getElementById('hoo-name-'+weekId).value.trim();
    var notes=document.getElementById('hoo-notes-'+weekId).value.trim();
    var st=document.getElementById('hoo-status-'+weekId);
    if(!name){st.textContent='Enter your name to sign.';st.style.color='#dc3545';return;}
    var res=await fetch('/api/weekly-signoff/'+weekId,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,notes:notes})});
    var data=await res.json();
    if(data.success){loadRecords();}
    else{st.textContent=data.error||'Failed';st.style.color='#dc3545';}
}

async function unsignWeek(weekId){
    var ok = await mobileConfirm("Reverse this week's sign-off? You can re-sign at any time.",
        {title:'Reverse sign-off?', okLabel:'Reverse'});
    if(!ok) return;
    var res=await fetch('/api/weekly-signoff/'+weekId,{method:'DELETE'});
    if(res.ok)loadRecords();
}

function toggleWeek(el){el.nextElementSibling.classList.toggle('open');}

async function deleteRecord(weekId,dayIdx,dayName){
    var ok = await mobileConfirm('Delete '+dayName+' record?',
        {title:'Delete record?', okLabel:'Delete', danger:true});
    if(!ok) return;
    var res=await fetch('/api/traceability/'+weekId+'/'+dayIdx,{method:'DELETE'});
    if(res.ok)loadRecords();
    else alert('Failed to delete');
}

document.addEventListener('DOMContentLoaded',function(){
    loadRecords();
});
</script>
<script>
(function(){
  var back = document.getElementById('nav-back');
  var fwd  = document.getElementById('nav-fwd');
  // history.length==1 means no history to go back to
  if(back) back.disabled = (window.history.length <= 1);
  if(back) back.onclick = function(){ window.history.back(); };
  if(fwd)  fwd.onclick  = function(){ window.history.forward(); };
  // Update disabled state after navigation
  window.addEventListener('popstate', function(){
    if(back) back.disabled = (window.history.length <= 1);
  });
})();

async function showWeekSummary(weekId) {
  var modal = document.getElementById('week-summary-modal');
  var body  = document.getElementById('summary-body');
  var title = document.getElementById('summary-title');
  title.textContent = 'Week of ' + weekId;
  body.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-light);">Loading…</div>';
  modal.classList.add('open');

  try {
    var res  = await fetch('/api/traceability/' + weekId + '/summary');
    var data = await res.json();
    renderSummary(data);
  } catch(e) {
    body.innerHTML = '<div style="padding:20px;color:#c62828;">Could not load summary: ' + e.message + '</div>';
  }
}

function closeSummary() {
  document.getElementById('week-summary-modal').classList.remove('open');
}

document.getElementById('week-summary-modal').addEventListener('click', function(ev) {
  if (ev.target === this) closeSummary();
});

function renderSummary(data) {
  var html = '';

  // Status
  if (data.all_clear && !data.notes.length) {
    html += '<div class="summary-ok">✓ All clear — no flags, no notes. Ready to sign off.</div>';
  } else {
    // Flags
    if (data.flags && data.flags.length) {
      html += '<div class="summary-section"><h3>⚠ Flags &amp; Inconsistencies</h3>';
      data.flags.forEach(function(f) {
        html += '<div class="summary-flag"><span>⚠</span><span>' + escHtml(f) + '</span></div>';
      });
      html += '</div>';
    }
    // Notes
    if (data.notes && data.notes.length) {
      html += '<div class="summary-section"><h3>📝 Production Notes</h3>';
      data.notes.forEach(function(n) {
        html += '<div class="summary-note"><strong>' + escHtml(n.day) + ':</strong> ' + escHtml(n.note) + '</div>';
      });
      html += '</div>';
    }
  }

  // Total production
  // Production by SKU with total at bottom
  if (data.total_produced && Object.keys(data.total_produced).length) {
    var entries = Object.entries(data.total_produced);
    var grandUnits = entries.reduce(function(a, kv){ return a + kv[1]; }, 0);
    html += '<div class="summary-section"><h3>Production by SKU</h3>';
    entries.forEach(function(kv) {
      html += '<div class="prod-row"><span>' + escHtml(kv[0]) + '</span><strong>' + kv[1] + ' units · ' + Math.floor(kv[1]/12) + ' cases</strong></div>';
    });
    html += '<div class="prod-row" style="border-top:2px solid var(--border);margin-top:4px;font-weight:700;">'
      + '<span>Total</span><strong>' + grandUnits + ' units · ' + Math.floor(grandUnits/12) + ' cases</strong></div>';
    html += '</div>';
  }

  // Days completed — day name, CCP flag if any, kitchen sign-off name only
  if (data.days && data.days.length) {
    html += '<div class="summary-section"><h3>Days Completed</h3>';
    data.days.forEach(function(d) {
      var sigs = d.kitchen_signoff || '<span style="color:#c62828;">Missing</span>';
      var ccpBadge = d.has_ccp_flags
        ? '<span style="background:#fff8e1;color:#b38b00;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;">CCP FLAG</span>'
        : '';
      html += '<div class="prod-row">'
        + '<span style="font-weight:600;">' + escHtml(d.day) + ccpBadge + '</span>'
        + '<span style="font-size:13px;color:var(--text-light);">Signed: ' + sigs + '</span>'
        + '</div>';
    });
    html += '</div>';
  }

  document.getElementById('summary-body').innerHTML = html;
}

</script>
<!-- Week Summary Modal -->
<div class="summary-modal" id="week-summary-modal">
  <div class="summary-box">
    <div class="summary-header">
      <h2 id="summary-title">Week Summary</h2>
      <button onclick="closeSummary()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);line-height:1;padding:0;">&times;</button>
    </div>
    <div class="summary-body" id="summary-body">
      <div style="text-align:center;padding:32px;color:var(--text-light);">Loading…</div>
    </div>
  </div>
</div>

</body>
</html>
