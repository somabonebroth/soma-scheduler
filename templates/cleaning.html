<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Cleaning &amp; Maintenance</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* Page layout only — colours/components come from the shared sheet */
.section-label { font-size: 11px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: 1px; margin: 22px 0 8px; border-left: 3px solid var(--accent); padding-left: 8px; }
.job-list { display: flex; flex-direction: column; gap: 8px; }
.job-row { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.job-row.upnext { border-color: var(--accent); box-shadow: 0 1px 6px rgba(74,103,65,0.12); }
.job-info { flex: 1; min-width: 0; }
.job-title { font-size: 14px; font-weight: 600; color: var(--dark); }
.job-meta { font-size: 11.5px; color: var(--text-light); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.freq-badge { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); color: var(--text-light); white-space: nowrap; }
.freq-badge.slot-weekly { color: var(--info-dark); border-color: var(--info-border); background: var(--action-blue-bg); }
.freq-badge.slot-monthly { color: var(--action-green); border-color: var(--green-light); background: var(--action-green-bg); }
.freq-badge.slot-quarterly { color: var(--amber-text-dark); border-color: var(--amber-border); background: var(--amber-bg); }
.freq-badge.slot-semiannual { color: var(--indigo); border-color: var(--indigo); background: var(--bg); }
.slot-head { display: flex; align-items: center; gap: 9px; margin: 16px 0 7px; }
.slot-head:first-child { margin-top: 2px; }
.slot-rule { flex: 1; height: 1px; background: var(--border); }
.slot-count { font-size: 11px; color: var(--text-light); }
.due-badge { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 8px; background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text-dark, var(--amber-text)); white-space: nowrap; }
.job-notes { font-size: 12px; color: var(--text-light); margin-top: 3px; font-style: italic; }
.done-btn { flex-shrink: 0; background: var(--action-green); color: var(--white); border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
.done-btn:hover { opacity: 0.9; }
.empty-state { text-align: center; padding: 40px 16px; color: var(--text-light); font-size: 14px; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 10px; }
/* Recent sign-offs */
.comp-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; background: var(--card-bg); }
.comp-list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.comp-row:last-child { border-bottom: none; }
.comp-when { color: var(--text-light); font-size: 11.5px; white-space: nowrap; }
/* Modal */
.cl-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; }
.cl-modal-overlay.open { display: flex; }
.cl-modal { background: var(--white); border-radius: 14px; width: 100%; max-width: 400px; margin: 16px; padding: 26px 22px; position: relative; }
.cl-modal h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
.cl-modal .sub { font-size: 13px; color: var(--text-light); margin: 0 0 16px; }
.cl-field { margin-bottom: 13px; }
.cl-field label { font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: .3px; display: block; margin-bottom: 5px; }
.cl-field input, .cl-field select, .cl-field textarea { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--white); font-family: inherit; }
.cl-err { font-size: 13px; color: var(--action-red); display: none; margin-bottom: 8px; }
.cl-actions { display: flex; gap: 10px; margin-top: 6px; }
.cl-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.cl-cancel { background: var(--white); border: 1px solid var(--border); color: var(--text); }
.cl-primary { background: var(--action-green); border: none; color: var(--white); }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Cleaning &amp; Maintenance</h1><p>Soma Bone Broth</p></div>
    <div class="header-right"><button class="header-btn" onclick="window.location='/'">&#8962; Dashboard</button></div>
</div>
<div class="main">
    <div class="section-label">Up next</div>
    <div class="job-list" id="upnext-list"></div>

    <div class="section-label" id="rest-label" style="display:none;">Done &mdash; back in line later</div>
    <div class="job-list" id="rest-list"></div>

    <div class="section-label">Recent sign-offs</div>
    <div id="comp-list"></div>

</div>

<!-- Sign-off modal -->
<div class="cl-modal-overlay" id="signoff-modal">
  <div class="cl-modal">
    <button onclick="closeSignoff()" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);">&times;</button>
    <h2 id="signoff-title">Sign off</h2>
    <p class="sub">Nice work. Put your name on it — the job rotates to the back of the line.</p>
    <div class="cl-field">
      <label>Your name</label>
      <input type="text" id="signoff-staff" placeholder="e.g. Sam" autocomplete="off">
    </div>
    <div class="cl-field">
      <label>Note (optional)</label>
      <input type="text" id="signoff-notes" placeholder="Anything worth mentioning" autocomplete="off">
    </div>
    <div class="cl-err" id="signoff-err"></div>
    <div class="cl-actions">
      <button class="cl-cancel" onclick="closeSignoff()">Cancel</button>
      <button class="cl-primary" id="signoff-submit" onclick="submitSignoff()">&#10003; Done</button>
    </div>
  </div>
</div>

<script>
// New JS — let/const per the forward-only policy.
let jobs = [];
let signoffJobId = null;

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Slots must match cleaning.slot_for() — the floor reads the list by slot,
// so a weekly job never sits visually mixed in with six-month work.
const SLOTS = [
    {key: 'weekly', label: 'Weekly', cls: 'slot-weekly'},
    {key: 'monthly', label: 'Monthly', cls: 'slot-monthly'},
    {key: 'quarterly', label: 'Quarterly', cls: 'slot-quarterly'},
    {key: 'semiannual', label: 'Semi-annual', cls: 'slot-semiannual'}
];

function slotFor(days){
    if (days <= 7) return 'weekly';
    if (days <= 30) return 'monthly';
    if (days <= 90) return 'quarterly';
    return 'semiannual';
}

function freqLabel(days){
    const slot = SLOTS.find(x => x.key === slotFor(days));
    return slot ? slot.label : 'Every ~' + days + ' days';
}

function slotBadge(days){
    const slot = SLOTS.find(x => x.key === slotFor(days));
    return '<span class="freq-badge ' + slot.cls + '">' + slot.label + '</span>';
}

function groupedJobsHtml(list){
    // Grouped by slot with a heading rule between, most-overdue first inside
    // each group. Ungrouped, a weekly job and a semi-annual one look identical.
    let html = '';
    SLOTS.forEach(slot => {
        const mine = list.filter(j => (j.slot || slotFor(j.interval_days)) === slot.key);
        if (!mine.length) return;
        html += '<div class="slot-head"><span class="freq-badge ' + slot.cls + '">' + slot.label
             + '</span><span class="slot-rule"></span><span class="slot-count">' + mine.length + ' job' + (mine.length === 1 ? '' : 's') + '</span></div>'
             + '<div class="job-list">' + mine.map(jobRowHtml).join('') + '</div>';
    });
    return html;
}

function lastDoneLabel(j){
    if (!j.last_done) return 'Never done yet';
    const who = j.last_done_by ? ' by ' + esc(j.last_done_by) : '';
    if (j.days_since === 0) return 'Done today' + who;
    if (j.days_since === 1) return 'Done yesterday' + who;
    return 'Done ' + j.days_since + ' days ago' + who;
}

function jobRowHtml(j){
    let meta = slotBadge(j.interval_days);
    if (j.ready && j.last_done && j.due_ratio >= 1) meta += '<span class="due-badge">Due</span>';
    meta += '<span>' + lastDoneLabel(j) + '</span>';
    if (!j.ready && j.returns_on) meta += '<span>Back in line ' + esc(j.returns_on) + '</span>';
    let notes = j.notes ? '<div class="job-notes">' + esc(j.notes) + '</div>' : '';
    return '<div class="job-row' + (j.ready ? ' upnext' : '') + '">'
        + '<div class="job-info"><div class="job-title">' + esc(j.title) + '</div>'
        + '<div class="job-meta">' + meta + '</div>' + notes + '</div>'
        + '<button class="done-btn" onclick="openSignoff(\'' + j.id + '\')">&#10003; Done</button>'
        + '</div>';
}

async function loadJobs(){
    const res = await fetch('/api/cleaning/jobs');
    jobs = await res.json();
    const up = document.getElementById('upnext-list');
    const rest = document.getElementById('rest-list');
    const restLabel = document.getElementById('rest-label');
    if (jobs.length === 0) {
        up.innerHTML = '<div class="empty-state">No cleaning jobs yet. A manager sets the rotation up in Cleaning Records.</div>';
        rest.innerHTML = '';
        restLabel.style.display = 'none';
    } else {
        const active = jobs.filter(j => j.ready);
        const resting = jobs.filter(j => !j.ready);
        up.innerHTML = active.length
            ? groupedJobsHtml(active)
            : '<div class="empty-state">All caught up — nothing due right now. &#127881;</div>';
        rest.innerHTML = groupedJobsHtml(resting);
        restLabel.style.display = resting.length ? '' : 'none';
    }
}

async function loadCompletions(){
    const res = await fetch('/api/cleaning/completions?limit=15');
    const comps = await res.json();
    const el = document.getElementById('comp-list');
    if (comps.length === 0) {
        el.innerHTML = '<div class="empty-state">No sign-offs yet.</div>';
        return;
    }
    el.innerHTML = '<div class="comp-list">' + comps.map(c =>
        '<div class="comp-row"><span>&#10003;</span>'
        + '<div><strong>' + esc(c.job_title) + '</strong> — ' + esc(c.staff)
        + (c.notes ? '<div style="font-size:11.5px;color:var(--text-light);font-style:italic;">' + esc(c.notes) + '</div>' : '')
        + '</div>'
        + '<span class="comp-when" style="margin-left:auto;">' + esc(c.date) + '</span>'
        + '</div>'
    ).join('') + '</div>';
}

// ── Sign-off ──
function openSignoff(jid){
    signoffJobId = jid;
    const j = jobs.find(x => x.id === jid);
    document.getElementById('signoff-title').textContent = 'Sign off: ' + (j ? j.title : '');
    document.getElementById('signoff-err').style.display = 'none';
    document.getElementById('signoff-notes').value = '';
    const staffInput = document.getElementById('signoff-staff');
    try { staffInput.value = localStorage.getItem('soma_cleaning_name') || ''; } catch(e) { staffInput.value = ''; }
    document.getElementById('signoff-modal').classList.add('open');
    setTimeout(() => staffInput.focus(), 50);
}
function closeSignoff(){ document.getElementById('signoff-modal').classList.remove('open'); }

async function submitSignoff(){
    const staff = document.getElementById('signoff-staff').value.trim();
    const err = document.getElementById('signoff-err');
    if (!staff) { err.textContent = 'Please enter your name.'; err.style.display = 'block'; return; }
    const btn = document.getElementById('signoff-submit');
    btn.disabled = true;
    try {
        const res = await fetch('/api/cleaning/jobs/' + signoffJobId + '/complete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({staff: staff, notes: document.getElementById('signoff-notes').value.trim()})
        });
        const d = await res.json();
        if (!res.ok) { err.textContent = d.error || 'Failed to save.'; err.style.display = 'block'; return; }
        try { localStorage.setItem('soma_cleaning_name', staff); } catch(e) {}
        closeSignoff();
        await Promise.all([loadJobs(), loadCompletions()]);
    } catch(e) {
        err.textContent = 'Error — try again.'; err.style.display = 'block';
    } finally {
        btn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', () => { loadJobs(); loadCompletions(); });
</script>
</body>
</html>
