<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Create Schedule</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.day-block { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.day-header { background: var(--accent); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.day-header .lot { font-size: 12px; opacity: 0.8; }
.same-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 10px; }
.same-btn:hover { background: rgba(255,255,255,0.3); }
.vessel-row { display: grid; grid-template-columns: 80px 1fr 90px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.vessel-row:nth-child(even) { background: var(--row-alt, #fafaf7); }
.vessel-label { font-weight: 700; font-size: 14px; }
.vessel-label.half-vessel { color: #e67e22; }
.vessel-row select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #fff; }
.yield-display { font-size: 13px; color: var(--text-light); text-align: center; }
.yield-display.has-value { color: var(--accent); font-weight: 600; }
.yield-display.halved { color: #e67e22; }
.notes-area { width: 100%; min-height: 80px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; }
.day-notes { width: calc(100% - 32px); margin: 0 16px 12px; padding: 8px 10px; border: 1px dashed var(--border); border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 36px; background: #fffdf5; }
.day-notes-label { font-size: 11px; color: var(--text-light); padding: 8px 16px 2px; font-weight: 600; }
.top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.week-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.week-picker input[type="date"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
.btn-reset { background: none; border: 1px solid var(--border); color: var(--text-light); padding: 8px 16px; font-size: 13px; border-radius: 6px; cursor: pointer; }
.btn-reset:hover { background: #f0f0ea; }
.generate-bar { position: sticky; bottom: 0; background: var(--card-bg, #fff); border-top: 1px solid var(--border); padding: 16px; text-align: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.05); }
.week-exists-notice { background: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; padding: 10px 16px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Create Schedule</h1><p>Assign recipes to kettles for the week</p></div>
    <div class="header-right" style="display:flex;align-items:center;gap:8px;">
    <div class="nav-arrows"><button class="nav-arrow-btn" id="nav-back" title="Back">&#8592;</button><button class="nav-arrow-btn" id="nav-fwd" title="Forward">&#8594;</button></div>
    <a href="/" class="header-btn">⌂ Dashboard</a>
  </div>
</div>
<div class="main">
    <div class="top-bar">
        <div class="week-picker">
            <label style="font-size:14px;font-weight:600;">Week starting:</label>
            <input type="date" id="week-date" onchange="weekChanged()">
            <button class="btn-reset" onclick="resetSchedule()">Re-Set Schedule</button>
        </div>
        <button class="btn btn-primary" id="generate-btn" onclick="generateSchedule()">Generate Schedule + Checklists</button>
    </div>
    <div id="status-msg" class="status"></div>
    <div id="week-exists-notice" class="week-exists-notice"></div>
    <div id="par-warning-banner" style="display:none;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:14px 16px;margin-bottom:14px;">
        <div style="font-size:12px;font-weight:700;color:#f57f17;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">⚠ Below PAR Level</div>
        <div id="par-warning-list" style="font-size:13px;color:#5d4037;line-height:1.8;"></div>
    </div>
    <div class="card"><h3>General Notes</h3><textarea id="schedule-notes" class="notes-area" placeholder="General weekly notes..."></textarea></div>
    <div id="schedule-grid"></div>
    <div class="generate-bar">
        <button class="btn btn-primary btn-block" onclick="generateSchedule()">Generate Schedule + Checklists</button>
    </div>
</div>
<div class="modal-overlay" id="confirm-modal">
    <div class="modal" style="max-width:440px;">
        <h2 id="confirm-title" style="margin-bottom:10px;">Confirm</h2>
        <p id="confirm-message" style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:18px;"></p>
        <div class="modal-actions" style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px;padding-top:14px;border-top:1px solid var(--border);">
            <button class="btn btn-outline" id="confirm-cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="confirm-ok-btn">Confirm</button>
        </div>
    </div>
</div>
<script>
function mobileConfirm(message, opts){
    opts = opts || {};
    return new Promise(function(resolve){
        var modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-title').textContent = opts.title || 'Confirm';
        document.getElementById('confirm-message').textContent = message;
        var okBtn = document.getElementById('confirm-ok-btn');
        var cancelBtn = document.getElementById('confirm-cancel-btn');
        okBtn.textContent = opts.okLabel || 'Confirm';
        cancelBtn.textContent = opts.cancelLabel || 'Cancel';
        function cleanup(result){
            modal.classList.remove('active');
            okBtn.onclick = null; cancelBtn.onclick = null; modal.onclick = null;
            resolve(result);
        }
        okBtn.onclick = function(){ cleanup(true); };
        cancelBtn.onclick = function(){ cleanup(false); };
        modal.onclick = function(e){ if(e.target === modal) cleanup(false); };
        modal.classList.add('active');
    });
}
</script>
<script>
var recipes = {};
var groupedRecipes = {};
var currentWeekId = '';
var existingSchedule = false;
var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var VESSELS = ['K1','K2','K3','115L'];

function getCurrentMonday() {
    var today = new Date();
    var day = today.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    var mon = new Date(today);
    mon.setDate(today.getDate() + diff);
    return mon;
}
function formatDate(d) { return d.toISOString().split('T')[0]; }
function getMonday(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    var day = d.getDay();
    var diff = d.getDate() - day + (day === 0 ? -6 : 1);
    d.setDate(diff);
    return d;
}

document.addEventListener('DOMContentLoaded', async function() {
    var params = new URLSearchParams(window.location.search);
    var weekParam = params.get('week');
    var mon = weekParam ? new Date(weekParam + 'T00:00:00') : getCurrentMonday();
    document.getElementById('week-date').value = formatDate(mon);
    currentWeekId = formatDate(mon);
    recipes = await (await fetch('/api/recipes')).json();
    groupedRecipes = await (await fetch('/api/recipes/grouped')).json();
    buildGrid();
    loadExisting(currentWeekId);
    loadParWarnings();
});

async function loadParWarnings(){
    try {
        var res = await fetch('/api/sku-meta');
        var data = await res.json();
        var warnings = data.par_warnings || [];
        var banner = document.getElementById('par-warning-banner');
        var list = document.getElementById('par-warning-list');
        if(!warnings.length){ banner.style.display='none'; return; }
        banner.style.display='';
        list.innerHTML = warnings.map(function(w){
            return '<span style="display:inline-block;margin-right:16px;">'
                + '<strong>' + w.display + '</strong>'
                + ' &mdash; ' + w.remaining + ' units in stock, PAR is ' + w.par
                + ' <span style="color:#c62828;">(' + w.shortfall + ' short)</span>'
                + '</span>';
        }).join('<br>');
    } catch(e) {}
}

function weekChanged() {
    var weekDate = document.getElementById('week-date').value;
    var monday = getMonday(weekDate);
    document.getElementById('week-date').value = formatDate(monday);
    currentWeekId = formatDate(monday);
    document.getElementById('schedule-notes').value = '';
    existingSchedule = false;
    buildGrid();
    loadExisting(currentWeekId);
}

function buildGroupedOptions() {
    var html = '<option value="">-- No production --</option>';
    var brands = Object.keys(groupedRecipes);
    for (var b = 0; b < brands.length; b++) {
        var brand = brands[b];
        html += '<optgroup label="' + brand + '">';
        var items = groupedRecipes[brand];
        for (var i = 0; i < items.length; i++) {
            html += '<option value="' + items[i].name + '">' + items[i].display + '</option>';
        }
        html += '</optgroup>';
    }
    return html;
}

function buildGrid() {
    var container = document.getElementById('schedule-grid');
    var weekDate = document.getElementById('week-date').value;
    var monday = getMonday(weekDate);
    currentWeekId = formatDate(monday);
    var opts = buildGroupedOptions();
    var html = '';
    for (var idx = 0; idx < 7; idx++) {
        var d = new Date(monday); d.setDate(d.getDate() + idx);
        var ds = d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'});
        var lot = d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'2-digit'}).replace(/\//g, '');
        html += '<div class="day-block"><div class="day-header"><span>' + DAYS[idx] + ' — ' + ds + '</span><span><span class="lot">LOT# ' + lot + '</span><button class="same-btn" onclick="sameAllKettles(' + idx + ')">Same All Kettles</button></span></div>';
        for (var v = 0; v < VESSELS.length; v++) {
            var vessel = VESSELS[v];
            var sid = 'sel-' + idx + '-' + vessel.replace(/[()]/g, '');
            var yid = 'yield-' + idx + '-' + vessel.replace(/[()]/g, '');
            var labelClass = vessel === '115L' ? 'vessel-label half-vessel' : 'vessel-label';
            html += '<div class="vessel-row"><span class="' + labelClass + '">' + vessel + '</span><select id="' + sid + '" onchange="updateYield(' + idx + ',\'' + vessel + '\')">' + opts + '</select><span class="yield-display" id="' + yid + '">--</span></div>';
        }
        html += '<div class="day-notes-label">Day Notes</div>';
        html += '<textarea class="day-notes" id="day-notes-' + idx + '" placeholder="Notes for ' + DAYS[idx] + '..."></textarea>';
        html += '</div>';
    }
    container.innerHTML = html;
}

function sameAllKettles(dayIdx) {
    var k1id = 'sel-' + dayIdx + '-K1';
    var k1val = document.getElementById(k1id).value;
    if (!k1val) { alert('Select a recipe for K1 first'); return; }
    ['K2', 'K3'].forEach(function(v) {
        var sid = 'sel-' + dayIdx + '-' + v;
        var sel = document.getElementById(sid);
        if (sel) { sel.value = k1val; updateYield(dayIdx, v); }
    });
}

function updateYield(dayIdx, vessel) {
    var sid = 'sel-' + dayIdx + '-' + vessel.replace(/[()]/g, '');
    var yid = 'yield-' + dayIdx + '-' + vessel.replace(/[()]/g, '');
    var sel = document.getElementById(sid);
    var yel = document.getElementById(yid);
    var rn = sel.value;
    if (rn && recipes[rn]) {
        var yieldVal = recipes[rn].yield;
        if (vessel === '115L') {
            yieldVal = Math.round(yieldVal / 2);
            yel.textContent = yieldVal + ' units (½)';
            yel.className = 'yield-display has-value halved';
        } else {
            yel.textContent = yieldVal + ' units';
            yel.className = 'yield-display has-value';
        }
    } else {
        yel.textContent = '--';
        yel.className = 'yield-display';
    }
}

async function resetSchedule() {
    var ok = await mobileConfirm('All selections will be cleared.', {title:'Reset schedule?', okLabel:'Reset'});
    if (!ok) return;
    document.getElementById('week-date').value = formatDate(getCurrentMonday());
    document.getElementById('schedule-notes').value = '';
    currentWeekId = formatDate(getCurrentMonday());
    existingSchedule = false;
    document.getElementById('week-exists-notice').style.display = 'none';
    buildGrid();
}

async function loadExisting(weekId) {
    var notice = document.getElementById('week-exists-notice');
    notice.style.display = 'none';
    existingSchedule = false;
    try {
        var res = await fetch('/api/schedule/' + weekId);
        var data = await res.json();
        if (data.schedule) {
            existingSchedule = true;
            notice.innerHTML = 'Editing existing schedule for week of ' + weekId + '. Generating will overwrite this week\'s schedule.';
            notice.style.display = 'block';
            Object.entries(data.schedule).forEach(function(entry) {
                var di = entry[0]; var vessels = entry[1];
                Object.entries(vessels).forEach(function(ve) {
                    var v = ve[0]; var r = ve[1];
                    var sid = 'sel-' + di + '-' + v.replace(/[()]/g, '');
                    var sel = document.getElementById(sid);
                    if (sel && r) { sel.value = r; updateYield(parseInt(di), v); }
                });
            });
            if (data.notes) document.getElementById('schedule-notes').value = data.notes;
            if (data.daily_notes) {
                Object.entries(data.daily_notes).forEach(function(entry) {
                    var el = document.getElementById('day-notes-' + entry[0]);
                    if (el) el.value = entry[1];
                });
            }
        }
    } catch (e) {}
}

async function generateSchedule() {
    if (existingSchedule) {
        var ok = await mobileConfirm(
            'This will overwrite the existing schedule for the week of ' + currentWeekId + '. Continue?',
            {title:'Overwrite schedule?', okLabel:'Overwrite'}
        );
        if (!ok) return;
    }
    var btn = document.getElementById('generate-btn');
    btn.disabled = true; btn.textContent = 'Generating...';
    var schedule = {};
    var dailyNotes = {};
    for (var idx = 0; idx < 7; idx++) {
        schedule[idx] = {};
        for (var v = 0; v < VESSELS.length; v++) {
            var sid = 'sel-' + idx + '-' + VESSELS[v].replace(/[()]/g, '');
            var sel = document.getElementById(sid);
            schedule[idx][VESSELS[v]] = sel ? sel.value : '';
        }
        var dn = document.getElementById('day-notes-' + idx);
        if (dn && dn.value.trim()) dailyNotes[idx] = dn.value.trim();
    }
    var notes = document.getElementById('schedule-notes').value;
    try {
        var res = await fetch('/api/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({week_id: currentWeekId, schedule: schedule, notes: notes, daily_notes: dailyNotes}),
        });
        var data = await res.json();
        if (data.success) {
            window.location.href = '/weekly-schedule?week=' + currentWeekId;
        } else {
            var el = document.getElementById('status-msg');
            el.className = 'status error'; el.textContent = data.error || 'Failed';
        }
    } catch (e) {
        var el = document.getElementById('status-msg');
        el.className = 'status error'; el.textContent = 'Error: ' + e.message;
    } finally {
        btn.disabled = false; btn.textContent = 'Generate Schedule + Checklists';
    }
}
</script>
<script>
(function(){
  var back = document.getElementById('nav-back');
  var fwd  = document.getElementById('nav-fwd');
  // history.length==1 means no history to go back to
  if(back) back.disabled = (window.history.length <= 1);
  if(back) back.onclick = function(){ window.history.back(); };
  if(fwd)  fwd.onclick  = function(){ window.history.forward(); };
  // Update disabled state after navigation
  window.addEventListener('popstate', function(){
    if(back) back.disabled = (window.history.length <= 1);
  });
})();
</script>
</body>
</html>
