<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soma - Create Schedule</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.day-block { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.day-header { background: var(--accent); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.day-header .lot { font-size: 12px; opacity: 0.8; }
.same-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 10px; }
.same-btn:hover { background: rgba(255,255,255,0.3); }
.vessel-row { display: grid; grid-template-columns: 80px 1fr 90px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.vessel-row:last-child { border-bottom: none; }
.vessel-row:nth-child(even) { background: var(--row-alt); }
.vessel-label { font-weight: 700; font-size: 14px; }
.vessel-row select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #fff; min-height: 44px; }
.yield-display { font-size: 13px; color: var(--text-light); text-align: center; }
.yield-display.has-value { color: var(--accent); font-weight: 600; }
.notes-area { width: 100%; min-height: 80px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; resize: vertical; }
.top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.week-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.week-picker input[type="date"] { padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; }
.btn-reset { background: none; border: 1px solid var(--border); color: var(--text-light); padding: 8px 16px; font-size: 13px; border-radius: 6px; cursor: pointer; }
.btn-reset:hover { background: #f0f0ea; }
.generate-bar { position: sticky; bottom: 0; background: var(--card-bg); border-top: 1px solid var(--border); padding: 16px; text-align: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.05); }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Create Schedule</h1><p>Assign recipes to kettles for the week</p></div>
    <div class="header-right"><a href="/" class="header-btn">Back to Dashboard</a></div>
</div>
<div class="main">
    <div class="top-bar">
        <div class="week-picker">
            <label style="font-size:14px;font-weight:600;">Week starting:</label>
            <input type="date" id="week-date">
            <button class="btn-reset" onclick="resetSchedule()">Re-Set Schedule</button>
        </div>
        <button class="btn btn-primary" id="generate-btn" onclick="generateSchedule()">Generate Schedule + Checklists</button>
    </div>
    <div id="status-msg" class="status"></div>
    <div class="card"><h3>Notes</h3><textarea id="schedule-notes" class="notes-area" placeholder="Weekly production notes..."></textarea></div>
    <div id="schedule-grid"></div>
    <div class="generate-bar">
        <button class="btn btn-primary btn-block" onclick="generateSchedule()">Generate Schedule + Checklists</button>
    </div>
</div>
<script>
var recipes = {};
var groupedRecipes = {};
var currentWeekId = '';
var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var VESSELS = ['K1','K2','K3','K4(115L)'];

function getCurrentMonday() { var t=new Date();var d=t.getDay();var diff=d===0?-6:1-d;var m=new Date(t);m.setDate(t.getDate()+diff);return m; }
function formatDate(d) { return d.toISOString().split('T')[0]; }
function getMonday(ds) { var d=new Date(ds+'T00:00:00');var day=d.getDay();var diff=d.getDate()-day+(day===0?-6:1);d.setDate(diff);return d; }

document.addEventListener('DOMContentLoaded', async function() {
    var params = new URLSearchParams(window.location.search);
    var wp = params.get('week');
    var mon = wp ? new Date(wp+'T00:00:00') : getCurrentMonday();
    document.getElementById('week-date').value = formatDate(mon);
    currentWeekId = formatDate(mon);
    recipes = await (await fetch('/api/recipes')).json();
    groupedRecipes = await (await fetch('/api/recipes/grouped')).json();
    buildGrid();
    if (wp) loadExisting(wp);
});

function buildGroupedOptions() {
    var html = '<option value="">-- No production --</option>';
    var brands = Object.keys(groupedRecipes);
    for (var b = 0; b < brands.length; b++) {
        var brand = brands[b];
        html += '<optgroup label="' + brand + '">';
        var items = groupedRecipes[brand];
        for (var i = 0; i < items.length; i++) {
            html += '<option value="' + items[i].name + '">' + items[i].display + '</option>';
        }
        html += '</optgroup>';
    }
    return html;
}

function buildGrid() {
    var container = document.getElementById('schedule-grid');
    var weekDate = document.getElementById('week-date').value;
    var monday = getMonday(weekDate);
    currentWeekId = formatDate(monday);
    var opts = buildGroupedOptions();
    var html = '';
    for (var idx = 0; idx < 7; idx++) {
        var d = new Date(monday); d.setDate(d.getDate()+idx);
        var ds = d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
        var lot = d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/\//g,'');
        html += '<div class="day-block"><div class="day-header"><span>' + DAYS[idx] + ' -- ' + ds + '</span><span><span class="lot">LOT# ' + lot + '</span><button class="same-btn" onclick="sameAllKettles('+idx+')">Same All Kettles</button></span></div>';
        for (var v = 0; v < VESSELS.length; v++) {
            var sid = 'sel-'+idx+'-'+VESSELS[v].replace(/[()]/g,'');
            var yid = 'yield-'+idx+'-'+VESSELS[v].replace(/[()]/g,'');
            html += '<div class="vessel-row"><span class="vessel-label">'+VESSELS[v]+'</span><select id="'+sid+'" onchange="updateYield('+idx+',\''+VESSELS[v]+'\')">'+opts+'</select><span class="yield-display" id="'+yid+'">--</span></div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

function sameAllKettles(dayIdx) {
    var k1id = 'sel-'+dayIdx+'-K1';
    var k1val = document.getElementById(k1id).value;
    if (!k1val) { alert('Select a recipe for K1 first'); return; }
    ['K2','K3'].forEach(function(v) {
        var sid = 'sel-'+dayIdx+'-'+v;
        var sel = document.getElementById(sid);
        if (sel) { sel.value = k1val; updateYield(dayIdx, v); }
    });
}

function updateYield(dayIdx, vessel) {
    var sid = 'sel-'+dayIdx+'-'+vessel.replace(/[()]/g,'');
    var yid = 'yield-'+dayIdx+'-'+vessel.replace(/[()]/g,'');
    var sel = document.getElementById(sid);
    var yel = document.getElementById(yid);
    var rn = sel.value;
    if (rn && recipes[rn]) { yel.textContent = recipes[rn].yield+' units'; yel.classList.add('has-value'); }
    else { yel.textContent = '--'; yel.classList.remove('has-value'); }
}

function resetSchedule() {
    if (!confirm('Reset? All selections will be cleared.')) return;
    document.getElementById('week-date').value = formatDate(getCurrentMonday());
    document.getElementById('schedule-notes').value = '';
    currentWeekId = formatDate(getCurrentMonday());
    buildGrid();
}

async function loadExisting(weekId) {
    try {
        var res = await fetch('/api/schedule/'+weekId);
        var data = await res.json();
        if (data.schedule) {
            Object.entries(data.schedule).forEach(function(e) {
                var di=e[0];var vessels=e[1];
                Object.entries(vessels).forEach(function(ve) {
                    var v=ve[0];var r=ve[1];
                    var sid='sel-'+di+'-'+v.replace(/[()]/g,'');
                    var sel=document.getElementById(sid);
                    if(sel&&r){sel.value=r;updateYield(parseInt(di),v);}
                });
            });
            if (data.notes) document.getElementById('schedule-notes').value = data.notes;
        }
    } catch(e){}
}

async function generateSchedule() {
    var btn=document.getElementById('generate-btn');
    btn.disabled=true;btn.textContent='Generating...';
    var schedule={};
    for(var idx=0;idx<7;idx++){schedule[idx]={};for(var v=0;v<VESSELS.length;v++){var sid='sel-'+idx+'-'+VESSELS[v].replace(/[()]/g,'');var sel=document.getElementById(sid);schedule[idx][VESSELS[v]]=sel?sel.value:'';}}
    var notes=document.getElementById('schedule-notes').value;
    try {
        var res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({week_id:currentWeekId,schedule:schedule,notes:notes})});
        var data=await res.json();
        if(data.success){window.location.href='/weekly-schedule?week='+currentWeekId;}
        else{var el=document.getElementById('status-msg');el.className='status error';el.textContent=data.error||'Failed';}
    }catch(e){var el=document.getElementById('status-msg');el.className='status error';el.textContent='Error: '+e.message;}
    finally{btn.disabled=false;btn.textContent='Generate Schedule + Checklists';}
}
</script>
</body>
</html>
