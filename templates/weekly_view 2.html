<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soma - Weekly Schedule</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.day-block { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.day-header { background: var(--accent); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.day-header .lot { font-size: 12px; opacity: 0.8; }
.vessel-row { display: grid; grid-template-columns: 80px 1fr 90px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.vessel-row:last-child { border-bottom: none; }
.vessel-row:nth-child(even) { background: var(--row-alt, #fafaf7); }
.vessel-label { font-weight: 700; font-size: 14px; }
.recipe-display { font-size: 13px; }
.recipe-display .full-name { font-weight: 500; }
.recipe-display .no-prod { color: var(--text-light); font-style: italic; }
.yield-val { font-size: 13px; color: var(--accent); font-weight: 600; text-align: center; }
.day-actions { padding: 10px 16px; background: #fafaf7; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
.btn-daily { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn-daily:hover { opacity: 0.9; }
.pct-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.pct-0 { background: #f0f0ea; color: var(--text-light); }
.pct-partial { background: #fff3cd; color: #856404; }
.pct-done { background: #d4edda; color: #155724; }
.no-schedule { text-align: center; padding: 60px 20px; color: var(--text-light); }
.no-schedule h2 { margin-bottom: 12px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
.week-nav { display: flex; align-items: center; gap: 16px; }
.week-nav-btn { background: var(--card-bg, #fff); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: var(--dark); }
.week-nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.week-label { font-size: 16px; font-weight: 600; color: var(--dark); min-width: 200px; text-align: center; }
.notes-card { background: var(--card-bg, #fff); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
.notes-card h3 { font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
.notes-card p { font-size: 14px; color: var(--dark); white-space: pre-wrap; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Weekly Schedule</h1><p id="week-subtitle">Loading...</p></div>
    <div class="header-right"><a href="/" class="header-btn">Back to Dashboard</a></div>
</div>
<div class="main">
    <div class="top-bar">
        <div class="week-nav">
            <button class="week-nav-btn" onclick="prevWeek()" title="Previous week">&larr;</button>
            <span class="week-label" id="week-label">Loading...</span>
            <button class="week-nav-btn" onclick="nextWeek()" title="Next week">&rarr;</button>
        </div>
        <a id="edit-btn" href="#" class="btn btn-outline">Edit Schedule</a>
    </div>
    <div id="notes-area"></div>
    <div id="schedule-content"></div>
</div>
<script>
var DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var VESSELS = ['K1','K2','K3','K4(115L)'];
var currentWeekId = '';

function getCurrentMonday() {
    var today = new Date();
    var day = today.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    var mon = new Date(today);
    mon.setDate(today.getDate() + diff);
    return mon;
}
function formatDate(d) { return d.toISOString().split('T')[0]; }

function getWeekId() {
    var params = new URLSearchParams(window.location.search);
    var w = params.get('week');
    if (w) return w;
    return formatDate(getCurrentMonday());
}

function shiftWeek(offset) {
    var d = new Date(currentWeekId + 'T00:00:00');
    d.setDate(d.getDate() + (offset * 7));
    currentWeekId = formatDate(d);
    history.replaceState(null, '', '/weekly-schedule?week=' + currentWeekId);
    loadWeek(currentWeekId);
}

function prevWeek() { shiftWeek(-1); }
function nextWeek() { shiftWeek(1); }

function formatWeekLabel(weekId) {
    var d = new Date(weekId + 'T00:00:00');
    var endDate = new Date(d);
    endDate.setDate(endDate.getDate() + 6);
    var opts = { month: 'short', day: 'numeric' };
    return d.toLocaleDateString('en-GB', opts) + ' — ' + endDate.toLocaleDateString('en-GB', opts) + ', ' + endDate.getFullYear();
}

document.addEventListener('DOMContentLoaded', function() {
    currentWeekId = getWeekId();
    loadWeek(currentWeekId);
});

async function loadWeek(weekId) {
    var subtitle = document.getElementById('week-subtitle');
    var label = document.getElementById('week-label');
    var editBtn = document.getElementById('edit-btn');
    var container = document.getElementById('schedule-content');
    var notesArea = document.getElementById('notes-area');

    subtitle.textContent = 'Week of ' + weekId;
    label.textContent = formatWeekLabel(weekId);
    editBtn.href = '/create-schedule?week=' + weekId;

    try {
        var res = await fetch('/api/schedule/' + weekId);
        var data = await res.json();

        if (!data.schedule) {
            notesArea.innerHTML = '';
            container.innerHTML = '<div class="no-schedule"><h2>No schedule for this week</h2><p>Use the arrows to browse other weeks, or create a new schedule.</p><a href="/create-schedule?week=' + weekId + '" class="btn btn-primary" style="margin-top:16px;display:inline-block;padding:12px 24px;text-decoration:none;">Create Schedule for This Week</a></div>';
            return;
        }

        // Show notes if any
        if (data.notes && data.notes.trim()) {
            notesArea.innerHTML = '<div class="notes-card"><h3>Weekly Notes</h3><p>' + data.notes.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p></div>';
        } else {
            notesArea.innerHTML = '';
        }

        // Load recipes and statuses
        var recipesRes = await fetch('/api/recipes');
        var recipes = await recipesRes.json();
        var statusRes = await fetch('/api/checklist-status/' + weekId);
        var statuses = await statusRes.json();

        var schedule = data.schedule;
        var html = '';

        for (var idx = 0; idx < 7; idx++) {
            var dayData = schedule[String(idx)] || {};
            var d = new Date(weekId + 'T00:00:00');
            d.setDate(d.getDate() + idx);
            var ds = d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'numeric'});
            var lot = d.toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'2-digit'}).replace(/\//g, '');

            var hasProduction = false;
            html += '<div class="day-block"><div class="day-header"><span>' + DAYS[idx] + ' — ' + ds + '</span><span class="lot">LOT# ' + lot + '</span></div>';

            for (var v = 0; v < VESSELS.length; v++) {
                var vessel = VESSELS[v];
                var recipeName = dayData[vessel] || '';
                var recipeData = recipeName ? recipes[recipeName] : null;
                var displayName = '';
                var target = '';

                if (recipeName && recipeData) {
                    hasProduction = true;
                    var brand = recipeData.brand || '';
                    displayName = brand ? brand + '-' + recipeName : recipeName;
                    target = recipeData.yield ? recipeData.yield + ' units' : '';
                }

                html += '<div class="vessel-row"><span class="vessel-label">' + vessel + '</span>';
                if (displayName) {
                    html += '<span class="recipe-display"><span class="full-name">' + displayName + '</span></span>';
                    html += '<span class="yield-val">' + target + '</span>';
                } else {
                    html += '<span class="recipe-display"><span class="no-prod">No production</span></span>';
                    html += '<span class="yield-val"></span>';
                }
                html += '</div>';
            }

            if (hasProduction) {
                var st = statuses[String(idx)] || 'not_started';
                var pctClass = st === 'completed' ? 'pct-done' : st === 'in_progress' ? 'pct-partial' : 'pct-0';
                var pctLabel = st === 'completed' ? 'Complete' : st === 'in_progress' ? 'In Progress' : 'Not Started';
                html += '<div class="day-actions"><a href="/daily-production/' + weekId + '/' + idx + '" class="btn-daily">See Daily Production</a><span class="pct-badge ' + pctClass + '">' + pctLabel + '</span></div>';
            }

            html += '</div>';
        }

        container.innerHTML = html;

    } catch (e) {
        container.innerHTML = '<div class="no-schedule"><p>Error loading schedule: ' + e.message + '</p></div>';
    }
}
</script>
</body>
</html>
