<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Recipe Cards</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.recipe-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--border); gap: 8px; cursor: grab; }
.recipe-list-item:active { cursor: grabbing; }
.recipe-list-item.dragging { opacity: 0.4; background: var(--warning); }
.recipe-list-item.drag-over { border-top: 3px solid var(--accent); }
.recipe-info .recipe-name { font-size: 14px; font-weight: 600; color: var(--dark); }
.recipe-info .recipe-meta { font-size: 11px; color: var(--text-light); }
.recipe-info .organic-badge { font-size: 10px; background: #e8f5e9; color: #2e7d32; padding: 1px 6px; border-radius: 8px; font-weight: 600; margin-left: 6px; }
.recipe-btns { display: flex; gap: 6px; flex-shrink: 0; }
.upload-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; }
.upload-zone:hover,.upload-zone.dragover { border-color: var(--accent); background: rgba(74,103,65,0.05); }
.upload-zone p { color: var(--text-light); font-size: 14px; }
.upload-zone input { display: none; }
.modal-meta { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }
.modal-section { margin-bottom: 12px; }
.modal-section-title { background: var(--dark); color: #fff; padding: 6px 10px; font-size: 12px; font-weight: 600; border-radius: 4px; margin-bottom: 6px; }
.modal-section-title.warning { background: var(--warning); color: #856404; }
.modal-item { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.modal-item:last-child { border-bottom: none; }
.recipe-photo { max-width: 100%; border-radius: 8px; margin-bottom: 12px; }
.edit-field { margin-bottom: 12px; }
.edit-field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-light); }
.edit-field input,.edit-field textarea,.edit-field select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
.edit-field textarea { min-height: 80px; resize: vertical; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.add-btns { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
.brand-group { margin-bottom: 16px; }
.brand-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 2px solid var(--accent); margin-bottom: 4px; cursor: grab; }
.brand-header:active { cursor: grabbing; }
.brand-header.drag-over { border-top: 3px solid var(--dark); }
.brand-label { font-size: 13px; font-weight: 700; color: var(--accent); }
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.filter-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--card-bg); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.drag-handle { color: var(--text-light); font-size: 16px; margin-right: 8px; }
.photo-upload-area { margin-top: 12px; padding: 12px; border: 1px dashed var(--border); border-radius: 6px; text-align: center; cursor: pointer; }
.photo-upload-area:hover { border-color: var(--accent); }
.photo-upload-area input { display: none; }
.ing-section { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 6px; padding: 10px; background: #fafafa; }
.ing-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ing-section-title { font-size: 12px; font-weight: 600; color: var(--text); }
.ing-row { display: grid; grid-template-columns: 70px 90px 1fr 1fr 28px; gap: 6px; margin-bottom: 6px; align-items: center; }
.ing-row input, .ing-row select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; font-family: inherit; width: 100%; box-sizing: border-box; }
.ing-row.needs-review { background: #fff8e1; border-radius: 4px; padding: 4px; border-left: 3px solid #f9a825; }
.ing-row-btn { background: #d32f2f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; height: 28px; padding: 0; }
.ing-add-btn { background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-weight: 600; }
.ing-review-label { font-size: 10px; color: #f9a825; font-weight: 700; margin-left: 6px; }
.migrate-banner { background: #fff3cd; border: 1px solid #ffe08a; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: #856404; display: none; }
.migrate-banner.show { display: block; }
.migrate-banner button { margin-left: 10px; padding: 4px 10px; font-size: 11px; background: #856404; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
.ing-row-header { display: grid; grid-template-columns: 70px 90px 1fr 1fr 28px; gap: 6px; font-size: 10px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Recipe Cards</h1><p>Manage production recipes</p></div>
    <div class="header-right"><a href="/" class="header-btn">Back to Dashboard</a></div>
</div>
<div class="main">
    <div class="migrate-banner" id="migrate-banner"><span id="migrate-msg"></span><button onclick="runMigration()">Migrate &amp; Save</button></div>
    <div class="card">
        <h2>Add Recipe</h2>
        <div class="add-btns">
            <button class="btn btn-primary" onclick="openAddManual()">Add Recipe Manually</button>
            <span style="color:var(--text-light);font-size:13px;">or upload PDF below</span>
        </div>
        <div class="upload-zone" id="upload-zone"><p>Upload recipe card PDF</p><input type="file" id="recipe-upload" accept=".pdf"></div>
        <div id="upload-status" class="status" style="margin-top:12px;"></div>
    </div>
    <div class="card">
        <h2>All Recipes (<span id="recipe-count">0</span>)</h2>
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
            <button class="filter-btn" onclick="setFilter('Organic',this)">Organic</button>
            <button class="filter-btn" onclick="setFilter('Pasture Raised',this)">Pasture Raised</button>
            <button class="filter-btn" onclick="setFilter('Conventional',this)">Conventional</button>
        </div>
        <p style="font-size:11px;color:var(--text-light);margin-bottom:10px;">Drag to reorder brands and recipes.</p>
        <div id="recipe-list"></div>
    </div>
</div>
<div class="modal-overlay" id="view-modal"><div class="modal"><button class="modal-close" onclick="closeModal('view-modal')">&times;</button><h2 id="view-name"></h2><div class="modal-meta" id="view-meta"></div><div id="view-photo"></div><div id="view-body"></div><div class="photo-upload-area" id="photo-area" style="display:none;"><p style="font-size:12px;color:var(--text-light);">Tap to upload product photo</p><input type="file" id="photo-input" accept="image/*"></div></div></div>
<div class="modal-overlay" id="edit-modal"><div class="modal"><button class="modal-close" onclick="closeModal('edit-modal')">&times;</button><h2 id="edit-title">Edit Recipe</h2><div id="edit-form"></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal('edit-modal')">Cancel</button><button class="btn btn-primary" id="edit-save-btn" onclick="saveEdit()">Save Changes</button></div></div></div>
<script>
var recipes={};var editingName='';var isAdding=false;var currentFilter='all';var brandOrder=[];var recipeOrder={};var viewingName='';
function closeModal(id){document.getElementById(id).classList.remove('active');}
document.addEventListener('DOMContentLoaded',async function(){recipes=await(await fetch('/api/recipes')).json();await loadOrder();renderList();checkMigration();});
async function loadOrder(){try{var res=await fetch('/api/recipes/grouped');var g=await res.json();brandOrder=Object.keys(g);recipeOrder={};Object.keys(g).forEach(function(b){recipeOrder[b]=g[b].map(function(r){return r.name;});});}catch(e){}}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderList();}

function renderList(){
    var container=document.getElementById('recipe-list');var names=Object.keys(recipes);
    var filtered=names;
    if(currentFilter && currentFilter!=='all'){
        filtered=names.filter(function(n){
            return(recipes[n].certification||'').toLowerCase()===currentFilter.toLowerCase();
        });
    }
    // Split active vs archived
    var activeNames=filtered.filter(function(n){return !recipes[n].archived;});
    var archivedNames=filtered.filter(function(n){return !!recipes[n].archived;});
    document.getElementById('recipe-count').textContent=activeNames.length;
    if(!activeNames.length && !archivedNames.length){container.innerHTML='<p style="color:var(--text-light)">No recipes'+(currentFilter!=='all'?' with '+currentFilter+' certification':'')+'</p>';return;}

    function renderBrandGroup(brand,items,archived){
        var brandSafe=brand.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
        var html='<div class="brand-group" data-brand="'+brandSafe+'"><div class="brand-header"'+(archived?'':' draggable="true"')+' data-brand-drag="'+brandSafe+'"><span class="brand-label">'+brand+'</span></div>';
        items.forEach(function(name){
            var r=recipes[name];var nameSafe=name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
            var certVal=(r.certification||'').trim();
            var cert='';
            if(certVal){
                var bg='#999',fg='#fff';
                var lc=certVal.toLowerCase();
                if(lc==='organic'){bg='#2e7d32';fg='#fff';}
                else if(lc==='pasture raised'){bg='#0288d1';fg='#fff';}
                else if(lc==='conventional'){bg='#757575';fg='#fff';}
                cert='<span class="cert-badge" style="font-size:10px;background:'+bg+';color:'+fg+';padding:2px 6px;border-radius:8px;font-weight:600;margin-left:6px;">'+certVal+'</span>';
            }
            var archBadge=archived?'<span style="font-size:10px;background:#999;color:#fff;padding:2px 6px;border-radius:8px;margin-left:6px;">Archived</span>':'';
            html+='<div class="recipe-list-item"'+(archived?' style="opacity:0.7;"':' draggable="true"')+' data-recipe-name="'+nameSafe+'" data-recipe-brand="'+brandSafe+'">';
            html+='<div class="recipe-info"><div class="recipe-name">'+(archived?'':'<span class="drag-handle">&#9776;</span>')+name+cert+archBadge+'</div><div class="recipe-meta">'+(r.format||'')+' | Target: '+(r.yield||'--')+' units</div></div>';
            var btns='<button class="btn-sm" data-action="view" data-name="'+nameSafe+'">View</button>';
            if(!archived){
                btns+='<button class="btn-sm" data-action="edit" data-name="'+nameSafe+'">Edit</button>';
                btns+='<button class="btn-sm" data-action="duplicate" data-name="'+nameSafe+'">Duplicate</button>';
                btns+='<button class="btn-sm" data-action="archive" data-name="'+nameSafe+'">Archive</button>';
            } else {
                btns+='<button class="btn-sm" data-action="unarchive" data-name="'+nameSafe+'">Unarchive</button>';
                btns+='<button class="btn-danger" data-action="delete" data-name="'+nameSafe+'">Delete</button>';
            }
            html+='<div class="recipe-btns">'+btns+'</div></div>';
        });
        html+='</div>';
        return html;
    }

    function buildGroups(nameList){
        var brands={};nameList.forEach(function(name){var brand=recipes[name].brand||'Other';if(!brands[brand])brands[brand]=[];brands[brand].push(name);});
        var sortedBrands=brandOrder.filter(function(b){return brands[b];});Object.keys(brands).forEach(function(b){if(sortedBrands.indexOf(b)<0)sortedBrands.push(b);});
        return {brands:brands,sortedBrands:sortedBrands};
    }

    var html='';
    var active=buildGroups(activeNames);
    active.sortedBrands.forEach(function(brand){
        var items=active.brands[brand];
        if(recipeOrder[brand]){var ordered=recipeOrder[brand].filter(function(n){return items.indexOf(n)>=0;});items.forEach(function(n){if(ordered.indexOf(n)<0)ordered.push(n);});items=ordered;}
        html+=renderBrandGroup(brand,items,false);
    });

    // Archived section — hidden by default, expandable
    if(archivedNames.length){
        html+='<div style="margin-top:30px;padding-top:16px;border-top:2px solid var(--border);">';
        html+='<button class="btn btn-outline" onclick="toggleArchived()" id="archived-toggle" style="font-size:12px;">Show archived ('+archivedNames.length+')</button>';
        html+='<div id="archived-section" style="display:none;margin-top:12px;">';
        var arch=buildGroups(archivedNames);
        arch.sortedBrands.forEach(function(brand){
            var items=arch.brands[brand];
            html+=renderBrandGroup(brand,items,true);
        });
        html+='</div></div>';
    }

    container.innerHTML=html;
    attachClickDelegationOnce();
    attachDragListeners();
}

function toggleArchived(){
    var section=document.getElementById('archived-section');
    var btn=document.getElementById('archived-toggle');
    if(section.style.display==='none'){
        section.style.display='block';
        btn.textContent=btn.textContent.replace('Show archived','Hide archived');
    } else {
        section.style.display='none';
        btn.textContent=btn.textContent.replace('Hide archived','Show archived');
    }
}

var draggedBrand=null;
var draggedRecipe=null;var draggedRecipeBrand=null;

// Attached ONCE to the stable #recipe-list element. Re-rendering the children
// via innerHTML doesn't break this delegated handler, but RE-ATTACHING it on
// every renderList() would stack copies and cause N popups per click.
function attachClickDelegationOnce(){
    var list=document.getElementById('recipe-list');
    if(!list || list.dataset.delegated)return;
    list.dataset.delegated='1';
    list.addEventListener('click',function(e){
        var btn=e.target.closest('[data-action]');
        if(!btn)return;
        e.stopPropagation();
        var name=btn.getAttribute('data-name');
        var action=btn.getAttribute('data-action');
        if(action==='view')viewRecipe(name);
        else if(action==='edit')editRecipe(name);
        else if(action==='delete')deleteRecipe(name);
        else if(action==='duplicate')duplicateRecipe(name);
        else if(action==='archive')archiveRecipe(name);
        else if(action==='unarchive')unarchiveRecipe(name);
    });
}

function attachDragListeners(){
    // Drag listeners attach to specific child elements that are recreated on
    // each renderList(); they go away with the old DOM, so re-attaching is fine.

    // Brand drag
    document.querySelectorAll('.brand-header[data-brand-drag]').forEach(function(el){
        el.addEventListener('dragstart',function(e){draggedBrand=el.getAttribute('data-brand-drag');el.classList.add('dragging');});
        el.addEventListener('dragover',function(e){e.preventDefault();el.classList.add('drag-over');});
        el.addEventListener('dragleave',function(){el.classList.remove('drag-over');});
        el.addEventListener('drop',function(e){
            e.preventDefault();el.classList.remove('drag-over');
            var targetBrand=el.getAttribute('data-brand-drag');
            if(!draggedBrand||draggedBrand===targetBrand)return;
            var i1=brandOrder.indexOf(draggedBrand);if(i1>=0)brandOrder.splice(i1,1);
            var ni=brandOrder.indexOf(targetBrand);brandOrder.splice(ni,0,draggedBrand);
            saveOrder();renderList();draggedBrand=null;
        });
        el.addEventListener('dragend',function(){el.classList.remove('dragging');});
    });

    // Recipe drag
    document.querySelectorAll('.recipe-list-item[data-recipe-name]').forEach(function(el){
        el.addEventListener('dragstart',function(e){
            draggedRecipe=el.getAttribute('data-recipe-name');
            draggedRecipeBrand=el.getAttribute('data-recipe-brand');
            el.classList.add('dragging');
            e.stopPropagation();
        });
        el.addEventListener('dragover',function(e){e.preventDefault();e.stopPropagation();el.classList.add('drag-over');});
        el.addEventListener('dragleave',function(){el.classList.remove('drag-over');});
        el.addEventListener('drop',function(e){
            e.preventDefault();e.stopPropagation();el.classList.remove('drag-over');
            var targetName=el.getAttribute('data-recipe-name');
            var targetBrand=el.getAttribute('data-recipe-brand');
            if(!draggedRecipe||draggedRecipe===targetName||draggedRecipeBrand!==targetBrand)return;
            var list=recipeOrder[targetBrand]||[];
            var i1=list.indexOf(draggedRecipe);if(i1>=0)list.splice(i1,1);
            var i2=list.indexOf(targetName);list.splice(i2,0,draggedRecipe);
            recipeOrder[targetBrand]=list;
            saveOrder();renderList();draggedRecipe=null;
        });
        el.addEventListener('dragend',function(){el.classList.remove('dragging');});
    });
}

async function saveOrder(){await fetch('/api/recipes/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand_order:brandOrder,recipe_order:recipeOrder})});}


function viewRecipe(name){
    var r=recipes[name];if(!r)return;viewingName=name;
    document.getElementById('view-name').textContent=(r.brand?r.brand+'-':'')+name;
    var meta=(r.format||'')+' | Target: '+(r.yield||'--')+' units';if(r.certification)meta+=' | '+r.certification;
    document.getElementById('view-meta').textContent=meta;
    var photoHtml='';if(r.photo){photoHtml='<img src="/api/photos/'+r.photo+'" class="recipe-photo">';}
    document.getElementById('view-photo').innerHTML=photoHtml;
    var html='';
    if(r.special_instructions&&r.special_instructions.length){html+='<div class="modal-section"><div class="modal-section-title warning">Special Instructions</div>';r.special_instructions.forEach(function(s){html+='<div class="modal-item">'+esc(s)+'</div>';});html+='</div>';}
    [['Add to kettle overnight','kettle_overnight'],['Add after skim','after_skim'],['Finishing','finishing'],['Add to jar/container','add_to_jar']].forEach(function(pair){
        var items=r[pair[1]];
        if(items&&items.length){
            html+='<div class="modal-section"><div class="modal-section-title">'+pair[0]+'</div>';
            items.forEach(function(item){
                var disp=formatIngredient(item);
                var flag=(item&&item.needs_review)?'<span class="ing-review-label">NEEDS REVIEW</span>':'';
                html+='<div class="modal-item">'+esc(disp)+flag+'</div>';
            });
            html+='</div>';
        }
    });
    document.getElementById('view-body').innerHTML=html;
    document.getElementById('photo-area').style.display='block';
    document.getElementById('view-modal').classList.add('active');
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function formatIngredient(item){
    if(item==null)return '';
    if(typeof item==='string')return item;
    var amt=item.amount;
    var unit=item.unit||'';
    var name=item.name||'';
    var proc=item.process||'';
    var parts=[];
    if(amt!==0&&amt!=null&&amt!=='')parts.push(String(amt));
    if(unit)parts.push(unit);
    if(name)parts.push(name);
    var base=parts.length?parts.join(' '):name;
    return proc?(base+' \u2014 '+proc):base;
}

// Photo upload
var photoArea=document.getElementById('photo-area');
var photoInput=document.getElementById('photo-input');
photoArea.addEventListener('click',function(){photoInput.click();});
photoInput.addEventListener('change',async function(){
    if(!photoInput.files.length||!viewingName)return;
    var fd=new FormData();fd.append('photo',photoInput.files[0]);
    var res=await fetch('/api/recipes/'+encodeURIComponent(viewingName)+'/photo',{method:'POST',body:fd});
    var data=await res.json();
    if(data.success){recipes=await(await fetch('/api/recipes')).json();viewRecipe(viewingName);}
});

var UNITS=['kg','g','L','ml','lbs','Bunch','Pack','Adjunct','per L'];

function ingRowHTML(sectionId,idx,item){
    item=item||{name:'',amount:'',unit:'',process:''};
    var isObj=(typeof item==='object'&&item!==null);
    var amt=isObj?(item.amount===0||item.amount==null||item.amount===''?'':item.amount):'';
    var unit=isObj?(item.unit||''):'';
    var name=isObj?(item.name||''):String(item||'');
    var proc=isObj?(item.process||''):'';
    var review=isObj&&item.needs_review?' needs-review':'';
    var unitOpts='<option value=""></option>';
    UNITS.forEach(function(u){unitOpts+='<option value="'+u+'"'+(u===unit?' selected':'')+'>'+u+'</option>';});
    return '<div class="ing-row'+review+'" data-section="'+sectionId+'" data-idx="'+idx+'">'+
        '<input type="number" step="any" class="ing-amount" value="'+esc(amt)+'" placeholder="Qty">'+
        '<select class="ing-unit">'+unitOpts+'</select>'+
        '<input type="text" class="ing-name" value="'+esc(name)+'" placeholder="Ingredient name">'+
        '<input type="text" class="ing-process" value="'+esc(proc)+'" placeholder="Process (optional)">'+
        '<button type="button" class="ing-row-btn" onclick="removeIngRow(this)">×</button>'+
        '</div>';
}

function ingSectionHTML(sectionId,title,items){
    items=items||[];
    var rows='';
    items.forEach(function(it,i){rows+=ingRowHTML(sectionId,i,it);});
    return '<div class="ing-section" id="ing-sec-'+sectionId+'">'+
        '<div class="ing-section-header"><span class="ing-section-title">'+title+'</span>'+
        '<button type="button" class="ing-add-btn" onclick="addIngRow(\''+sectionId+'\')">+ Add</button></div>'+
        '<div class="ing-row-header"><div>Amount</div><div>Unit</div><div>Name</div><div>Process</div><div></div></div>'+
        '<div class="ing-rows" id="ing-rows-'+sectionId+'">'+rows+'</div></div>';
}

function addIngRow(sectionId){
    var rows=document.getElementById('ing-rows-'+sectionId);
    var idx=rows.children.length;
    var tmp=document.createElement('div');tmp.innerHTML=ingRowHTML(sectionId,idx,null);
    rows.appendChild(tmp.firstChild);
}
function removeIngRow(btn){
    var row=btn.closest('.ing-row');if(row)row.remove();
}

function collectIngRows(sectionId){
    var rows=document.querySelectorAll('#ing-rows-'+sectionId+' .ing-row');
    var out=[];
    rows.forEach(function(r){
        var amtStr=r.querySelector('.ing-amount').value.trim();
        var unit=r.querySelector('.ing-unit').value.trim();
        var name=r.querySelector('.ing-name').value.trim();
        var proc=r.querySelector('.ing-process').value.trim();
        if(!name&&!amtStr&&!unit&&!proc)return;
        var amt=0;
        if(amtStr!==''){var n=parseFloat(amtStr);if(!isNaN(n))amt=(n===Math.floor(n))?Math.floor(n):n;}
        out.push({name:name,amount:amt,unit:unit,process:proc,needs_review:false});
    });
    return out;
}

function buildEditForm(name,r){
    var html='';
    html+='<div class="edit-field"><label>Brand Name</label><input id="e-brand" value="'+esc((r&&r.brand)||'')+'" placeholder="e.g. Ripe, SOMA"></div>';
    html+='<div class="edit-field"><label>Recipe Name</label><input id="e-name" value="'+esc(name||'')+'" placeholder="e.g. Liquid Gold"></div>';
    html+='<div class="edit-field"><label>Format</label><input id="e-format" value="'+esc((r&&r.format)||'')+'" placeholder="SS-876ML, FZ-750ML, SS-750ML"></div>';
    html+='<div class="edit-field"><label>Target Yield</label><input type="number" id="e-yield" value="'+((r&&r.yield)||'')+'" placeholder="150"></div>';
    html+='<div class="edit-field"><label>Certification</label><select id="e-cert">';
    var certCurrent=(r&&r.certification)||'';
    var certOpts=['','Organic','Pasture Raised','Conventional'];
    certOpts.forEach(function(opt){
        var label=opt||'None';
        var selected=(certCurrent.toLowerCase()===opt.toLowerCase())?' selected':'';
        html+='<option value="'+esc(opt)+'"'+selected+'>'+esc(label)+'</option>';
    });
    html+='</select></div>';
    html+='<div class="edit-field"><label>Special Instructions (one per line)</label><textarea id="e-special">'+esc(((r&&r.special_instructions)||[]).join('\n'))+'</textarea></div>';
    html+=ingSectionHTML('overnight','Kettle Overnight',(r&&r.kettle_overnight)||[]);
    html+=ingSectionHTML('skim','After Skim',(r&&r.after_skim)||[]);
    html+=ingSectionHTML('finishing','Finishing',(r&&r.finishing)||[]);
    html+=ingSectionHTML('jar','Add to Jar',(r&&r.add_to_jar)||[]);
    return html;
}
function openAddManual(){isAdding=true;editingName='';document.getElementById('edit-title').textContent='Add Recipe';document.getElementById('edit-save-btn').textContent='Add Recipe';document.getElementById('edit-form').innerHTML=buildEditForm('',null);document.getElementById('edit-modal').classList.add('active');}
function editRecipe(name){isAdding=false;editingName=name;document.getElementById('edit-title').textContent='Edit Recipe';document.getElementById('edit-save-btn').textContent='Save Changes';document.getElementById('edit-form').innerHTML=buildEditForm(name,recipes[name]);document.getElementById('edit-modal').classList.add('active');}
function toLines(id){return document.getElementById(id).value.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});}
async function saveEdit(){
    var newName=document.getElementById('e-name').value.trim();if(!newName){alert('Recipe name required');return;}
    // Rename collision pre-check (gives faster feedback than waiting on server).
    // Only fires if user changed the name in the form.
    if(!isAdding && newName!==editingName && recipes[newName]){
        alert('A different recipe named "'+newName+'" already exists. Choose another name or delete that recipe first.');
        return;
    }
    if(isAdding && recipes[newName]){
        alert('A recipe named "'+newName+'" already exists.');
        return;
    }
    var data={name:newName,data:{
        brand:document.getElementById('e-brand').value.trim(),
        format:document.getElementById('e-format').value.trim(),
        yield:parseInt(document.getElementById('e-yield').value)||150,
        certification:document.getElementById('e-cert').value,
        special_instructions:toLines('e-special'),
        kettle_overnight:collectIngRows('overnight'),
        after_skim:collectIngRows('skim'),
        finishing:collectIngRows('finishing'),
        add_to_jar:collectIngRows('jar')
    }};
    // Preserve photo field if editing
    if(!isAdding&&recipes[editingName]&&recipes[editingName].photo){data.data.photo=recipes[editingName].photo;}
    var res;
    if(isAdding){res=await fetch('/api/recipes/upload-json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newName,data:data.data})});}
    else{res=await fetch('/api/recipes/'+encodeURIComponent(editingName),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});}
    var resData;
    try{resData=await res.json();}catch(e){resData={error:'Server error'};}
    if(!res.ok){alert(resData.error||'Save failed');return;}
    closeModal('edit-modal');recipes=await(await fetch('/api/recipes')).json();await loadOrder();renderList();checkMigration();
}

// Check if any recipes need migration/review and show banner
function checkMigration(){
    var needsReview=0;var total=0;
    Object.keys(recipes).forEach(function(n){
        ['kettle_overnight','after_skim','finishing','add_to_jar'].forEach(function(s){
            var items=recipes[n][s]||[];
            items.forEach(function(it){total++;if(it&&it.needs_review)needsReview++;});
        });
    });
    var banner=document.getElementById('migrate-banner');
    if(needsReview>0){
        document.getElementById('migrate-msg').textContent=needsReview+' ingredient(s) need review after auto-migration. Open a recipe to fix highlighted rows, or save current state to disk:';
        banner.classList.add('show');
    } else {
        banner.classList.remove('show');
    }
}

async function runMigration(){
    var res=await fetch('/api/recipes/migrate-all',{method:'POST'});
    var data=await res.json();
    if(data.success){
        alert('Migrated '+data.changed+' of '+data.total+' recipes. '+data.review_count+' items flagged for review.');
        recipes=await(await fetch('/api/recipes')).json();await loadOrder();renderList();checkMigration();
    }
}
async function deleteRecipe(name){
    if(!confirm('Delete "'+name+'"?'))return;
    var res=await fetch('/api/recipes/'+encodeURIComponent(name),{method:'DELETE'});
    if(!res.ok){
        var data;try{data=await res.json();}catch(e){data={error:'Delete failed'};}
        alert(data.error||'Delete failed');
        return;
    }
    recipes=await(await fetch('/api/recipes')).json();
    renderList();
}

async function duplicateRecipe(name){
    var defaultName='(copy) '+name;
    var newName=prompt('Name for the duplicate:', defaultName);
    if(newName===null)return;  // user cancelled
    newName=newName.trim();
    if(!newName){alert('Name cannot be empty');return;}
    if(newName===name){alert('Pick a different name from the original');return;}
    // The backend re-checks for collisions authoritatively; we still pre-check
    // against the current snapshot to give faster feedback.
    if(recipes[newName]){alert('A recipe named "'+newName+'" already exists');return;}
    var res=await fetch('/api/recipes/'+encodeURIComponent(name)+'/duplicate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({new_name:newName}),
    });
    var data;
    try{data=await res.json();}catch(e){data={error:'Server error'};}
    if(!res.ok || !data.success){alert(data.error||'Duplicate failed');return;}
    // Reload from server so the original is guaranteed visible alongside the copy
    recipes=await(await fetch('/api/recipes')).json();
    await loadOrder();
    renderList();
}

async function archiveRecipe(name){
    var res=await fetch('/api/recipes/'+encodeURIComponent(name)+'/archive',{method:'POST'});
    var data=await res.json();
    if(!data.success){alert(data.error||'Archive failed');return;}
    var refs=data.schedule_refs||[];
    if(refs.length){
        // Warn but allow — recipe is now archived but stays in storage so refs still resolve
        var msg=name+' is archived.\n\nIt is still referenced in '+refs.length+' scheduled slot'+(refs.length===1?'':'s')+':\n';
        var sample=refs.slice(0,5).map(function(r){return '  • Week '+r.week_id+', day '+r.day_idx+', vessel '+r.vessel;}).join('\n');
        msg+=sample;
        if(refs.length>5)msg+='\n  …and '+(refs.length-5)+' more.';
        msg+='\n\nThose schedules will continue to work, but the recipe will not appear in new schedule pickers.';
        alert(msg);
    }
    recipes=await(await fetch('/api/recipes')).json();
    renderList();
}

async function unarchiveRecipe(name){
    var res=await fetch('/api/recipes/'+encodeURIComponent(name)+'/unarchive',{method:'POST'});
    var data=await res.json();
    if(!data.success){alert(data.error||'Unarchive failed');return;}
    recipes=await(await fetch('/api/recipes')).json();
    renderList();
}

var uz=document.getElementById('upload-zone');var ui=document.getElementById('recipe-upload');
uz.addEventListener('click',function(){ui.click();});
uz.addEventListener('dragover',function(e){e.preventDefault();uz.classList.add('dragover');});
uz.addEventListener('dragleave',function(){uz.classList.remove('dragover');});
uz.addEventListener('drop',function(e){e.preventDefault();uz.classList.remove('dragover');if(e.dataTransfer.files.length)doUpload(e.dataTransfer.files[0]);});
ui.addEventListener('change',function(){if(ui.files.length)doUpload(ui.files[0]);});
async function doUpload(file){
    var st=document.getElementById('upload-status');st.className='status loading';st.textContent='Parsing...';st.style.display='block';
    var fd=new FormData();fd.append('file',file);
    try{var res=await fetch('/api/recipes/upload',{method:'POST',body:fd});var data=await res.json();if(data.success){st.className='status success';st.textContent='Added: '+data.name;recipes=await(await fetch('/api/recipes')).json();await loadOrder();renderList();checkMigration();}else{st.className='status error';st.textContent=data.error||'Failed';}}
    catch(e){st.className='status error';st.textContent='Error: '+e.message;}
}
