<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soma - Weekly Schedule</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.day-block { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.day-header { background: var(--accent); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.day-header .lot { font-size: 12px; opacity: 0.8; }
.vessel-row { display: grid; grid-template-columns: 70px 1fr 90px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.vessel-row:last-child { border-bottom: none; }
.vessel-row:nth-child(even) { background: var(--row-alt); }
.vessel-label { font-weight: 700; font-size: 13px; }
.recipe-name { font-size: 13px; }
.yield-val { font-size: 13px; color: var(--accent); font-weight: 600; text-align: center; }
.day-actions { padding: 8px 16px; background: #fafaf7; border-top: 1px solid var(--border); display: flex; gap: 10px; }
.no-schedule { text-align: center; padding: 60px 20px; color: var(--text-light); }
.no-schedule h2 { margin-bottom: 12px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Weekly Schedule</h1><p id="week-subtitle">Loading...</p></div>
    <div class="header-right">
        <a href="/" class="header-btn">Back to Dashboard</a>
    </div>
</div>
<div class="main">
    <div class="top-bar" id="top-bar" style="display:none;">
        <div></div>
        <a id="edit-btn" href="#" class="btn btn-outline">Edit Schedule</a>
    </div>
    <div id="schedule-content"></div>
</div>
<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const VESSELS = ['K1','K2','K3','K4(115L)'];

function getWeekId() {
    const params = new URLSearchParams(window.location.search);
    const w = params.get('week');
    if (w) return w;
    const today = new Date();
    const day = today.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(today);
    mon.setDate(today.getDate() + diff);
    return mon.toISOString().split('T')[0];
}

document.addEventListener('DOMContentLoaded', async () => {
    const weekId = getWeekId();
    const weekStart = new Date(weekId + 'T00:00:00');
    document.getElementById('week-subtitle').textContent = 'Week of ' + weekStart.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});

    const res = await fetch('/api/schedule/' + weekId);
    const data = await res.json();
    const container = document.getElementById('schedule-content');

    if (!data.schedule) {
        container.innerHTML = '<div class="no-schedule"><h2>No Schedule Created</h2><p>Create a schedule for this week to get started.</p><br><a href="/create-schedule" class="btn btn-primary">Create Schedule</a></div>';
        return;
    }

    document.getElementById('top-bar').style.display = 'flex';
    document.getElementById('edit-btn').href = '/create-schedule?week=' + weekId;

    const recipes = await (await fetch('/api/recipes')).json();
    let html = '';

    for (let idx = 0; idx < 7; idx++) {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + idx);
        const ds = d.toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric'});
        const lot = d.toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/\//g, '');
        const dayData = data.schedule[String(idx)] || {};
        const hasProduction = Object.values(dayData).some(v => v);

        html += '<div class="day-block"><div class="day-header"><span>' + DAYS[idx] + ' -- ' + ds + '</span><span class="lot">LOT# ' + lot + '</span></div>';

        for (const v of VESSELS) {
            const recipe = dayData[v] || '';
            const rd = recipe ? (recipes[recipe] || {}) : {};
            const target = rd.yield || '';
            html += '<div class="vessel-row"><span class="vessel-label">' + v + '</span><span class="recipe-name">' + (recipe || '<span style="color:var(--text-light)">--</span>') + '</span><span class="yield-val">' + (target ? target + ' units' : '') + '</span></div>';
        }

        if (hasProduction) {
            html += '<div class="day-actions"><a href="/daily-production/' + weekId + '/' + idx + '" class="btn btn-sm btn-outline">See Daily Production</a></div>';
        }
        html += '</div>';
    }

    if (data.notes) {
        html += '<div class="card"><h3>Notes</h3><p style="font-size:13px;white-space:pre-wrap;">' + data.notes + '</p></div>';
    }

    container.innerHTML = html;
});
</script>
</body>
</html>
