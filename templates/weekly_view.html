<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soma - Weekly Schedule</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.day-block { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.day-header { background: var(--accent); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.day-header .lot { font-size: 12px; opacity: 0.8; }
.vessel-row { display: grid; grid-template-columns: 80px 1fr 90px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
.vessel-row:last-child { border-bottom: none; }
.vessel-row:nth-child(even) { background: var(--row-alt); }
.vessel-label { font-weight: 700; font-size: 14px; }
.recipe-display { font-size: 13px; }
.recipe-display .full-name { font-weight: 500; }
.yield-val { font-size: 13px; color: var(--accent); font-weight: 600; text-align: center; }
.day-actions { padding: 10px 16px; background: #fafaf7; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
.btn-daily { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn-daily:hover { background: var(--accent-light); }
.pct-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.pct-0 { background: #f0f0ea; color: var(--text-light); }
.pct-partial { background: var(--warning); color: #856404; }
.pct-done { background: var(--success); color: #155724; }
.no-schedule { text-align: center; padding: 60px 20px; color: var(--text-light); }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Weekly Schedule</h1><p id="week-subtitle">Loading...</p></div>
    <div class="header-right"><a href="/" class="header-btn">Back to Dashboard</a></div>
</div>
<div class="main">
    <div class="top-bar" id="top-bar" style="display:none;"><div></div><a id="edit-btn" href="#" class="btn btn-outline">Edit Schedule</a></div>
    <div id="schedule-content"></div>
</div>
<script>
var DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var VESSELS=['K1','K2','K3','K4(115L)'];

function getWeekId(){var p=new URLSearchParams(window.location.search);var w=p.get('week');if(w)return w;var t=new Date();var d=t.getDay();var diff=d===0?-6:1-d;var m=new Date(t);m.setDate(t.getDate()+diff);return m.toISOString().split('T')[0];}

function getFullName(recipeName, recipeData) {
    if (!recipeName || !recipeData) return '';
    var brand = recipeData.brand || '';
    var fmt = recipeData.format || '';
    var parts = [];
    if (brand) parts.push(brand);
    parts.push(recipeName);
    if (fmt) parts.push(fmt);
    return parts.join('-');
}

document.addEventListener('DOMContentLoaded', async function(){
    var weekId=getWeekId();
    var weekStart=new Date(weekId+'T00:00:00');
    document.getElementById('week-subtitle').textContent='Week of '+weekStart.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    var schedRes=await fetch('/api/schedule/'+weekId);
    var schedData=await schedRes.json();
    var container=document.getElementById('schedule-content');
    if(!schedData.schedule){container.innerHTML='<div class="no-schedule"><h2>No Schedule Created</h2><p>Create a schedule for this week to get started.</p><br><a href="/create-schedule" class="btn btn-primary">Create Schedule</a></div>';return;}
    document.getElementById('top-bar').style.display='flex';
    document.getElementById('edit-btn').href='/create-schedule?week='+weekId;
    var recipes=await(await fetch('/api/recipes')).json();
    var statuses=await(await fetch('/api/checklist-status/'+weekId)).json();
    var html='';
    if(schedData.notes){html+='<div class="card"><h3>Notes</h3><div style="font-size:13px;white-space:pre-wrap;padding:8px 0;">'+schedData.notes+'</div></div>';}
    for(var idx=0;idx<7;idx++){
        var d=new Date(weekStart);d.setDate(d.getDate()+idx);
        var ds=d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
        var lot=d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/\//g,'');
        var dayData=schedData.schedule[String(idx)]||{};
        var hasP=Object.values(dayData).some(function(v){return v;});
        html+='<div class="day-block"><div class="day-header"><span>'+DAYS[idx]+' -- '+ds+'</span><span class="lot">LOT# '+lot+'</span></div>';
        for(var v=0;v<VESSELS.length;v++){
            var vessel=VESSELS[v];
            var recipe=dayData[vessel]||'';
            var rd=recipe?(recipes[recipe]||{}):null;
            var target=rd?rd.yield:'';
            var displayName=recipe?getFullName(recipe,rd):'';
            html+='<div class="vessel-row"><span class="vessel-label">'+vessel+'</span><span class="recipe-display"><span class="full-name">'+(displayName||'<span style="color:var(--text-light)">--</span>')+'</span></span><span class="yield-val">'+(target?target+' units':'')+'</span></div>';
        }
        if(hasP){
            var st=statuses[String(idx)]||'not_started';
            var pc=st==='completed'?'pct-done':st==='in_progress'?'pct-partial':'pct-0';
            var pl=st==='completed'?'Complete':st==='in_progress'?'In Progress':'Not Started';
            html+='<div class="day-actions"><a href="/daily-production/'+weekId+'/'+idx+'" class="btn-daily">See Daily Production</a><span class="pct-badge '+pc+'">'+pl+'</span></div>';
        }
        html+='</div>';
    }
    container.innerHTML=html;
});
</script>
</body>
</html>
