<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production & Sales Analytics · Soma</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body.an-page { background:var(--bg); }
.an-wrap { max-width:1040px; margin:0 auto; padding:24px 16px 60px; }
.tab-bar { display:flex; gap:0; background:var(--white); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:20px; }
.tab-btn { flex:1; padding:13px 16px; font-size:13px; font-weight:600; border:none; background:none; cursor:pointer; color:var(--text-light); border-bottom:3px solid transparent; transition:all .15s; }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); background:#f9faf7; }
.tab-pane { display:none; }
.tab-pane.active { display:block; }
.period-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.period-label { font-size:14px; font-weight:600; color:var(--text); }
.period-toggle { display:inline-flex; }
.period-btn { padding:8px 20px; border:1px solid var(--border); font-size:13px; font-weight:600; background:var(--card-bg); cursor:pointer; color:var(--text); border-radius:0; margin-left:-1px; transition:all .15s; }
.period-toggle .period-btn:first-child { border-radius:6px 0 0 6px; margin-left:0; }
.period-toggle .period-btn:last-child { border-radius:0 6px 6px 0; }
.period-btn.active { background:var(--accent); color:var(--white); border-color:var(--accent); position:relative; z-index:1; }
.buyer-filter { padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; outline:none; }
.buyer-filter:focus { border-color:var(--accent); }
.buyer-card { background:var(--white); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden; cursor:pointer; transition:box-shadow .15s; }
.buyer-card:hover { box-shadow:0 2px 12px rgba(0,0,0,.08); border-color:var(--accent); }
.buyer-card-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; gap:12px; flex-wrap:wrap; }
.bc-name { font-size:16px; font-weight:700; color:var(--dark); margin-bottom:4px; }
.bc-hint { font-size:11px; color:var(--text-light); }
.bc-locs { margin-top:2px; }
.bc-loc { font-size:11px; color:var(--text-light); line-height:1.55; }
.bc-stats { display:flex; gap:20px; flex-wrap:wrap; }
.bc-stat { text-align:right; }
.bc-stat-n { font-size:16px; font-weight:700; color:var(--dark); }
.bc-stat-l { font-size:10px; font-weight:600; color:var(--text-light); text-transform:uppercase; letter-spacing:.05em; }
.bc-arrow { font-size:18px; color:var(--text-light); flex-shrink:0; }
.rev-bar-wrap { height:4px; background:#f0f0eb; border-radius:2px; margin-top:8px; width:140px; max-width:100%; }
.rev-bar-fill { height:4px; background:var(--accent); border-radius:2px; }
.empty-state { text-align:center; padding:48px 24px; color:var(--text-light); font-size:14px; border:2px dashed var(--border); border-radius:12px; background:var(--white); }
.loading { text-align:center; padding:32px; color:var(--text-light); }
.tracker-frame { width:100%; height:80vh; border:none; border-radius:10px; background:var(--white); }
</style>
</head>
<body class="an-page inv-page">
<div class="header">
  <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
  <div class="header-text"><h1 id="an-title">Sales by Buyer</h1><p id="an-sub">Revenue by buyer</p></div>
  <div class="header-right" style="display:flex;align-items:center;gap:8px;">
    <div class="nav-arrows">
      <button class="nav-arrow-btn" id="nav-back" title="Back">&#8592;</button>
      <button class="nav-arrow-btn" id="nav-fwd" title="Forward">&#8594;</button>
    </div>
    <a href="/" class="header-btn">⌂ Dashboard</a>
  </div>
</div>

<div class="an-wrap">
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('sales')">Sales by Buyer</button>
    <button class="tab-btn" onclick="showTab('production')">Production Tracker</button>
  </div>

  <!-- Sales by Buyer -->
  <div class="tab-pane active" id="tab-sales">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <div style="font-size:12px;color:var(--text-light);">Click any buyer for detailed analytics. Revenue requires prices set in buyer catalogue.</div>
      <button id="backfill-btn" onclick="runBackfill()" class="btn btn-sm" style="font-size:11px;">🔄 Backfill missing prices</button>
    </div>
    <div class="period-row">
      <div class="period-label">Period:</div>
      <div class="period-toggle">
        <button class="period-btn active" onclick="setPeriod('all',this)">All time</button>
        <button class="period-btn" onclick="setPeriod('ytd',this)">YTD</button>
        <button class="period-btn" onclick="setPeriod('90d',this)">90 days</button>
        <button class="period-btn" onclick="setPeriod('30d',this)">30 days</button>
      </div>
      <select class="buyer-filter" id="buyer-filter" onchange="loadSales()">
        <option value="">All buyers</option>
        {% for name in buyer_names %}
        <option value="{{ name|e }}">{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div id="sales-list"><div class="loading">Loading…</div></div>
  </div>

  <!-- Production Tracker -->
  <div class="tab-pane" id="tab-production">
    <iframe id="tracker-frame" src="" style="width:100%;height:80vh;border:none;border-radius:10px;background:var(--white);" title="Production Tracker"></iframe>
  </div>
</div>

<script>
var _period = 'all';

var TAB_HEADERS = {
  sales:      ['Sales by Buyer', 'Revenue by buyer'],
  production: ['Production Tracker', 'Output overview'],
};

function showTab(id) {
  document.querySelectorAll('.tab-btn').forEach(function(b,i){
    b.classList.toggle('active', ['sales','production'][i] === id);
  });
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-'+id).classList.add('active');
  // Retitle the single page header to the active tab, so each tab keeps a dark
  // header above its numbers without a stacked duplicate.
  var hdr = TAB_HEADERS[id];
  if (hdr) {
    document.getElementById('an-title').textContent = hdr[0];
    document.getElementById('an-sub').textContent = hdr[1];
  }
  if (id === 'production') {
    var frame = document.getElementById('tracker-frame');
    if (frame && !frame.src.includes('production-tracker')) frame.src = '/production-tracker?embed=1';
  }
}

function setPeriod(p, btn) {
  _period = p;
  document.querySelectorAll('.period-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  loadSales();
}

async function loadSales() {
  var buyer = document.getElementById('buyer-filter').value;
  var url = '/api/analytics/sales-by-buyer?period='+_period+(buyer?'&buyer='+encodeURIComponent(buyer):'');
  document.getElementById('sales-list').innerHTML = '<div class="loading">Loading…</div>';
  try {
    var res = await fetch(url);
    var data = await res.json();
    renderSales(data.buyers || []);
  } catch(e) {
    document.getElementById('sales-list').innerHTML = '<div class="empty-state">Could not load sales data: ' + e.message + '</div>';
  }
}

function fmt$(n) { return '$'+(+n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function fmtN(n) { return (+n).toLocaleString(); }

function renderSales(buyers) {
  if (!buyers.length) {
    document.getElementById('sales-list').innerHTML = '<div class="empty-state">No sales recorded yet for this period.</div>';
    return;
  }
  var maxRev = Math.max.apply(null, buyers.map(function(b){ return b.revenue; })) || 1;
  var html = buyers.map(function(b) {
    var pct = Math.round((b.revenue / maxRev) * 100);
    var locs = (b.locations || []);
    var locHtml = locs.length
      ? '<div class="bc-locs">' + locs.map(function(l){ return '<div class="bc-loc">'+e(l)+'</div>'; }).join('') + '</div>'
      : '';
    // encodeURIComponent does NOT escape apostrophes (they're unreserved), so
    // a buyer like "Nature's Emporium" would break the single-quoted JS string
    // in the inline onclick. Replace ' with %27 so the URL is valid both as a
    // URL component and inside the JS attribute.
    var safeUrl = encodeURIComponent(b.buyer).replace(/'/g, '%27');
    return '<div class="buyer-card" onclick="window.location=\'/analytics/buyer/'+safeUrl+'\'">'
      + '<div class="buyer-card-head">'
      + '<div style="flex:1;min-width:0;">'
      + '<div class="bc-name">'+e(b.buyer)+'</div>'
      + locHtml
      + '<div class="rev-bar-wrap"><div class="rev-bar-fill" style="width:'+pct+'%"></div></div>'
      + '</div>'
      + '<div class="bc-stats">'
      + '<div class="bc-stat"><div class="bc-stat-n">'+fmt$(b.revenue)+'</div><div class="bc-stat-l">Revenue</div></div>'
      + '<div class="bc-stat"><div class="bc-stat-n">'+fmtN(b.cases)+'</div><div class="bc-stat-l">Cases</div></div>'
      + '<div class="bc-stat"><div class="bc-stat-n">'+fmtN(b.orders)+'</div><div class="bc-stat-l">Orders</div></div>'
      + '</div>'
      + '<div class="bc-arrow">›</div>'
      + '</div>'
      + '</div>';
  }).join('');
  document.getElementById('sales-list').innerHTML = html;
}

async function runBackfill() {
  var btn = document.getElementById('backfill-btn');
  if (!confirm('Fill in missing prices on historical sale records using current buyer catalogue prices. Continue?')) return;
  btn.disabled = true; btn.textContent = '🔄 Running…';
  try {
    var res = await fetch('/api/analytics/backfill-sale-prices', {method:'POST'});
    var data = await res.json();
    alert(data.message || 'Done');
    loadSales();
  } catch(e) { alert('Error: ' + e.message); }
  btn.disabled = false; btn.textContent = '🔄 Backfill missing prices';
}

function e(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Nav arrows
(function(){
  var back = document.getElementById('nav-back');
  var fwd  = document.getElementById('nav-fwd');
  if(back) { back.disabled = window.history.length <= 1; back.onclick = function(){ window.history.back(); }; }
  if(fwd)  fwd.onclick = function(){ window.history.forward(); };
})();

// Deep-link: open the tab named in ?tab= (sales | production); defaults to sales.
(function(){
  var t = new URLSearchParams(window.location.search).get('tab');
  if (t === 'production') showTab('production');
})();

loadSales();
</script>
</body>
</html>
