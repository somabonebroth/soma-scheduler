<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Soma - Sales &amp; Receiving Record</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* ── Sales & Receiving Record ──────────────────────────────────────
   Page layout + the table/card polish this page shares with Manage
   Inventory (organic.html). Scoped via body.inv-page like that page.
   ──────────────────────────────────────────────────────────────── */
body.inv-page { background: var(--bg); }

/* Cards: more breathing room, subtle title underline */
body.inv-page .card { padding: 28px; margin-bottom: 20px; }
body.inv-page .card h2 {
    font-size: 18px; font-weight: 600; color: var(--dark);
    padding-bottom: 12px; margin-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
body.inv-page .card h2 .count-badge {
    font-size: 12px; font-weight: 500; color: var(--text-light);
    background: var(--row-alt); padding: 3px 10px; border-radius: 10px;
}
body.inv-page .card > p { font-size: 12px; line-height: 1.5; color: var(--text-light); margin-bottom: 14px; }
.range-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
             background: var(--card-bg); border: 1px solid var(--border);
             border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
.range-label { font-size: 12px; color: var(--text-light); }
.range-presets { display: inline-flex; }
.range-btn { padding: 6px 14px; border: 1px solid var(--border); background: var(--white);
             font-size: 12px; font-weight: 600; color: var(--text); cursor: pointer;
             margin-left: -1px; }
.range-presets .range-btn:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.range-presets .range-btn:last-child { border-radius: 0 6px 6px 0; }
.range-btn.active { background: var(--accent); color: var(--white); border-color: var(--accent); position: relative; z-index: 1; }
.range-bar input[type=date] { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
.btn-tiny { padding: 6px 12px; font-size: 12px; }
.range-note { font-size: 11px; color: var(--text-light); margin-left: auto; }

body.inv-page .form-field label {
    display: block; font-size: 11px; font-weight: 600;
    color: var(--text-light); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.3px;
}
body.inv-page .form-field input,
body.inv-page .form-field select {
    width: 100%; padding: 11px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; min-height: 44px;
    background: var(--white);
    transition: border-color 0.15s, box-shadow 0.15s;
}
body.inv-page .form-field input:focus,
body.inv-page .form-field select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(74,103,65,0.1);
}

/* Buttons — bigger tap targets, clearer hierarchy */
body.inv-page .btn {
    padding: 12px 22px; font-size: 14px;
    min-height: 44px; min-width: 44px;
    transition: all 0.15s;
}
body.inv-page .btn-primary {
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
body.inv-page .btn-primary:hover {
    box-shadow: 0 2px 6px rgba(74,103,65,0.25);
    transform: translateY(-1px);
}

body.inv-page .btn + .btn,
body.inv-page .btn + .btn-baseline,
body.inv-page .btn + .btn-outline,
body.inv-page .btn-baseline + .btn-outline,
body.inv-page .btn-outline + .btn-baseline {
    margin-left: 10px;
}

/* Tables — more vertical room per row */
/* Tables — more vertical room per row */
body.inv-page .inv-table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    /* Hint that there's content to the right on narrow viewports */
    background:
        linear-gradient(to right, white 30%, rgba(255,255,255,0)) left center,
        linear-gradient(to right, rgba(255,255,255,0), white 70%) right center,
        linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0)) left center,
        linear-gradient(to left, rgba(0,0,0,0.08), rgba(0,0,0,0)) right center;
    background-repeat: no-repeat;
    background-size: 24px 100%, 24px 100%, 12px 100%, 12px 100%;
    background-attachment: local, local, scroll, scroll;
}
body.inv-page .inv-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
body.inv-page .inv-table th {
    background: var(--dark); color: var(--white);
    padding: 12px 14px; text-align: left;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.3px;
}
body.inv-page .inv-table th:first-child { border-radius: 6px 0 0 0; }
body.inv-page .inv-table th:last-child { border-radius: 0 6px 0 0; }
body.inv-page .inv-table td {
    padding: 13px 14px; border-bottom: 1px solid var(--border); vertical-align: middle;
}
body.inv-page .inv-table tr:nth-child(even) { background: var(--row-alt); }
body.inv-page .inv-table tr:hover { background: #f5f7f0; }
body.inv-page .inv-table .negative { color: var(--danger); font-weight: 700; }
body.inv-page .inv-table .low { color: #e67e22; font-weight: 600; }

/* In-table action buttons — clearer visual differences */
body.inv-page .btn-sm {
    background: var(--white); border: 1px solid var(--border);
    padding: 7px 12px; font-size: 12px;
    min-height: 36px; border-radius: 5px;
    color: var(--text); cursor: pointer;
    font-weight: 500; transition: all 0.15s;
}
body.inv-page .btn-sm:hover { background: var(--row-alt); border-color: #b8b8a8; }

/* Search bar */
.search-bar { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; align-items: flex-end; }
.search-bar select, .search-bar input { padding: 11px 13px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; min-height: 44px; }
.search-bar input { flex: 1; min-width: 180px; }
.trace-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 14px; }
.trace-section h3 { font-size: 14px; margin-bottom: 10px; color: var(--dark); }

/* Empty states — more breathing room */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); font-size: 14px; line-height: 1.6; }

@media (max-width: 768px) {
    body.inv-page .card { padding: 16px; margin-bottom: 14px; }
    body.inv-page .card h2 { font-size: 15px; padding-bottom: 10px; margin-bottom: 12px; }
    body.inv-page .card > p { font-size: 12px; margin-bottom: 10px; }
    body.inv-page .btn { padding: 12px 16px; font-size: 13px; }
    body.inv-page .inv-table { font-size: 12px; }
    body.inv-page .inv-table th { padding: 10px 10px; font-size: 10px; }
    body.inv-page .inv-table td { padding: 10px 10px; }
    .modal-overlay { align-items: flex-end; }
    .modal {
        width: 100% !important;
        max-width: 100% !important;
        border-radius: 16px 16px 0 0;
        max-height: 92vh;
        padding: 20px 16px 28px;
    }
    body.inv-page .modal-actions { flex-direction: column-reverse; gap: 10px; }
    body.inv-page .modal-actions button,
    body.inv-page .modal-actions .btn { width: 100%; min-height: 48px; justify-content: center; box-sizing: border-box; text-align: center; }
}
@media (max-width: 390px) {
    body.inv-page .card { padding: 12px; }
    body.inv-page .card h2 { font-size: 14px; }
}
.sr-order { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
.sr-order summary { padding: 10px 14px; background: #f9f9f7; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sr-order summary::-webkit-details-marker { display: none; }
.sr-who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; font-size: 13px; }
.sr-who span { font-size: 11px; color: var(--text-light); }
.sr-num { font-size: 12px; color: var(--dark); font-weight: 600; white-space: nowrap; }
.sr-body { padding: 8px 14px 12px; }
.sr-slip { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
.sr-del { font-size: 11px; color: var(--text-light); }
.sr-del:hover { color: var(--danger); }
.inv-table td.r, .inv-table th.r { text-align: right; }
#trace-results a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body class="inv-page">
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Sales &amp; Receiving Record</h1><p>Soma Bone Broth</p></div>
    <div class="header-right" style="display:flex;align-items:center;gap:8px;">
    <div class="nav-arrows"><button class="nav-arrow-btn" id="nav-back" title="Back">&#8592;</button><button class="nav-arrow-btn" id="nav-fwd" title="Forward">&#8594;</button></div>
    <a href="/" class="header-btn">⌂ Dashboard</a>
  </div>
</div>
<div class="main">
    <!-- Search & Trace — top -->
    <div class="card" id="trace">
        <h2>Search &amp; Trace</h2>
        <div class="search-bar" style="margin-bottom:0;position:relative;">
            <input id="trace-query" type="search" placeholder="Supplier, buyer, product, LOT# or date — all records" style="flex:1;" oninput="doTraceDebounced()">
        </div>
        <div id="trace-results" style="margin-top:12px;"></div>
    </div>

    <!-- Receiving Transactions -->
    <div class="range-bar">
        <span class="range-label">Showing</span>
        <div class="range-presets">
            <button class="range-btn" data-days="30">30 days</button>
            <button class="range-btn active" data-days="90">90 days</button>
            <button class="range-btn" data-days="365">1 year</button>
            <button class="range-btn" data-days="all">All time</button>
        </div>
        <button class="range-btn" id="range-custom-btn" type="button">Custom…</button>
        <span id="range-custom" style="display:none;align-items:center;gap:6px;">
            <input type="date" id="range-from" aria-label="From date">
            <span class="range-label">to</span>
            <input type="date" id="range-to" aria-label="To date">
        </span>
    </div>

    <div class="card" id="receiving">
        <h2>Receiving <span class="count-badge" id="receiving-count">—</span></h2>
        <div id="receiving-container"><div class="empty-state">Loading...</div></div>
    </div>

    <!-- Sales Transactions -->
    <div class="card" id="sales">
        <h2>Sales <span class="count-badge" id="sales-count">—</span></h2>
        <div id="sales-container"><div class="empty-state">Loading...</div></div>

</div>

<!-- Generic confirm dialog — replaces native confirm() for mobile-friendly UX -->
<div class="modal-overlay" id="confirm-modal">
    <div class="modal" style="max-width:440px;">
        <h2 id="confirm-title" style="margin-bottom:10px;">Confirm</h2>
        <p id="confirm-message" style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:18px;"></p>
        <div class="modal-actions">
            <button class="btn btn-outline" id="confirm-cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="confirm-ok-btn">Confirm</button>
        </div>
    </div>
</div>


<script>
// ── Shared helpers (verbatim copies of the ones in organic.html) ──
function escSku(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escHtml(s){return escSku(s);}

function mobileConfirm(message, opts){
    opts = opts || {};
    return new Promise(function(resolve){
        var modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-title').textContent = opts.title || 'Confirm';
        document.getElementById('confirm-message').textContent = message;
        var okBtn = document.getElementById('confirm-ok-btn');
        var cancelBtn = document.getElementById('confirm-cancel-btn');
        okBtn.textContent = opts.okLabel || 'Confirm';
        cancelBtn.textContent = opts.cancelLabel || 'Cancel';
        // Danger styling: orange/red OK button
        if(opts.danger){
            okBtn.style.background = '#c62828';
            okBtn.style.borderColor = '#c62828';
        } else {
            okBtn.style.background = '';
            okBtn.style.borderColor = '';
        }
        function cleanup(result){
            modal.classList.remove('active');
            okBtn.onclick = null;
            cancelBtn.onclick = null;
            modal.onclick = null;
            resolve(result);
        }
        okBtn.onclick = function(){ cleanup(true); };
        cancelBtn.onclick = function(){ cleanup(false); };
        // Click outside the modal also cancels
        modal.onclick = function(e){ if(e.target === modal) cleanup(false); };
        modal.classList.add('active');
    });
}

// ── Timeline grouping helper ──────────────────────────────────────────
function _timelineGroup(items, dateKey){
    // Groups items by: last 2 weeks (daily), then monthly blocks
    var now = new Date();
    var twoWeeksAgo = new Date(now - 14 * 24 * 60 * 60 * 1000);
    var recent = [], older = {};
    items.forEach(function(item){
        var d = new Date(item[dateKey] || item.created_at || '1970-01-01');
        if(d >= twoWeeksAgo){
            recent.push(item);
        } else {
            var monthKey = (item[dateKey]||'').substring(0,7); // YYYY-MM
            if(!older[monthKey]) older[monthKey] = [];
            older[monthKey].push(item);
        }
    });
    return {recent: recent, older: older};
}

function _monthLabel(yyyymm){
    if(!yyyymm) return 'Earlier';
    var parts = yyyymm.split('-');
    var d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, 1);
    return d.toLocaleDateString('en-CA', {year:'numeric', month:'long'});
}

// Group transactions into collapsible month sections. `txs` must be sorted
// newest-first; each tx needs a .date (YYYY-MM-DD). `renderGroup(txArray)`
// returns the HTML for one month's transactions; `countLabel(n)` returns the
// summary count text (e.g. "12 sales"). The newest month opens by default;
// pass openAll=true to expand every month (used for action buckets).
function renderMonthGroups(txs, renderGroup, countLabel, openAll){
    var byMonth={}, monthOrder=[];
    txs.forEach(function(tx){
        var mk=(tx.date||'').substring(0,7);
        if(!byMonth[mk]){ byMonth[mk]=[]; monthOrder.push(mk); }
        byMonth[mk].push(tx);
    });
    monthOrder.sort().reverse();
    var html='';
    monthOrder.forEach(function(mk, i){
        var group=byMonth[mk];
        var open=(openAll || i===0)?' open':'';
        html+='<details'+open+' style="margin-top:6px;border:1px solid var(--border);border-radius:8px;overflow:hidden;">'
            +'<summary style="padding:10px 14px;background:#f5f5f0;cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;">'
            +'<span>'+_monthLabel(mk)+'</span><span style="color:var(--text-light);font-weight:400;">'+countLabel(group.length)+'</span></summary>'
            +'<div style="padding:6px 8px;">'+renderGroup(group)+'</div></details>';
    });
    return html;
}
function _salesCount(n){ return n+' order'+(n===1?'':'s'); }
function _deliveriesCount(n){ return n+' deliver'+(n===1?'y':'ies'); }

async function loadSales(){
    var res=await fetch('/api/organic/sales'+rangeQuery());
    var data=await res.json();
    var container=document.getElementById('sales-container');
    var countEl=document.getElementById('sales-count');

    var scheduled=data.filter(function(s){return s.deducted===false;});
    var pendingPmt=data.filter(function(s){return s.payment_pending===true && s.deducted!==false;});
    var settled=data.filter(function(s){return s.deducted!==false && !s.payment_pending;});

    function saleValue(s){
        if(s.line_total!=null) return +s.line_total||0;
        return (s.quantity||0)*(+(s.unit_price||s.price)||0);
    }
    function money(v){ return '$'+Math.round(v).toLocaleString(); }
    // Quantities read in cases, loose jars after (a case is 12 jars).
    function cases(n){ n=n||0; var c=Math.floor(n/12), j=n%12; return (c?c+' cs':'')+(c&&j?' + ':'')+(j?j+' jar'+(j===1?'':'s'):'')||'0'; }

    if(countEl){
        var su=settled.reduce(function(a,s){return a+(s.quantity||0);},0);
        var sv=settled.reduce(function(a,s){return a+saleValue(s);},0);
        var orders=groupSales(settled).length;
        countEl.textContent=orders+' order'+(orders===1?'':'s')+' · '+Math.floor(su/12).toLocaleString()+' cases · '+money(sv);
    }

    function fmtProd(s){ return escSku(s.recipe+(s.format?' · '+s.format:'')); }
    function fmtLots(s){ return escSku((s.lots&&s.lots.length)?s.lots.map(function(l){return l.lot;}).filter(Boolean).join(', '):(s.fg_lot||'—')); }

    function groupSales(rows){
        var txMap={},txOrder=[];
        rows.forEach(function(s){
            // New records: group by order_id (set at record time, guaranteed unique per transaction)
            // Legacy records: fall back to date+buyer heuristic but append sale id to prevent
            //   false merging of two different same-day same-buyer transactions
            var key;
            if(s.order_id){
                key='ord:'+s.order_id;
            } else if(s.ripe_order_id){
                key='ripe:'+s.ripe_order_id;
            } else {
                // Legacy: use id to keep each record as its own transaction
                key='legacy:'+s.id;
            }
            if(!txMap[key]){
                txMap[key]={
                    date:s.sale_date||'',
                    buyer:s.buyer||'',
                    order_id:s.order_id||s.ripe_order_id||s.po_number||'',
                    items:[],ids:[]
                };
                txOrder.push(key);
            }
            txMap[key].items.push(s); txMap[key].ids.push(s.id);
        });
        return txOrder.map(function(k){return txMap[k];});
    }

    function renderScheduled(txs){
        return txs.map(function(tx){
            var u=tx.items.reduce(function(a,s){return a+(s.quantity||0);},0);
            var h='<details style="border:1px solid #ffe082;border-radius:8px;overflow:hidden;margin-bottom:6px;">';
            h+='<summary style="padding:10px 14px;background:#fffde7;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;">';
            h+='<span style="display:flex;align-items:center;gap:8px;flex:1;">';
            h+='<span style="font-size:13px;font-weight:600;">'+escHtml(tx.buyer)+'</span>';
            h+='<span style="font-size:11px;color:#f57f17;">▶ deducts '+escHtml(tx.date)+'</span>';
            if(tx.order_id) h+='<span style="font-size:10px;background:#fff3e0;color:#e65100;padding:1px 6px;border-radius:10px;">'+escHtml(tx.order_id)+'</span>';
            h+='</span><span style="font-size:11px;color:#f57f17;white-space:nowrap;">'+u+' units</span></summary>';
            h+='<div style="padding:8px 14px 12px;"><table class="inv-table" style="font-size:12px;"><tr><th>Product</th><th>Qty</th><th>Shortfall</th></tr>';
            tx.items.forEach(function(s){
                var sf=s.shortfall?'<span style="color:#c62828;font-weight:600;">−'+s.shortfall+' units</span>':'—';
                h+='<tr><td>'+fmtProd(s)+'</td><td>'+s.quantity+'</td><td>'+sf+'</td></tr>';
            });
            h+='</table></div></details>';
            return h;
        }).join('');
    }

    function renderPending(txs){
        return txs.map(function(tx){
            var u=tx.items.reduce(function(a,s){return a+(s.quantity||0);},0);
            var h='<details style="border:1px solid #9fa8da;border-radius:8px;overflow:hidden;margin-bottom:6px;">';
            h+='<summary style="padding:10px 14px;background:#e8eaf6;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;">';
            h+='<span style="display:flex;align-items:center;gap:8px;flex:1;">';
            h+='<span style="font-size:13px;font-weight:600;">'+escHtml(tx.buyer)+'</span>';
            h+='<span style="font-size:11px;color:#3949ab;">'+escHtml(tx.date)+'</span>';
            if(tx.order_id) h+='<span style="font-size:10px;background:#e8eaf6;color:#3949ab;padding:1px 6px;border-radius:10px;">'+escHtml(tx.order_id)+'</span>';
            h+='</span>';
            h+='<span style="display:flex;align-items:center;gap:8px;">';
            h+='<button class="btn-sm" style="font-size:11px;color:#3949ab;border-color:#9fa8da;" data-settle-ids="'+escHtml(tx.ids.join(','))+'">Mark Paid</button>';
            h+='<span style="font-size:11px;color:#3949ab;white-space:nowrap;">'+u+' units</span></span></summary>';
            h+='<div style="padding:8px 14px 12px;"><table class="inv-table" style="font-size:12px;"><tr><th>Product</th><th>LOT#(s)</th><th>Qty</th></tr>';
            tx.items.forEach(function(s){
                h+='<tr><td>'+fmtProd(s)+'</td><td>'+fmtLots(s)+'</td><td>'+s.quantity+'</td></tr>';
            });
            h+='</table></div></details>';
            return h;
        }).join('');
    }

    function renderSettled(txs){
        return txs.map(function(tx){
            var u=tx.items.reduce(function(a,s){return a+(s.quantity||0);},0);
            var v=tx.items.reduce(function(a,s){return a+saleValue(s);},0);
            var po=(tx.items.find(function(s){return s.po_number;})||{}).po_number;
            var h='<details class="sr-order">';
            h+='<summary><span class="sr-who"><b>'+escHtml(tx.buyer)+'</b><span>'+escHtml(tx.date)+(po?' · PO '+escHtml(po):'')+'</span></span>';
            h+='<span class="sr-num">'+cases(u)+(v?' · '+money(v):'')+'</span></summary>';
            h+='<div class="sr-body"><a href="/sales/'+encodeURIComponent(tx.items[0].id)+'/packing-slip" target="_blank" class="sr-slip">Packing slip</a>';
            h+='<table class="inv-table" style="font-size:12px;"><tr><th>Product</th><th>LOT#</th><th class="r">Qty</th><th></th></tr>';
            tx.items.forEach(function(s){
                h+='<tr><td>'+fmtProd(s)+'</td><td>'+fmtLots(s)+'</td><td class="r">'+cases(s.quantity)+'</td>'
                  +'<td class="r"><a href="#" class="sr-del" data-del-sale="'+escHtml(s.id)+'">Delete</a></td></tr>';
            });
            h+='</table></div></details>';
            return h;
        }).join('');
    }

    if(!data.length){ container.innerHTML='<div class="empty-state">No sales recorded yet.</div>'; return; }

    var html='';

    function byDateDesc(a,b){ return (b.date||'').localeCompare(a.date||''); }

    if(scheduled.length){
        var schedTxs=groupSales(scheduled).sort(byDateDesc);
        html+='<div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:14px;margin-bottom:12px;">'
            +'<div style="font-size:11px;font-weight:700;color:#f57f17;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">'
            +'📅 Scheduled — Inventory Reserved</div>'
            +renderMonthGroups(schedTxs, renderScheduled, _salesCount, true)+'</div>';
    }

    if(pendingPmt.length){
        var pendTxs=groupSales(pendingPmt).sort(byDateDesc);
        html+='<div style="background:#e8eaf6;border:1px solid #9fa8da;border-radius:8px;padding:14px;margin-bottom:12px;">'
            +'<div style="font-size:11px;font-weight:700;color:#3949ab;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">'
            +'⏳ Pending Payment (Net 14)</div>'
            +renderMonthGroups(pendTxs, renderPending, _salesCount, true)+'</div>';
    }

    if(settled.length){
        var settledTxs=groupSales(settled).sort(byDateDesc);
        html+=renderMonthGroups(settledTxs, renderSettled, _salesCount);
    } else if(!scheduled.length && !pendingPmt.length){
        html+='<div class="empty-state">No settled sales yet.</div>';
    }

    container.innerHTML=html;
    container.querySelectorAll('[data-del-sale]').forEach(function(btn){
        btn.addEventListener('click',function(e){e.preventDefault();deleteSale(this.getAttribute('data-del-sale'));});
    });
    container.querySelectorAll('[data-settle-ids]').forEach(function(btn){
        btn.addEventListener('click',function(e){
            e.stopPropagation();
            manualSettleAll(this.getAttribute('data-settle-ids').split(',').filter(Boolean));
        });
    });
}

async function manualSettleAll(ids){
    if(!confirm('Mark this Net 14 order as paid? All line items move to settled transactions.')) return;
    var ok=true;
    for(var i=0;i<ids.length;i++){
        var r=await fetch('/api/ripe-orders/settle-sale/'+ids[i],{method:'POST'});
        if(!r.ok) ok=false;
    }
    loadSales();
    if(!ok) alert('Some items could not be settled.');
}


async function deleteSale(id){
    var ok = await mobileConfirm('Delete this sale? Quantity will be restored to finished goods.',
        {title:'Delete sale', okLabel:'Delete', danger:true});
    if(!ok) return;
    await fetch('/api/organic/sales/'+id,{method:'DELETE'});
    loadSales();
}

// ── Search & Trace (unified, debounced) ──
var _traceDebounceTimer = null;
function doTraceDebounced(){
    clearTimeout(_traceDebounceTimer);
    _traceDebounceTimer = setTimeout(doTrace, 350);
}

// Trace results are links (2026-10-01): an organic LOT# opens its Organic Lots
// folder, a sale its packing slip, a delivery line its invoice.
var photoIdsAll = new Set();
function trProd(x){ return escHtml((x.recipe||'')+(x.format?' · '+x.format:'')); }
function trLot(f){
    var lot=escHtml(f.lot||'');
    return /organic/i.test(f.certification||'') && f.lot
        ? '<a href="/organic-lots#'+encodeURIComponent(f.lot)+'">LOT# '+lot+' &rarr;</a>'
        : 'LOT# '+lot;
}
async function doTrace(){
    var q=document.getElementById('trace-query').value.trim();
    var container=document.getElementById('trace-results');
    if(!q){container.innerHTML='';return;}
    container.innerHTML='<div class="empty-state">Searching…</div>';
    // Search both raw LOT and FG LOT + text fields
    var [rawRes, fgRes, rmRes, salesRes] = await Promise.all([
        fetch('/api/organic/trace?type=raw_lot&q='+encodeURIComponent(q)),
        fetch('/api/organic/trace?type=fg_lot&q='+encodeURIComponent(q)),
        fetch('/api/organic/raw-materials'),
        fetch('/api/organic/sales'),
    ]);
    var rawData = await rawRes.json();
    var fgData = await fgRes.json();
    var allRM = await rmRes.json();
    var allSales = await salesRes.json();
    var ql = q.toLowerCase();

    // Text-match receiving entries (supplier, item, lot#, date)
    var matchedRM = allRM.filter(function(r){
        return (r.item||'').toLowerCase().includes(ql)
            || (r.supplier||'').toLowerCase().includes(ql)
            || (r.supplier_lot||'').toLowerCase().includes(ql)
            || (r.date_received||'').includes(ql);
    });
    // Text-match sales (buyer, recipe, lot, date)
    var matchedSales = allSales.filter(function(s){
        return (s.buyer||'').toLowerCase().includes(ql)
            || (s.recipe||'').toLowerCase().includes(ql)
            || (s.brand||'').toLowerCase().includes(ql)
            || (s.fg_lot||'').toLowerCase().includes(ql)
            || (s.sale_date||'').includes(ql)
            || ((s.lots||[]).some(function(l){ return (l.lot||'').toLowerCase().includes(ql); }));
    });

    var html = '';

    // LOT trace results
    var rawLots = (rawData.lots) || [];
    var hasRawTrace = rawLots.length > 0;
    var hasFGTrace = fgData.finished_goods && fgData.finished_goods.length;
    if(hasRawTrace || hasFGTrace){
        html += '<div style="background:#f0f7f0;border:1px solid #a5d6a7;border-radius:8px;padding:14px 16px;margin-bottom:14px;">';
        html += '<div style="font-size:12px;font-weight:600;color:#2e7d32;margin-bottom:8px;">&#128270; LOT# Trace Results for &ldquo;'+escHtml(q)+'&rdquo;</div>';
        if(hasRawTrace){
            // One block per physical lot entry — distinct lots that happen to share
            // a lot number (e.g. day-zero baseline) are shown separately, never merged.
            rawLots.forEach(function(L){
                var hdr = escHtml(L.item||'(unknown)');
                if(L.supplier) hdr += ' · '+escHtml(L.supplier);
                if(L.date_received) hdr += ' · recv '+escHtml(L.date_received);
                hdr += ' · LOT# '+escHtml(L.supplier_lot||q);
                html += '<div style="margin:6px 0;padding:6px 0;border-top:1px solid #d6ead6;">';
                html += '<div style="font-size:12px;font-weight:600;">'+hdr+'</div>';
                if(!L.raw_material_id){
                    html += '<div style="font-size:11px;color:#b26a00;">⚠ This lot is no longer in current inventory; shown from production history.</div>';
                }
                (L.runs||[]).forEach(function(r){
                    html += '<div style="font-size:13px;padding:2px 0 2px 10px;">→ Used in: '+escHtml(r.day_name||'')+' '+escHtml(r.week_id||'')+' · '+escHtml(r.vessel||'')+' · '+escHtml((r.brand?r.brand+'-':'')+r.recipe)+' (Batch LOT# '+escHtml(r.lot||'')+')</div>';
                });
                (L.finished_goods||[]).forEach(function(f){
                    html += '<div style="font-size:13px;padding:2px 0 2px 20px;color:#2e7d32;">↳ Produced: '+trProd(f)+' · '+trLot(f)+'</div>';
                });
                (L.sales||[]).forEach(function(s){
                    var prod=(s.brand?s.brand+' ':'')+s.recipe+(s.format?' '+s.format:'');
                    html += '<div style="font-size:13px;padding:2px 0 2px 30px;color:#555;">↳ Sold: '+escHtml(prod.trim())+' → '+escHtml(s.buyer||'')+' ('+escHtml(s.sale_date||'')+')</div>';
                });
                if(!(L.runs||[]).length){
                    html += '<div style="font-size:12px;color:var(--text-light);padding:2px 0 2px 10px;">Not yet used in any completed production.</div>';
                }
                html += '</div>';
            });
        }
        if(hasFGTrace){
            fgData.finished_goods.forEach(function(f){
                html += '<div style="font-size:13px;padding:4px 0;">'+trProd(f)+' · '+trLot(f)+'</div>';
            });
        }
        html += '</div>';
    }

    // Receiving matches
    if(matchedRM.length){
        html += '<div style="margin-bottom:14px;"><div style="font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;">Receiving Matches</div>';
        html += '<div class="inv-table-wrap"><table class="inv-table"><tr><th>Date</th><th>Ingredient</th><th>Supplier</th><th>LOT#</th><th>Qty</th><th></th></tr>';
        matchedRM.slice(0,20).forEach(function(r){
            html += '<tr><td>'+(r.date_received||'')+'</td><td>'+escHtml(r.item||'')+'</td><td>'+escHtml(r.supplier||'')+'</td><td>'+escHtml(r.supplier_lot||'')+'</td><td>'+(r.remaining!==undefined?r.remaining:r.quantity)+' '+escHtml(r.unit||'')+'</td>'
                +'<td>'+(photoIdsAll.has(r.delivery_id)||photoIdsAll.has(r.id)?'<a href="/api/organic/raw-materials/receipt-photo/'+encodeURIComponent(r.id)+'" target="_blank">Invoice</a>':'')+'</td></tr>';
        });
        html += '</table></div></div>';
    }

    // Sales matches
    if(matchedSales.length){
        html += '<div><div style="font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;">Sales Matches</div>';
        html += '<div class="inv-table-wrap"><table class="inv-table"><tr><th>Date</th><th>Product</th><th>Buyer</th><th>LOT#</th><th>Qty</th><th></th></tr>';
        matchedSales.slice(0,20).forEach(function(s){
            var lots=(s.lots||[]).map(function(l){return l.lot;}).filter(Boolean).join(', ')||s.fg_lot||'';
            html += '<tr><td>'+(s.sale_date||'')+'</td><td>'+trProd(s)+'</td><td>'+escHtml(s.buyer||'')+'</td><td>'+escHtml(lots)+'</td><td>'+(s.quantity||'')+'</td>'
                +'<td><a href="/sales/'+encodeURIComponent(s.id)+'/packing-slip" target="_blank">Slip</a></td></tr>';
        });
        html += '</table></div></div>';
    }

    if(!html) html = '<div class="empty-state">No results for &ldquo;'+escHtml(q)+'&rdquo;</div>';
    container.innerHTML = html;
}

// ── Receiving Transactions ────────────────────────────────────────────
async function loadReceiving(){
    var [res, photoRes] = await Promise.all([
        fetch('/api/organic/raw-materials'+rangeQuery()),
        fetch('/api/organic/raw-materials/receipt-photos'),
    ]);
    var data = await res.json();
    var photoIds = new Set([]);
    try { photoIds = new Set(((await photoRes.json()).ids) || []); } catch(e) {}
    photoIdsAll = photoIds;
    var container = document.getElementById('receiving-container');
    var countEl = document.getElementById('receiving-count');
    var deliveries = data.filter(function(r){ return !r.migration_baseline && !r.adjustment; });
    deliveries.sort(function(a,b){
        return (b.date_received||b.created_at||'').localeCompare(a.date_received||a.created_at||'');
    });

    // Group by the delivery the line was saved on (server-supplied); lines with
    // no known delivery fall back to same date + supplier.
    var txMap = {}, txOrder = [];
    deliveries.forEach(function(r){
        const key = r.delivery_id || ((r.date_received||'')+'||'+(r.supplier||'(unknown)'));
        if(!txMap[key]){ txMap[key]={date:r.date_received||'',supplier:r.supplier||'(unknown)',items:[]}; txOrder.push(key); }
        txMap[key].items.push(r);
    });
    var transactions = txOrder.map(function(k){ return txMap[k]; });

    if(countEl) countEl.textContent = transactions.length+' deliver'+(transactions.length===1?'y':'ies');
    if(!transactions.length){
        container.innerHTML='<div class="empty-state">No receiving records yet. Use <strong>Add Inventory</strong> to record deliveries.</div>'; return;
    }

    function renderDelivery(tx, i){
        var h='<details style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px;">';
        h+='<summary style="padding:10px 14px;background:#f9f9f7;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;">';
        h+='<span style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">';
        h+='<span style="font-size:13px;font-weight:600;">'+escHtml(tx.supplier)+'</span>';
        h+='<span style="font-size:11px;color:var(--text-light);">'+escHtml(tx.date)+'</span>';
        h+='</span>';
        h+='<span style="display:flex;align-items:center;gap:10px;white-space:nowrap;">';
        var photoItem = tx.items.find(function(r){ return photoIds.has(r.id); });
        if(photoItem){
            h+='<button onclick="event.stopPropagation();event.preventDefault();window.open(\'/api/organic/raw-materials/receipt-photo/'+encodeURIComponent(photoItem.id)+'\',\'_blank\');" title="View invoice / packing slip" style="border:1px solid var(--border);background:#fff;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;color:#2e7d32;">&#128206; Invoice</button>';
        }
        h+='<span style="font-size:11px;color:var(--text-light);">'+tx.items.length+' item'+(tx.items.length===1?'':'s')+'</span>';
        h+='</span>';
        h+='</summary>';
        h+='<div style="padding:8px 14px 12px;">';
        h+='<table class="inv-table" style="font-size:12px;"><tr><th>Ingredient</th><th>LOT#</th><th>Qty</th><th>Remaining</th></tr>';
        tx.items.forEach(function(r){
            var noLot=r.no_supplier_lot?' <span title="No supplier LOT# entered — system-generated" style="font-size:10px;color:#b26a00;white-space:nowrap;">⚠ no supplier lot</span>':'';
            h+='<tr><td>'+escHtml(r.item||'')+'</td><td>'+escHtml(r.supplier_lot||'—')+noLot+'</td>'
              +'<td>'+(r.quantity||0)+' '+escHtml(r.unit||'')+'</td>'
              +'<td>'+(r.remaining!==undefined?r.remaining:'—')+' '+escHtml(r.unit||'')+'</td></tr>';
        });
        h+='</table></div></details>';
        return h;
    }

    // Group by month — newest month open, older months collapsed.
    container.innerHTML = renderMonthGroups(transactions, function(group){
        return group.map(function(tx){ return renderDelivery(tx); }).join('');
    }, _deliveriesCount);
}



// ── Date range ───────────────────────────────────────────────────────
// The window is applied SERVER-SIDE via ?from=/?to= on both endpoints, not by
// filtering here — the point is to stop shipping the whole table to the
// browser. Those two params are also exactly what a SQL WHERE clause takes, so
// when these files become tables the request URLs do not change at all.
// Search & Trace deliberately ignores the range: a trace must reach any record.
let _rangeFrom = '', _rangeTo = '';

function isoDaysAgo(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.toLocaleDateString('en-CA');
}

function rangeQuery() {
    const p = [];
    if (_rangeFrom) p.push('from=' + encodeURIComponent(_rangeFrom));
    if (_rangeTo) p.push('to=' + encodeURIComponent(_rangeTo));
    return p.length ? '?' + p.join('&') : '';
}

function describeRange() {
    const note = document.getElementById('range-note');   // removed 2026-10-01; kept null-safe
    if (!note) return;
    if (!_rangeFrom && !_rangeTo) { note.textContent = 'Showing every record on file.'; return; }
    note.textContent = 'Showing ' + (_rangeFrom || 'the beginning') + ' to ' + (_rangeTo || 'today') + '.';
}

function applyRange(from, to, activeBtn) {
    _rangeFrom = from || '';
    _rangeTo = to || '';
    document.querySelectorAll('.range-btn').forEach(function (b) {
        b.classList.toggle('active', b === activeBtn);
    });
    describeRange();
    loadSales();
    loadReceiving();
}

function initRange() {
    document.querySelectorAll('.range-btn[data-days]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('range-custom').style.display = 'none';
            const d = btn.dataset.days;
            document.getElementById('range-from').value = '';
            document.getElementById('range-to').value = '';
            applyRange(d === 'all' ? '' : isoDaysAgo(parseInt(d, 10)), '', btn);
        });
    });
    // Custom range: reveal the two dates; either one changing applies it.
    const customBtn = document.getElementById('range-custom-btn');
    customBtn.addEventListener('click', function () {
        document.getElementById('range-custom').style.display = 'inline-flex';
    });
    ['range-from', 'range-to'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', function () {
            const f = document.getElementById('range-from').value;
            const t = document.getElementById('range-to').value;
            if (!f && !t) return;
            if (f && t && f > t) { alert('The "from" date is after the "to" date.'); return; }
            applyRange(f, t, customBtn);
        });
    });
    // Default: the last 90 days. Deliberately a real default rather than "all"
    // — the page previously loaded every record ever on every visit.
    _rangeFrom = isoDaysAgo(90);
    describeRange();
}

// ── Init ──
document.addEventListener('DOMContentLoaded', function(){
    initRange();
    loadSales();
    loadReceiving();
});
</script>
<script>
(function(){
  var back = document.getElementById('nav-back');
  var fwd  = document.getElementById('nav-fwd');
  // history.length==1 means no history to go back to
  if(back) back.disabled = (window.history.length <= 1);
  if(back) back.onclick = function(){ window.history.back(); };
  if(fwd)  fwd.onclick  = function(){ window.history.forward(); };
  // Update disabled state after navigation
  window.addEventListener('popstate', function(){
    if(back) back.disabled = (window.history.length <= 1);
  });
})();
</script>
