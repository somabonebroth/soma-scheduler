<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - CCP Checklist Reference</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.ccp-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.ccp-header { background: var(--accent); color: #fff; padding: 12px 18px; font-size: 15px; font-weight: 600; }
.ccp-item { font-size: 14px; padding: 10px 18px; border-bottom: 1px solid var(--border); line-height: 1.5; }
.ccp-item:last-child { border-bottom: none; }
.ccp-item:nth-child(even) { background: var(--row-alt); }
.ccp-item.callout { background: var(--warning); font-weight: 600; }
.edit-mode .ccp-item { display: none; }
.edit-mode .edit-area { display: block; }
.edit-area { display: none; padding: 12px 18px; }
.edit-area textarea { width: 100%; min-height: 120px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; }
.edit-area label { font-size: 12px; font-weight: 600; color: var(--text-light); margin-bottom: 4px; display: block; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.warning-banner { background: var(--warning); border: 1px solid #ffc107; border-radius: 6px; padding: 12px 16px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
@media print {
  .header, .no-print { display: none !important; }
  body { background: white; }
  .ccp-section { break-inside: avoid; box-shadow: none !important; border: 1px solid #ccc; margin-bottom: 8px; }
  .ccp-header { background: #2e4a2e !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ccp-item.callout { background: #fff8e1 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .edit-btn, .edit-area, .ccp-edit-controls { display: none !important; }
  .main { padding: 0 !important; max-width: 100% !important; }
}
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>CCP Checklist</h1><p>Master Reference & Training Document</p></div>
    <div class="header-right" style="display:flex;gap:8px;align-items:center;">
        <button class="header-btn no-print" onclick="window.print()">🖨 Print / PDF</button>
        <a href="/" class="header-btn no-print">← Dashboard</a>
    </div>
</div>
<div class="main">
    <div class="warning-banner">
        Pressure canning MANDATORY - never use boiling-water canner<br>
        Never add thickeners (including fat) before canning - thicken at serving only<br>
        Never skip any canning procedures
    </div>
    <div class="top-bar">
        <div></div>
        <button class="btn btn-outline" id="edit-toggle" onclick="toggleEdit()">Edit Checklist</button>
    </div>
    <div id="ccp-container"></div>
    <div id="save-bar" style="display:none;text-align:center;margin-top:16px;">
        <button class="btn btn-primary" onclick="saveCCP()">Save Changes</button>
        <button class="btn btn-outline" onclick="cancelEdit()">Cancel</button>
    </div>
</div>
<script>
let sections = [];
let editing = false;

document.addEventListener('DOMContentLoaded', async () => {
    const res = await fetch('/api/ccp-master');
    sections = await res.json();
    render();
});

function render() {
    const container = document.getElementById('ccp-container');
    let html = '';
    for (var i = 0; i < sections.length; i++) {
        var sec = sections[i];
        html += '<div class="ccp-section' + (editing ? ' edit-mode' : '') + '" data-idx="' + i + '">';
        html += '<div class="ccp-header">' + sec.num + '  ' + sec.title + '</div>';
        for (var j = 0; j < sec.items.length; j++) {
            var item = sec.items[j];
            var cls = item.toUpperCase().indexOf('CANNER') >= 0 && item.indexOf('Kitchen Lead') >= 0 ? 'ccp-item callout' : 'ccp-item';
            html += '<div class="' + cls + '">' + item + '</div>';
        }
        html += '<div class="edit-area"><label>Section Title</label><input type="text" class="edit-title" value="' + sec.title.replace(/"/g, '&quot;') + '" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;margin-bottom:8px;"><label>Items (one per line)</label><textarea class="edit-items">' + sec.items.join('\n') + '</textarea></div>';
        html += '</div>';
    }
    container.innerHTML = html;
}

function toggleEdit() {
    editing = true;
    render();
    document.getElementById('save-bar').style.display = 'block';
    document.getElementById('edit-toggle').style.display = 'none';
}

function cancelEdit() {
    editing = false;
    render();
    document.getElementById('save-bar').style.display = 'none';
    document.getElementById('edit-toggle').style.display = 'inline-block';
}

async function saveCCP() {
    var blocks = document.querySelectorAll('.ccp-section');
    var updated = [];
    blocks.forEach(function(block, i) {
        var titleEl = block.querySelector('.edit-title');
        var itemsEl = block.querySelector('.edit-items');
        updated.push({
            num: sections[i].num,
            title: titleEl.value.trim(),
            items: itemsEl.value.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; }),
        });
    });
    await fetch('/api/ccp-master', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(updated),
    });
    sections = updated;
    editing = false;
    render();
    document.getElementById('save-bar').style.display = 'none';
    document.getElementById('edit-toggle').style.display = 'inline-block';
}
</script>
</body>
</html>
