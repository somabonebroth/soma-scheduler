<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - Management Report</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* Page layout only — colours/components come from the shared sheet */
.dr-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.dr-date { font-size: 18px; font-weight: 700; color: var(--dark); }
.dr-nav { margin-left: auto; display: flex; gap: 6px; }
.dr-nav button { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer; color: var(--text); }
.dr-nav button:disabled { opacity: .4; cursor: default; }

.dr-banner { border-radius: var(--r-md); padding: 13px 17px; font-size: 14px; font-weight: 600; margin-bottom: 22px; }
.dr-handover { background: var(--amber-bg); border: 1px solid var(--amber-border); border-left: 4px solid var(--amber-text); border-radius: var(--r-md); padding: 14px 17px; margin-bottom: 16px; font-size: 14px; line-height: 1.55; color: var(--text); }
.dr-handover-k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.1px; color: var(--amber-text-dark); margin-bottom: 5px; }
.dr-banner.ok { background: var(--action-green-bg); border: 1px solid var(--action-green); border-left: 4px solid var(--action-green); color: var(--action-green); }
.dr-banner.attn { background: var(--amber-bg); border: 1px solid var(--amber-border); border-left: 4px solid var(--amber-text); color: var(--amber-text-dark, var(--amber-text)); }

.dr-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 24px; overflow: hidden; }
.dr-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--bg); }
.dr-num { font-size: 11px; font-weight: 700; color: var(--white); background: var(--accent); border-radius: 50%; width: 21px; height: 21px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dr-title { font-size: 13.5px; font-weight: 700; color: var(--dark); text-transform: uppercase; letter-spacing: .8px; }
.dr-sub { font-size: 12px; color: var(--text-light); margin-left: auto; }
.dr-body { padding: 16px 18px 18px; }

/* Per-section tone: each of the three sections carries its own colour so the
   eye can find "production / sales / checklists" before reading a word —
   same idea as the dashboard tiles. All values are existing tokens. */
.sec-green { border-top: 3px solid var(--accent); }
.sec-green .dr-head { background: var(--green-tint); }
.sec-green .dr-num, .sec-green .dr-sublabel::before { background: var(--accent); }
.sec-blue { border-top: 3px solid var(--info); }
.sec-blue .dr-head { background: var(--action-blue-bg); }
.sec-blue .dr-num, .sec-blue .dr-sublabel::before { background: var(--info); }
.sec-amber { border-top: 3px solid var(--amber-text); }
.sec-amber .dr-head { background: var(--amber-bg); }
.sec-amber .dr-num, .sec-amber .dr-sublabel::before { background: var(--amber-text); }
.sec-notes { border-left: 4px solid var(--amber-text); }
.sec-notes .dr-head { background: var(--amber-bg); }

.dr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dr-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); font-weight: 700; padding: 0 12px 8px 6px; border-bottom: 2px solid var(--border); }
.dr-table td { padding: 9px 12px 9px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
.dr-table tr:nth-child(even) td { background: var(--row-alt); }
.dr-table tr:last-child td { border-bottom: none; }
.dr-table td.num, .dr-table th.num { text-align: right; padding-right: 6px; white-space: nowrap; }
.dr-scroll { overflow-x: auto; }
.dr-lot { font-size: 11px; color: var(--text-light); }
.dr-tag { font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 8px; background: var(--green-tint, var(--action-green-bg)); color: var(--action-green); border: 1px solid var(--action-green); white-space: nowrap; }
.dr-totals { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; padding: 9px 13px; background: var(--bg); border-radius: var(--r-sm); font-size: 13px; color: var(--text-light); }
.dr-totals b { color: var(--dark); }
.dr-totals + .dr-totals { margin-top: 8px; }
.dr-empty { font-size: 13px; color: var(--text-light); font-style: italic; padding: 2px 0 4px; }

/* LOT# + hot-stamp guide styles live in _labelling_panel.html (shared with
   the FOH dashboard since 2026-08-26). */

.dr-chan { border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 15px; margin-bottom: 10px; background: var(--row-alt); }
.dr-chan-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 7px; }
.dr-chan-name { font-size: 12.5px; font-weight: 700; color: var(--dark); }
.dr-chan-fig { font-size: 12.5px; color: var(--text-light); margin-left: auto; }
.dr-chan-fig b { color: var(--dark); }
.dr-chan-msg { font-size: 12px; color: var(--text-light); font-style: italic; }

.dr-sublabel { display: flex; align-items: center; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text); margin: 20px 0 8px; }
.dr-sublabel::before { content: ''; width: 8px; height: 8px; border-radius: 2px; background: var(--text-light); margin-right: 8px; flex-shrink: 0; }
.dr-sublabel:first-child { margin-top: 0; }

.dr-sublabel.attn::before { background: var(--action-red) !important; }
.dr-issue { display: flex; align-items: flex-start; gap: 9px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
.dr-issue:last-child { border-bottom: none; }
.dr-lvl { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.dr-lvl.high { background: var(--action-red-bg); border: 1px solid var(--action-red); color: var(--action-red); }
.dr-lvl.medium { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text-dark, var(--amber-text)); }
.dr-note { font-size: 13px; padding: 8px 0; line-height: 1.5; border-bottom: 1px solid var(--border); }
.dr-note:last-child { border-bottom: none; padding-bottom: 2px; }
.dr-note:first-child { padding-top: 2px; }
.dr-note .src { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--amber-text-dark); background: var(--amber-bg); border: 1px solid var(--amber-border); border-radius: 8px; padding: 1px 8px; margin-right: 8px; }

.dr-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.dr-chip { font-size: 11.5px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); color: var(--text-light); }
.dr-chip.yes { border-color: var(--action-green); color: var(--action-green); background: var(--action-green-bg); }
.dr-chip.no { border-color: var(--action-red); color: var(--action-red); background: var(--action-red-bg); }

.dr-sign { background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; padding: 15px 16px; }
.dr-sign-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.dr-sign-row input { flex: 1; min-width: 130px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--white); }
.dr-sign-row button { background: var(--action-green); color: var(--white); border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
.dr-signed { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: var(--action-green); font-weight: 600; }
.dr-signed button { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text-light); border-radius: 6px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; }
.dr-catchup { margin-top: 14px; font-size: 13px; }
.dr-catchup button { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text-dark, var(--amber-text)); border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="header">
    <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
    <div class="header-text"><h1>Management Report</h1><p>What happened, and what needs you</p></div>
    <div class="header-right"><button class="header-btn" onclick="window.location='/'">&#8962; Dashboard</button></div>
</div>
<div class="main">
    <div id="dr-content">Loading&hellip;</div>
</div>

{% include "_labelling_panel.html" %}
<script>
// New JS — let/const per the forward-only policy.
let offset = 1;                 // days back from today; 1 = yesterday
let brief = null;

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function money(n){
    const v = Number(n || 0);
    return '$' + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function dateStr(off){
    const d = new Date();
    d.setDate(d.getDate() - off);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function offsetFor(iso){
    const then = new Date(iso + 'T00:00:00');
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.max(1, Math.round((now - then) / 86400000));
}

function issuesHtml(list){
    if (!list.length) return '';
    return '<div class="dr-sublabel attn">Needs attention</div>' + list.map(i =>
        '<div class="dr-issue"><span class="dr-lvl ' + i.level + '">'
        + (i.level === 'high' ? 'Issue' : 'Check') + '</span><span>' + esc(i.text) + '</span></div>').join('');
}

function notesHtml(list){
    if (!list.length) return '';
    return list.map(n =>
        '<div class="dr-note"><span class="src">' + esc(n.source) + '</span>' + esc(n.text) + '</div>').join('');
}

// Every note the floor left, gathered at the top. The End of Day handover
// keeps its amber block — it is written FOR this page — and the rest (day
// note, per-vessel finish notes, closing/cleaning notes) follow beneath it
// rather than being scattered through the three sections.
function staffNotesHtml(b){
    const rest = (b.notes || []).filter(n => n.source !== 'Note for management');
    if (!b.handover_note && !rest.length) return '';
    return (b.handover_note
            ? '<div class="dr-handover"><div class="dr-handover-k">Note from the floor</div>'
              + esc(b.handover_note) + '</div>'
            : '')
        + (rest.length
            ? '<div class="dr-section sec-notes"><div class="dr-head">'
              + '<span class="dr-title">Notes from staff</span></div>'
              + '<div class="dr-body">' + notesHtml(rest) + '</div></div>'
            : '');
}

function productionHtml(p){
    // Lots + stamp guide + table + totals come from the shared labelling
    // panel (_labelling_panel.html); this page adds its own sign-off line,
    // issues and section chrome on top.
    lpSetData(p, brief.date);
    let body = lpBodyHtml();
    if (p.kitchen_signoff) {
        body += '<div class="dr-totals"><span>Kitchen sign-off: <b>' + esc(p.kitchen_signoff) + '</b></span></div>';
    }
    body += issuesHtml(p.issues);
    return section(1, "What's getting labelled today", p.total_jars ? p.total_jars + ' jars' : '', body, 'green');
}

function transactionsHtml(t){
    let body = '<div class="dr-sublabel">Sold</div>';
    if (!t.sales.rows.length) {
        body += '<div class="dr-empty">No sales recorded for this day.</div>';
    } else {
        body += '<div class="dr-scroll"><table class="dr-table"><tr>'
            + '<th>Buyer</th><th>Product</th><th>Lot(s)</th><th class="num">Units</th></tr>'
            + t.sales.rows.map(r =>
                '<tr><td>' + esc(r.buyer) + (r.channel ? ' <span class="dr-lot">(' + esc(r.channel) + ')</span>' : '')
                + '</td><td>' + esc(r.item) + '</td>'
                + '<td class="dr-lot">' + esc(r.lots.join(', ') || '—') + '</td>'
                + '<td class="num"><b>' + r.quantity + '</b></td></tr>').join('')
            + '</table></div>'
            + '<div class="dr-totals"><span>Total: <b>' + t.sales.units + '</b> units across <b>'
            + t.sales.count + '</b> record' + (t.sales.count === 1 ? '' : 's') + '</span>'
            + t.sales.by_buyer.map(b => '<span>' + esc(b[0]) + ': <b>' + b[1] + '</b></span>').join('') + '</div>';
    }

    const po = t.portal || {rows: [], count: 0, units: 0, revenue: 0, by_portal: []};
    body += '<div class="dr-sublabel">Portal orders</div>';
    if (!po.rows.length) {
        body += '<div class="dr-empty">No portal order left inventory on this day.</div>';
    } else {
        body += '<div class="dr-scroll"><table class="dr-table"><tr>'
            + '<th>Portal</th><th>Order</th><th>Buyer</th><th>Items</th>'
            + '<th class="num">Units</th><th class="num">Value</th></tr>'
            + po.rows.map(o =>
                '<tr><td>' + esc(o.portal) + '</td>'
                + '<td class="dr-lot">' + esc(o.order_id) + '</td>'
                + '<td>' + esc(o.buyer)
                + (o.payment_pending ? ' <span class="dr-lot">(payment pending)</span>' : '')
                + '</td><td class="dr-lot">' + esc(o.items.map(i => i.item + ' \u00d7' + i.quantity).join(', '))
                + (o.delivery_date && o.delivery_date !== brief.date
                    ? '<br>delivery ' + esc(o.delivery_date) : '')
                + '</td><td class="num"><b>' + o.units + '</b></td>'
                + '<td class="num">' + money(o.revenue) + '</td></tr>').join('')
            + '</table></div>'
            + '<div class="dr-totals"><span><b>' + po.count + '</b> order'
            + (po.count === 1 ? '' : 's') + ' &middot; <b>' + po.units + '</b> units &middot; <b>'
            + money(po.revenue) + '</b></span>'
            + po.by_portal.map(b => '<span>' + esc(b.portal) + ': <b>' + b.units + '</b></span>').join('')
            + '</div>'
            + '<div class="dr-totals"><span>Counted on the day the stock actually left '
            + 'inventory, which for a wholesale order is approval &mdash; not its delivery date.</span></div>';
    }

    body += '<div class="dr-sublabel">Retail channels</div>'
        + '<div id="dr-channels"><div class="dr-empty">Reading Shopify and Clover&hellip;</div></div>';

    body += '<div class="dr-sublabel">Received</div>';
    if (!t.receiving.rows.length) {
        body += '<div class="dr-empty">No deliveries logged for this day.</div>';
    } else {
        body += '<div class="dr-scroll"><table class="dr-table"><tr>'
            + '<th>Item</th><th>Supplier</th><th>Lot</th><th class="num">Qty</th></tr>'
            + t.receiving.rows.map(r =>
                '<tr><td>' + esc(r.item) + '</td><td>' + esc(r.supplier || '—') + '</td>'
                + '<td class="dr-lot">' + esc(r.supplier_lot || '—')
                + (r.no_supplier_lot ? ' &#9888;' : '') + '</td>'
                + '<td class="num"><b>' + esc(r.quantity) + '</b> ' + esc(r.unit) + '</td></tr>').join('')
            + '</table></div>';
    }
    body += issuesHtml(t.issues);
    const sub = t.sales.units + ' sold · ' + t.receiving.count + ' delivered';
    // The page navigates back through earlier days, so "yesterday" is only
    // said on the day it is true.
    const when = offset === 1 ? 'yesterday' : brief.label;
    return section(2, 'Sales & Receiving from ' + when, sub, body, 'blue');
}

function checklistsHtml(c){
    let body = '<div class="dr-sublabel">Production checklist (CCP)</div>';
    if (!c.ccp.completed) {
        body += '<div class="dr-empty">No production checklist completed for this day.</div>';
    } else if (!c.ccp.sections.length) {
        body += '<div class="dr-empty">Checklist completed, but no CCP sections were confirmed.</div>';
    } else {
        body += '<div class="dr-chips">' + c.ccp.sections.map(s =>
            '<span class="dr-chip ' + (s.confirmed ? 'yes' : 'no') + '">'
            + (s.confirmed ? '&#10003; ' : '&#10007; ') + esc(s.num + ' ' + s.title) + '</span>').join('') + '</div>'
            + '<div class="dr-totals"><span>Confirmed: <b>' + c.ccp.confirmed + '/' + c.ccp.total + '</b></span>'
            + (c.ccp.kitchen_signoff ? '<span>Signed: <b>' + esc(c.ccp.kitchen_signoff) + '</b></span>' : '')
            + '</div>';
    }

    body += '<div class="dr-sublabel">Closing checklist</div>';
    const cl = c.closing || {};
    if (!cl.total) {
        body += '<div class="dr-empty">No closing checklist set up.</div>';
    } else if (!cl.signed) {
        body += '<div class="dr-empty">Not signed off for this day.</div>';
    } else {
        body += '<div class="dr-totals"><span>Signed by <b>' + esc(cl.staff) + '</b></span>'
            + '<span>Done: <b>' + cl.done_count + '/' + cl.total + '</b></span></div>';
        if ((cl.missed || []).length) {
            body += '<div class="dr-chips" style="margin-top:8px;">' + cl.missed.map(m =>
                '<span class="dr-chip no">&#10007; ' + esc(m) + '</span>').join('') + '</div>';
        }
    }

    body += '<div class="dr-sublabel">Cleaning &amp; upkeep rotation</div>';
    const jobs = (c.rotation && c.rotation.jobs_done) || [];
    if (!jobs.length) {
        body += '<div class="dr-empty">' + (c.rotation && c.rotation.declined
            ? 'Rotating job declined — no time on the day.'
            : 'No rotating job done this day.') + '</div>';
    } else {
        body += '<div class="dr-scroll"><table class="dr-table"><tr><th>Job</th><th>By</th></tr>'
            + jobs.map(j => '<tr><td>' + esc(j.title) + '</td><td>' + esc(j.staff) + '</td></tr>').join('')
            + '</table></div>';
    }
    if (c.rotation && c.rotation.overdue) {
        body += '<div class="dr-totals"><span><b>' + c.rotation.overdue + '</b> rotating job'
            + (c.rotation.overdue === 1 ? '' : 's') + ' currently overdue</span></div>';
    }

    body += issuesHtml(c.issues);
    const done = (c.ccp.completed ? 1 : 0) + (cl.signed ? 1 : 0);
    return section(3, 'Completed checklists and cleaning', done + ' of 2 signed', body, 'amber');
}

function section(num, title, sub, body, tone){
    return '<div class="dr-section' + (tone ? ' sec-' + tone : '') + '"><div class="dr-head">'
        + '<span class="dr-num">' + num + '</span><span class="dr-title">' + esc(title) + '</span>'
        + (sub ? '<span class="dr-sub">' + esc(sub) + '</span>' : '')
        + '</div><div class="dr-body">' + body + '</div></div>';
}

function signHtml(b){
    let inner;
    if (b.signoff) {
        const when = (b.signoff.signed_at || '').substring(0, 16).replace('T', ' ');
        inner = '<div class="dr-signed">&#10003; Reviewed by ' + esc(b.signoff.name) + ' &middot; ' + esc(when)
            + (b.signoff.notes ? ' &middot; ' + esc(b.signoff.notes) : '')
            + '<button onclick="unsign()">Undo</button></div>';
    } else if (!b.needs_review) {
        inner = '<div class="dr-empty">Quiet day — nothing to review.</div>';
    } else {
        inner = '<div style="font-size:13px;color:var(--text-light);">'
            + 'Once you&rsquo;ve read this and actioned anything above, mark it reviewed.</div>'
            + '<div class="dr-sign-row">'
            + '<input type="text" id="sign-name" placeholder="Your name" autocomplete="off">'
            + '<input type="text" id="sign-note" placeholder="Notes (optional)" autocomplete="off">'
            + '<button onclick="sign()">&#10003; Mark reviewed</button></div>';
    }
    return '<div class="dr-sign">' + inner + '</div><div id="catchup"></div>';
}

async function load(){
    const el = document.getElementById('dr-content');
    try {
        const res = await fetch('/api/daily-brief?date=' + dateStr(offset));
        if (!res.ok) throw new Error('unavailable');
        brief = await res.json();
    } catch (e) {
        el.innerHTML = '<div class="dr-empty">Daily review unavailable right now.</div>';
        return;
    }
    const b = brief;
    const high = b.actions.filter(a => a.level === 'high').length;
    const banner = b.all_clear
        ? '<div class="dr-banner ok">&#10003; Nothing needs your attention.</div>'
        : '<div class="dr-banner attn">' + b.actions.length + ' thing'
          + (b.actions.length === 1 ? '' : 's') + ' need your attention'
          + (high ? ' — ' + high + ' important' : '') + '.</div>';

    el.innerHTML = '<div class="dr-bar"><span class="dr-date">' + esc(b.label) + '</span>'
        + '<div class="dr-nav"><button onclick="step(1)">&#8592; Earlier</button>'
        + '<button onclick="step(-1)"' + (offset <= 1 ? ' disabled' : '') + '>Later &#8594;</button></div></div>'
        + staffNotesHtml(b)
        + banner
        + productionHtml(b.production)
        + transactionsHtml(b.transactions)
        + checklistsHtml(b.checklists)
        + signHtml(b);
    loadCatchup();
    loadChannels();
}

// Shopify and Clover are read LIVE for the date, because the cron import only
// runs weekly — sales.json holds nothing for yesterday on six mornings out of
// seven. Read-only: nothing here writes a sale or moves inventory. Loaded
// after the page renders so two outbound API calls can never delay the review.
const CHANNEL_NAMES = {shopify: 'Shopify', clover: 'Clover'};

function channelHtml(c){
    const name = CHANNEL_NAMES[c.channel] || c.channel;
    let head = '<div class="dr-chan-head"><span class="dr-chan-name">' + esc(name) + '</span>';
    if (c.status === 'ok') {
        head += '<span class="dr-chan-fig"><b>' + c.units + '</b> units &middot; <b>'
            + money(c.revenue) + '</b> &middot; ' + c.orders + ' order'
            + (c.orders === 1 ? '' : 's') + '</span>';
    }
    head += '</div>';

    let body = '';
    if (c.status === 'unconfigured' || c.status === 'error') {
        body = '<div class="dr-chan-msg">' + esc(c.status === 'error'
            ? name + ' could not be read: ' + c.message
            : c.message) + '</div>';
    } else if (!c.rows.length) {
        body = '<div class="dr-chan-msg">No sales on this day.</div>';
    } else {
        body = '<div class="dr-scroll"><table class="dr-table"><tr>'
            + '<th>Product</th><th class="num">Units</th><th class="num">Value</th></tr>'
            + c.rows.map(r => '<tr><td>' + esc(r.item)
                + (r.exists_in_soma ? '' : ' <span class="dr-lot">(no matching recipe)</span>')
                + '</td><td class="num"><b>' + r.quantity + '</b></td>'
                + '<td class="num">' + money(r.revenue) + '</td></tr>').join('')
            + '</table></div>';
    }
    // Anything the weekly import would choke on is worth seeing on the day it
    // happened, not the following Monday when the commit refuses.
    const flags = [];
    if ((c.unparseable || []).length) flags.push(c.unparseable.length + ' SKU(s) the importer cannot parse: ' + c.unparseable.join(', '));
    if ((c.unmapped || []).length) flags.push(c.unmapped.length + ' SKU(s) with no matching Soma recipe: ' + c.unmapped.join(', '));
    if (c.other_brands) flags.push(c.other_brands + ' non-SOMA item(s) sold (not imported).');
    if ((c.imported || {}).rows) flags.push('Soma already holds ' + c.imported.rows + ' imported ' + name
        + ' sale row(s) dated this day (' + c.imported.units + ' units) — the weekly import stamps a whole week on its Sunday.');
    if (flags.length) body += '<div class="dr-chan-msg" style="margin-top:7px;">' + flags.map(esc).join('<br>') + '</div>';

    return '<div class="dr-chan">' + head + body + '</div>';
}

async function loadChannels(){
    const el = document.getElementById('dr-channels');
    if (!el) return;
    let d;
    try {
        const res = await fetch('/api/daily-brief/channels?date=' + dateStr(offset));
        if (!res.ok) throw new Error('unavailable');
        d = await res.json();
    } catch (e) {
        el.innerHTML = '<div class="dr-empty">Channel sales could not be read right now.</div>';
        return;
    }
    if (d.date !== brief.date) return;   // the reader moved on while we waited
    el.innerHTML = d.channels.map(channelHtml).join('')
        + '<div class="dr-totals"><span>Read live from each channel &mdash; <b>' + d.units
        + '</b> units &middot; <b>' + money(d.revenue) + '</b> gross, excluding tax and shipping. '
        + 'These are reported only; the weekly import is still what writes them into Soma and deducts stock.</span></div>';
}

function step(delta){
    offset = Math.max(1, offset + delta);
    load();
}

function jumpTo(iso){
    offset = offsetFor(iso);
    load();
}

async function sign(){
    const name = document.getElementById('sign-name').value.trim();
    if (!name) { document.getElementById('sign-name').focus(); return; }
    const res = await fetch('/api/daily-signoff/' + dateStr(offset), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name: name, notes: document.getElementById('sign-note').value.trim()}),
    });
    if (res.ok) load();
}

async function unsign(){
    const res = await fetch('/api/daily-signoff/' + dateStr(offset), {method: 'DELETE'});
    if (res.ok) load();
}

// A missed day should surface, not quietly age out.
async function loadCatchup(){
    let d;
    try {
        const res = await fetch('/api/daily-signoffs/pending');
        if (!res.ok) return;
        d = await res.json();
    } catch (e) { return; }
    const older = (d.pending || []).filter(iso => offsetFor(iso) !== offset);
    const el = document.getElementById('catchup');
    if (!el || !older.length) return;
    el.className = 'dr-catchup';
    el.innerHTML = '<button onclick="jumpTo(\'' + older[0] + '\')">'
        + older.length + ' other day' + (older.length > 1 ? 's' : '')
        + ' still unreviewed — oldest: ' + older[0] + '</button>';
}

load();
</script>
