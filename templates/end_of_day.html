<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA tags (managed) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soma">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/logo-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/logo-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/static/logo-512.png">
<!-- /PWA tags -->
<title>Soma - End of Day</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* Page layout only — colours/components come from the shared sheet */
body { background: var(--bg); }
.eod-top { background: var(--dark); color: var(--white); padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
.eod-top h1 { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
.eod-top .sub { font-size: 12px; opacity: .7; }
.eod-exit { margin-left: auto; background: none; border: 1px solid rgba(255,255,255,.35); color: var(--white); padding: 7px 13px; border-radius: var(--r-sm); font-size: 12px; cursor: pointer; }

.trail { max-width: 680px; margin: 16px auto 0; padding: 0 16px; display: flex; gap: 6px; }
.trail-seg { flex: 1; height: 5px; border-radius: 3px; background: var(--border); transition: background .25s; }
.trail-seg.done { background: var(--accent); }
.trail-seg.current { background: var(--accent-light); }

.stage { max-width: 680px; margin: 0 auto; padding: 18px 16px 60px; }
.step { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 24px 22px 22px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.step.enter { animation: slidein .28s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.step-kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent); margin-bottom: 8px; }
.step h2 { font-size: 21px; line-height: 1.25; color: var(--dark); margin-bottom: 6px; }
.step .lead { font-size: 13.5px; color: var(--text-light); line-height: 1.5; margin-bottom: 18px; }

.prod-table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
.prod-table td { padding: 11px 4px; border-bottom: 1px solid var(--border); font-size: 15px; }
.prod-table td.n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prod-table tr.total td { border-bottom: none; border-top: 2px solid var(--dark); font-weight: 700; padding-top: 12px; }
.empty-note { font-size: 13.5px; color: var(--text-light); background: var(--bg); border: 1px dashed var(--border); border-radius: var(--r-md); padding: 14px; text-align: center; }

.ccp-line { display: flex; align-items: center; gap: 12px; padding: 12px 12px; border: 1px solid var(--border); border-radius: var(--r-md); margin-bottom: 7px; background: var(--card-bg); cursor: pointer; }
.ccp-line.ok { background: var(--action-green-bg); border-color: var(--green-light); }
.ccp-line.gap { background: var(--amber-bg); border-color: var(--amber-border); }
.ccp-box { width: 26px; height: 26px; border-radius: var(--r-sm); border: 2px solid var(--grey-light); flex: none; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--white); }
.ccp-line.ok .ccp-box { background: var(--action-green); border-color: var(--action-green); }
.ccp-name { font-size: 14px; font-weight: 600; color: var(--dark); }
.ccp-hint { font-size: 11.5px; color: var(--amber-text-dark); margin-top: 2px; }

.big-item { text-align: center; padding: 20px 8px 26px; }
.big-item .label { font-size: 24px; line-height: 1.3; font-weight: 600; color: var(--dark); }
.counter { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text-light); text-align: center; margin-bottom: 4px; }

.sign-field { margin-bottom: 12px; }
.sign-field label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-light); margin-bottom: 5px; }
.sign-field input, .sign-field textarea { width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: var(--r-md); font-size: 16px; font-family: inherit; background: var(--card-bg); color: var(--text); }
.sign-field textarea { min-height: 110px; resize: vertical; }

.actions { display: flex; gap: 10px; margin-top: 18px; }
.actions .grow { flex: 1; }
.eod-btn { border: none; border-radius: var(--r-md); padding: 16px 18px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
.eod-btn.primary { background: var(--accent); color: var(--white); }
.eod-btn.go { background: var(--action-green); color: var(--white); }
.eod-btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.eod-btn:disabled { background: var(--grey-light); cursor: default; }
.linkish { background: none; border: none; color: var(--text-light); font-size: 13px; text-decoration: underline; cursor: pointer; font-family: inherit; padding: 10px; display: block; margin: 8px auto 0; }

.slot-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dark); margin: 20px 0 8px; display: flex; align-items: center; gap: 9px; }
.slot-head:first-child { margin-top: 4px; }
.slot-head .rule { flex: 1; height: 1px; background: var(--border); }
.slot-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9px; border: 1px solid; }
.slot-weekly { color: var(--info-dark); border-color: var(--info-border); background: var(--action-blue-bg); }
.slot-monthly { color: var(--action-green); border-color: var(--green-light); background: var(--action-green-bg); }
.slot-quarterly { color: var(--amber-text-dark); border-color: var(--amber-border); background: var(--amber-bg); }
.slot-semiannual { color: var(--indigo); border-color: var(--indigo); background: var(--bg); }
.job-pick { width: 100%; text-align: left; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; margin-bottom: 8px; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 12px; }
.job-pick:hover { border-color: var(--accent); }
.job-pick .jt { font-size: 15px; font-weight: 600; color: var(--dark); }
.job-pick .jm { font-size: 11.5px; color: var(--text-light); margin-top: 3px; }
.job-pick .chev { margin-left: auto; color: var(--text-light); font-size: 18px; }
.overdue-dot { color: var(--orange); font-weight: 700; }

.done-mark { text-align: center; padding: 30px 10px; }
.done-mark .ring { width: 82px; height: 82px; border-radius: 50%; background: var(--action-green-bg); border: 3px solid var(--action-green); color: var(--action-green); font-size: 42px; line-height: 76px; margin: 0 auto 18px; animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.done-mark h2 { font-size: 24px; margin-bottom: 8px; }
.recap { text-align: left; max-width: 380px; margin: 20px auto 0; }
.recap div { font-size: 13.5px; color: var(--text-light); padding: 7px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
.recap div span.k { color: var(--action-green); font-weight: 700; }

.signed-strip { background: var(--action-green-bg); border: 1px solid var(--green-light); border-radius: var(--r-md); padding: 12px 14px; font-size: 13.5px; color: var(--success-text); margin-bottom: 16px; }
.warn-strip { background: var(--amber-bg); border: 1px solid var(--amber-border); border-left: 4px solid var(--amber-text); border-radius: var(--r-sm); padding: 12px 14px; font-size: 13px; color: var(--amber-text-dark); margin-bottom: 14px; }
.err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }
@media (max-width: 520px) {
    .step { padding: 20px 16px; border-radius: var(--r-lg); }
    .step h2 { font-size: 19px; }
    .big-item .label { font-size: 21px; }
}
</style>
</head>
<body>
<div class="eod-top">
    <div><h1>End of Day</h1><div class="sub" id="eod-date">&nbsp;</div></div>
    <button class="eod-exit" onclick="leave()">Exit</button>
</div>
<div class="trail" id="trail"></div>
<div class="stage"><div id="step-host"></div></div>

<script>
// New JS — let/const per the forward-only policy.
const TODAY = new Date();
const ISO = TODAY.getFullYear() + '-' + String(TODAY.getMonth() + 1).padStart(2, '0')
          + '-' + String(TODAY.getDate()).padStart(2, '0');
const SLOTS = [
    { key: 'weekly', label: 'Weekly', cls: 'slot-weekly' },
    { key: 'monthly', label: 'Monthly', cls: 'slot-monthly' },
    { key: 'quarterly', label: 'Quarterly', cls: 'slot-quarterly' },
    { key: 'semiannual', label: 'Semi-annual', cls: 'slot-semiannual' }
];

let payload = null;
let steps = [];
let at = 0;
const state = { staff: '', checks: {}, closing: {}, note: '', busy: false,
                recap: [], pickedJob: null, warnings: [] };

function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function nowTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function leave() { window.location.href = '/'; }

async function boot() {
    const res = await fetch('/api/end-of-day?date=' + ISO);
    payload = await res.json();
    document.getElementById('eod-date').textContent = payload.label;
    state.staff = payload.staff || '';
    state.note = payload.note || '';
    (payload.production.sections || []).forEach(s => { state.checks[s.key] = s.confirmed; });
    (payload.closing.items || []).forEach(i => { state.closing[i.id] = i.done; });

    steps = [];
    if (payload.production.ran) steps.push({ kind: 'production' });
    steps.push({ kind: 'note' });
    if (!payload.closing_signed) {
        (payload.closing.items || []).forEach((item, idx) => {
            steps.push({ kind: 'item', item: item, idx: idx });
        });
    }
    steps.push({ kind: 'closing-sign' });
    steps.push({ kind: 'rotation' });
    steps.push({ kind: 'done' });

    // Resume where the shift left off rather than asking twice.
    at = 0;
    if (payload.production.completed && steps[0].kind === 'production') at = 1;
    if (payload.closing_signed) {
        const r = steps.findIndex(s => s.kind === 'rotation');
        if (at < r && payload.note_saved) at = r;
    }
    if (payload.declined || (payload.job_done || []).length) {
        at = steps.findIndex(s => s.kind === 'done');
    }
    render();
}

function render() {
    drawTrail();
    const host = document.getElementById('step-host');
    const step = steps[at];
    let html = '';
    if (step.kind === 'production') html = viewProduction();
    else if (step.kind === 'note') html = viewNote();
    else if (step.kind === 'item') html = viewItem(step);
    else if (step.kind === 'closing-sign') html = viewClosingSign();
    else if (step.kind === 'rotation') html = viewRotation();
    else html = viewDone();
    host.innerHTML = '<div class="step enter">' + html + '</div>';
    window.scrollTo(0, 0);
    const focusEl = host.querySelector('input[data-autofocus]');
    if (focusEl && !focusEl.value) focusEl.focus();
}

function drawTrail() {
    // One segment per stage of the flow, not per checklist item — ten closing
    // items shouldn't make the bar look like ten separate jobs.
    const stages = ['production', 'note', 'closing', 'rotation', 'done'];
    const cur = steps[at].kind;
    const curStage = (cur === 'item' || cur === 'closing-sign') ? 'closing' : cur;
    const idx = stages.indexOf(curStage);
    document.getElementById('trail').innerHTML = stages.map((s, i) =>
        '<div class="trail-seg ' + (i < idx ? 'done' : (i === idx ? 'current' : '')) + '"></div>'
    ).join('');
}

function kicker(stage, name) {
    // Numbering has to follow the steps actually in play — production is
    // skipped entirely on a day the kitchen didn't run.
    const stages = (payload.production.ran ? ['production'] : []).concat(['note', 'closing', 'rotation']);
    const n = stages.indexOf(stage) + 1;
    return '<div class="step-kicker">Step ' + n + ' of ' + stages.length + ' &middot; ' + name + '</div>';
}

function advance() {
    at = Math.min(at + 1, steps.length - 1);
    render();
}

/* ── 1. Production + CCP ────────────────────────────────────────────────── */
function viewProduction() {
    const p = payload.production;
    let rows = '';
    if (p.rows.length) {
        rows = '<table class="prod-table">'
             + p.rows.map(r => '<tr><td>' + esc(r.recipe) + '</td><td class="n">' + r.jars + ' jars</td></tr>').join('')
             + (p.kettles_end ? '<tr><td>Kettle&rsquo;s end</td><td class="n">' + p.kettles_end + ' units</td></tr>' : '')
             + '<tr class="total"><td>Total counted today</td><td class="n">'
             + (p.total_jars + p.kettles_end) + '</td></tr></table>';
    } else {
        rows = '<div class="empty-note">No jar counts were entered today.'
             + (p.started_recipes.length ? ' ' + esc(p.started_recipes.join(', ')) + ' started today &mdash; those jars get counted tomorrow.' : '')
             + '</div>';
    }

    const ccp = (p.sections || []).map(s =>
        '<div class="ccp-line ' + (state.checks[s.key] ? 'ok' : 'gap') + '" onclick="toggleCcp(\'' + s.key + '\')">'
        + '<div class="ccp-box">' + (state.checks[s.key] ? '&#10003;' : '') + '</div>'
        + '<div><div class="ccp-name">' + esc(s.num) + '. ' + esc(s.title) + '</div>'
        + (state.checks[s.key] ? '' : '<div class="ccp-hint">Not yet confirmed &mdash; tap to confirm</div>')
        + '</div></div>').join('');

    if (p.completed) {
        return kicker('production', 'Production')
             + '<h2>Today&rsquo;s production is signed</h2>'
             + '<div class="signed-strip">&#10003; Signed by ' + esc(p.signed_by || 'the kitchen lead')
             + (p.signed_at ? ' &middot; ' + esc(String(p.signed_at).replace('T', ' ').slice(0, 16)) : '') + '</div>'
             + rows
             + '<div class="actions"><button class="eod-btn primary grow" onclick="advance()">Continue &rarr;</button></div>';
    }

    return kicker('production', 'Production')
         + '<h2>Here&rsquo;s what you made today</h2>'
         + '<p class="lead">Jars counted today finish the batches started yesterday, so each line is named for the batch it came from. Check it reads right, confirm the CCPs, and sign.</p>'
         + rows
         + '<h3 style="font-size:14px;margin:22px 0 9px;">Critical control points</h3>'
         + (ccp || '<div class="empty-note">No CCP sections are set up.</div>')
         + '<div class="sign-field" style="margin-top:20px;"><label>Sign &mdash; your name</label>'
         + '<input type="text" id="prod-staff" data-autofocus autocomplete="off" placeholder="e.g. Sam" value="' + esc(state.staff) + '"></div>'
         + '<div class="err" id="prod-err"></div>'
         + '<div class="actions"><button class="eod-btn go grow" id="prod-btn" onclick="signProduction()">&#10003; Confirm &amp; sign</button></div>';
}

function toggleCcp(key) {
    state.checks[key] = !state.checks[key];
    const input = document.getElementById('prod-staff');
    if (input) state.staff = input.value;
    render();
}

async function signProduction() {
    const input = document.getElementById('prod-staff');
    const err = document.getElementById('prod-err');
    const btn = document.getElementById('prod-btn');
    const name = (input.value || '').trim();
    if (!name) { err.textContent = 'Enter your name to sign.'; input.focus(); return; }
    state.staff = name;
    btn.disabled = true; btn.textContent = 'Filing…';
    try {
        const res = await fetch('/api/end-of-day/production', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ staff: name, checks: state.checks, date: ISO })
        });
        const out = await res.json();
        if (!res.ok || out.error) throw new Error(out.error || 'Could not file the day');
        state.warnings = out.warnings || [];
        const missed = (payload.production.sections || []).filter(s => !state.checks[s.key]).length;
        state.recap.push('Production signed at ' + nowTime() + (missed ? ' (' + missed + ' CCP section' + (missed === 1 ? '' : 's') + ' left unconfirmed)' : ''));
        advance();
    } catch (e) {
        err.textContent = e.message;
        btn.disabled = false; btn.innerHTML = '&#10003; Confirm &amp; sign';
    }
}

/* ── 2. Note for management ─────────────────────────────────────────────── */
function viewNote() {
    return kicker('note', 'Handover')
         + '<h2>Anything management should know?</h2>'
         + '<p class="lead">This lands on tomorrow morning&rsquo;s summary &mdash; the first thing the office reads. Equipment playing up, a short delivery, something to watch. Leave it blank if the day was clean.</p>'
         + '<div class="sign-field"><label>Note for management</label>'
         + '<textarea id="note-box" placeholder="e.g. K2 burner is slow to light — worth a look">' + esc(state.note) + '</textarea></div>'
         + '<div class="err" id="note-err"></div>'
         + '<div class="actions"><button class="eod-btn primary grow" id="note-btn" onclick="saveNote()">Continue &rarr;</button></div>';
}

async function saveNote() {
    const box = document.getElementById('note-box');
    const btn = document.getElementById('note-btn');
    const err = document.getElementById('note-err');
    state.note = (box.value || '').trim();
    btn.disabled = true;
    try {
        const res = await fetch('/api/cleaning/closing/note', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ note: state.note, staff: state.staff, date: ISO })
        });
        if (!res.ok) throw new Error('Could not save the note');
        if (state.note) state.recap.push('Note left for management');
        advance();
    } catch (e) {
        err.textContent = e.message; btn.disabled = false;
    }
}

/* ── 3. Closing checklist, one item at a time ───────────────────────────── */
function viewItem(step) {
    const total = (payload.closing.items || []).length;
    return '<div class="counter">Closing &middot; ' + (step.idx + 1) + ' of ' + total + '</div>'
         + '<div class="big-item"><div class="label">' + esc(step.item.label) + '</div></div>'
         + '<div class="actions">'
         + '<button class="eod-btn ghost" onclick="markItem(\'' + step.item.id + '\',false)">Not done</button>'
         + '<button class="eod-btn go grow" onclick="markItem(\'' + step.item.id + '\',true)">&#10003; Done</button>'
         + '</div>'
         + (at > 0 ? '<button class="linkish" onclick="goBack()">&larr; Back</button>' : '');
}

function markItem(id, done) {
    state.closing[id] = done;
    advance();
}

function goBack() { at = Math.max(0, at - 1); render(); }

function viewClosingSign() {
    const items = payload.closing.items || [];
    const missed = items.filter(i => !state.closing[i.id]);
    if (payload.closing_signed) {
        return kicker('closing', 'Closing')
             + '<h2>Closing list is signed</h2>'
             + '<div class="signed-strip">&#10003; Signed by ' + esc(payload.closing.staff || '') + '</div>'
             + '<div class="actions"><button class="eod-btn primary grow" onclick="advance()">Continue &rarr;</button></div>';
    }
    return kicker('closing', 'Closing')
         + '<h2>' + (missed.length ? 'Sign off what&rsquo;s done' : 'Everything is closed down') + '</h2>'
         + '<p class="lead">' + (items.length - missed.length) + ' of ' + items.length + ' complete.'
         + (missed.length ? ' Still open: ' + esc(missed.map(i => i.label).join(' · ')) : '') + '</p>'
         + (missed.length ? '<div class="warn-strip">Unfinished items show on tomorrow&rsquo;s summary. Sign anyway if they can&rsquo;t be done tonight.</div>' : '')
         + '<div class="sign-field"><label>Sign &mdash; your name</label>'
         + '<input type="text" id="close-staff" data-autofocus autocomplete="off" placeholder="e.g. Sam" value="' + esc(state.staff) + '"></div>'
         + '<div class="err" id="close-err"></div>'
         + '<div class="actions"><button class="eod-btn go grow" id="close-btn" onclick="signClosing()">&#10003; Sign closing list</button></div>'
         + '<button class="linkish" onclick="goBack()">&larr; Back</button>';
}

async function signClosing() {
    const input = document.getElementById('close-staff');
    const err = document.getElementById('close-err');
    const btn = document.getElementById('close-btn');
    const name = (input.value || '').trim();
    if (!name) { err.textContent = 'Enter your name to sign.'; input.focus(); return; }
    state.staff = name;
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
        const res = await fetch('/api/cleaning/closing', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ staff: name, done: state.closing, date: ISO })
        });
        const out = await res.json();
        if (!res.ok || out.error) throw new Error(out.error || 'Could not save');
        const items = payload.closing.items || [];
        const missed = items.filter(i => !state.closing[i.id]).length;
        state.recap.push('Closing list signed at ' + nowTime() + (missed ? ' (' + missed + ' left open)' : ''));
        advance();
    } catch (e) {
        err.textContent = e.message;
        btn.disabled = false; btn.innerHTML = '&#10003; Sign closing list';
    }
}

/* ── 4. One rotating job ────────────────────────────────────────────────── */
function viewRotation() {
    if (state.pickedJob) return viewJobSign();
    const jobs = payload.jobs || [];
    if (!jobs.length) {
        return kicker('rotation', 'Rotating job')
             + '<h2>Nothing in the rotation tonight</h2>'
             + '<p class="lead">Every rotating job is resting. Nothing to pick.</p>'
             + '<div class="actions"><button class="eod-btn primary grow" onclick="advance()">Continue &rarr;</button></div>';
    }
    let body = '';
    SLOTS.forEach(slot => {
        const mine = jobs.filter(j => j.slot === slot.key);
        if (!mine.length) return;
        body += '<div class="slot-head"><span class="slot-pill ' + slot.cls + '">' + slot.label + '</span><span class="rule"></span></div>';
        body += mine.map(j =>
            '<button class="job-pick" onclick="pickJob(\'' + j.id + '\')">'
            + '<div><div class="jt">' + esc(j.title) + '</div><div class="jm">'
            + (j.last_done ? 'Last done ' + j.days_since + ' days ago' : 'Never done')
            + (j.due_ratio >= 1 && j.last_done ? ' <span class="overdue-dot">&bull; overdue</span>' : '')
            + (j.notes ? ' &middot; ' + esc(j.notes) : '')
            + '</div></div><span class="chev">&rsaquo;</span></button>').join('');
    });
    return kicker('rotation', 'Rotating job')
         + '<h2>Pick a rotating job</h2>'
         + '<p class="lead">If there&rsquo;s time left, take one from the list &mdash; roughly an hour each. No time tonight is fine.</p>'
         + body
         + '<div class="actions"><button class="eod-btn ghost grow" id="decline-btn" onclick="declineJob()">No time tonight</button></div>';
}

function pickJob(id) {
    state.pickedJob = (payload.jobs || []).find(j => j.id === id) || null;
    render();
}

function viewJobSign() {
    const j = state.pickedJob;
    return kicker('rotation', 'Rotating job')
         + '<h2>' + esc(j.title) + '</h2>'
         + (j.notes ? '<p class="lead">' + esc(j.notes) + '</p>' : '<p class="lead">Done? Put your name on it and it rotates to the back of the line.</p>')
         + '<div class="sign-field"><label>Sign &mdash; your name</label>'
         + '<input type="text" id="job-staff" data-autofocus autocomplete="off" placeholder="e.g. Sam" value="' + esc(state.staff) + '"></div>'
         + '<div class="sign-field"><label>Note (optional)</label>'
         + '<input type="text" id="job-note" autocomplete="off" placeholder="Anything worth mentioning"></div>'
         + '<div class="err" id="job-err"></div>'
         + '<div class="actions"><button class="eod-btn go grow" id="job-btn" onclick="signJob()">&#10003; Done</button></div>'
         + '<button class="linkish" onclick="state.pickedJob=null;render();">&larr; Pick a different job</button>';
}

async function signJob() {
    const j = state.pickedJob;
    const input = document.getElementById('job-staff');
    const err = document.getElementById('job-err');
    const btn = document.getElementById('job-btn');
    const name = (input.value || '').trim();
    if (!name) { err.textContent = 'Enter your name to sign.'; input.focus(); return; }
    state.staff = name;
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
        const res = await fetch('/api/cleaning/jobs/' + j.id + '/complete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ staff: name, date: ISO, notes: document.getElementById('job-note').value })
        });
        const out = await res.json();
        if (!res.ok || out.error) throw new Error(out.error || 'Could not save');
        state.recap.push('Rotating job done: ' + j.title);
        advance();
    } catch (e) {
        err.textContent = e.message;
        btn.disabled = false; btn.innerHTML = '&#10003; Done';
    }
}

async function declineJob() {
    const btn = document.getElementById('decline-btn');
    btn.disabled = true;
    try {
        await fetch('/api/cleaning/rotation/decline', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ staff: state.staff, date: ISO })
        });
    } catch (e) { /* a declined job is a note, never a blocker */ }
    state.recap.push('Rotating job declined');
    advance();
}

/* ── 5. Done ────────────────────────────────────────────────────────────── */
function viewDone() {
    const lines = state.recap.length
        ? state.recap.map(r => '<div><span class="k">&#10003;</span>' + esc(r) + '</div>').join('')
        : '<div><span class="k">&#10003;</span>Today was already closed out.</div>';
    let warn = '';
    if (state.warnings.length) {
        warn = '<div class="warn-strip" style="text-align:left;margin-top:18px;"><strong>'
             + state.warnings.length + ' production warning' + (state.warnings.length === 1 ? '' : 's')
             + ' &mdash; management will see these:</strong><ul style="margin:6px 0 0 18px;">'
             + state.warnings.map(w => '<li>' + esc(w.message || JSON.stringify(w)) + '</li>').join('')
             + '</ul></div>';
    }
    return '<div class="done-mark"><div class="ring">&#10003;</div>'
         + '<h2>That&rsquo;s the day closed out</h2>'
         + '<p class="lead">Thanks ' + esc(state.staff || 'team') + ' &mdash; everything&rsquo;s filed and management sees it in the morning.</p>'
         + '<div class="recap">' + lines + '</div>' + warn + '</div>'
         + '<div class="actions"><button class="eod-btn primary grow" onclick="leave()">Back to dashboard</button></div>';
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
