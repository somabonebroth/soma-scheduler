<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mass Balance — Soma</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  :root{ --border:#e4e0d6; --accent:#3d5a3d; --text:#1a1a1a; --text-light:#777; }
  body{ font-family:-apple-system,system-ui,sans-serif; margin:0; background:#faf8f3; color:var(--text); }
  .header{ display:flex; align-items:center; gap:12px; padding:16px 24px; background:#fff; border-bottom:1px solid var(--border); }
  .header img{ height:34px; cursor:pointer; }
  .header h1{ font-size:19px; margin:0; }
  .header p{ font-size:12px; color:var(--text-light); margin:2px 0 0; }
  .header-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .header-btn{ font-size:13px; text-decoration:none; color:var(--accent); border:1px solid var(--border); padding:7px 12px; border-radius:6px; background:#fff; }
  .nav-arrows{ display:inline-flex; gap:4px; align-items:center; }
  .nav-arrow-btn{ width:30px; height:30px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer; color:var(--accent); font-size:14px; line-height:1; }
  .nav-arrow-btn:hover{ border-color:var(--accent); }
  .nav-arrow-btn:disabled{ opacity:.35; cursor:default; }
  .main{ max-width:1100px; margin:0 auto; padding:22px; }
  .controls{ display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; background:#fff; border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:18px; }
  .controls label{ font-size:12px; color:var(--text-light); display:block; margin-bottom:4px; }
  .controls input[type=date]{ padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px; }
  .btn{ padding:8px 16px; border-radius:6px; font-size:13px; cursor:pointer; border:1px solid var(--accent); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-outline{ background:#fff; color:var(--accent); }
  .chk{ display:flex; align-items:center; gap:6px; font-size:13px; }
  h2{ font-size:15px; margin:22px 0 8px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  th,td{ padding:8px 10px; border-bottom:1px solid #f0efe9; text-align:right; }
  th:first-child,td:first-child{ text-align:left; }
  th{ background:#1a2e1a; color:#fff; font-weight:600; font-size:12px; }
  .num{ font-variant-numeric:tabular-nums; }
  .disc-ok{ color:#2e7d32; }
  .disc-bad{ color:#c62828; font-weight:600; }
  .note{ font-size:12px; color:var(--text-light); margin:6px 2px 0; line-height:1.5; }
  .empty{ font-size:13px; color:var(--text-light); padding:14px; }
  #status{ font-size:13px; color:var(--text-light); margin-left:6px; }
</style>
</head>
<body>
<div class="header">
  <img src="/static/logo.jpg" alt="Soma" onclick="window.location='/'">
  <div><h1>Mass Balance</h1><p>Input / output reconciliation for organic audit</p></div>
  <div class="header-right">
    <div class="nav-arrows"><button class="nav-arrow-btn" id="nav-back" title="Back">&#8592;</button><button class="nav-arrow-btn" id="nav-fwd" title="Forward">&#8594;</button></div>
    <a class="header-btn" href="/">⌂ Dashboard</a>
  </div>
</div>
<div class="main">
  <div class="controls">
    <div><label>From</label><input type="date" id="from"></div>
    <div><label>To</label><input type="date" id="to"></div>
    <label class="chk"><input type="checkbox" id="organic-only"> Organic finished goods only</label>
    <button class="btn btn-primary" onclick="run()">Run report</button>
    <button class="btn btn-outline" onclick="downloadCSV()">Download CSV</button>
    <span id="status"></span>
  </div>
  <div id="results"></div>
</div>
<script>
var _last=null;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function n(v){ if(v===null||v===undefined) return '—'; var r=Math.round(v*1000)/1000; return r; }

function discCell(v){
    var cls=(Math.abs(v)<1e-9)?'disc-ok':'disc-bad';
    var sign=v>0?'+':'';
    return '<td class="num '+cls+'">'+sign+n(v)+'</td>';
}

async function run(){
    var from=document.getElementById('from').value;
    var to=document.getElementById('to').value;
    var org=document.getElementById('organic-only').checked;
    document.getElementById('status').textContent='Computing…';
    var url='/api/organic/mass-balance?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)+'&organic_only='+(org?'1':'0');
    var d=await (await fetch(url)).json();
    _last=d;
    document.getElementById('status').textContent='';
    render(d);
}

function render(d){
    var h='';
    h+='<h2>Raw materials (kg / unit) — all production</h2>';
    if(!d.raw_materials.length){ h+='<div class="empty">No raw-material activity in this range.</div>'; }
    else{
        h+='<table><tr><th>Ingredient</th><th>Unit</th><th>Opening</th><th>Received</th><th>Consumed</th><th>Expected closing</th><th>Current stock</th><th>Discrepancy</th></tr>';
        d.raw_materials.forEach(function(r){
            h+='<tr><td>'+esc(r.item)+'</td><td style="text-align:left;">'+esc(r.unit)+'</td>'
              +'<td class="num">'+n(r.opening)+'</td><td class="num">'+n(r.received)+'</td><td class="num">'+n(r.consumed)+'</td>'
              +'<td class="num">'+n(r.expected_closing)+'</td><td class="num">'+n(r.current)+'</td>'+discCell(r.discrepancy)+'</tr>';
        });
        h+='</table>';
    }
    h+='<h2>Finished goods (units)'+(d.organic_only?' — Organic only':'')+'</h2>';
    if(!d.finished_goods.length){ h+='<div class="empty">No finished-goods activity in this range.</div>'; }
    else{
        h+='<table><tr><th>Product</th><th>Cert</th><th>Opening</th><th>Produced</th><th>Sold</th><th>Expected closing</th><th>Current stock</th><th>Discrepancy</th></tr>';
        d.finished_goods.forEach(function(r){
            h+='<tr><td>'+esc(r.label)+'</td><td style="text-align:left;">'+esc(r.certification||'—')+'</td>'
              +'<td class="num">'+n(r.opening)+'</td><td class="num">'+n(r.produced)+'</td><td class="num">'+n(r.sold)+'</td>'
              +'<td class="num">'+n(r.expected_closing)+'</td><td class="num">'+n(r.current)+'</td>'+discCell(r.discrepancy)+'</tr>';
        });
        h+='</table>';
    }
    h+='<p class="note"><strong>Reading the report:</strong> Opening + Received − Consumed = Expected closing (raw); Opening + Produced − Sold = Expected closing (finished goods). '
      +'<strong>Discrepancy</strong> = Current stock − Expected closing — it reflects manual stock adjustments, breakage, or loss. It is exact only when <em>To</em> is today (current stock is reconciled as of now). '
      +'Raw-material lots aren’t certified individually, so the raw table always covers all production; the organic-only toggle filters the finished-goods side by certification. '
      +'Opening leans on your migration baseline counts as the starting point — a range beginning before that baseline won’t have a meaningful opening.</p>';
    document.getElementById('results').innerHTML=h;
}

function downloadCSV(){
    if(!_last){ run().then(_emitCSV); return; }
    _emitCSV();
}
function _emitCSV(){
    if(!_last) return;
    var d=_last, lines=[];
    lines.push('Mass Balance,'+d.from+' to '+d.to+(d.organic_only?',Organic finished goods only':''));
    lines.push('');
    lines.push('RAW MATERIALS');
    lines.push('Ingredient,Unit,Opening,Received,Consumed,Expected closing,Current stock,Discrepancy');
    d.raw_materials.forEach(function(r){
        lines.push([q(r.item),q(r.unit),r.opening,r.received,r.consumed,r.expected_closing,r.current,r.discrepancy].join(','));
    });
    lines.push('');
    lines.push('FINISHED GOODS');
    lines.push('Product,Certification,Opening,Produced,Sold,Expected closing,Current stock,Discrepancy');
    d.finished_goods.forEach(function(r){
        lines.push([q(r.label),q(r.certification),r.opening,r.produced,r.sold,r.expected_closing,r.current,r.discrepancy].join(','));
    });
    var blob=new Blob([lines.join('\n')],{type:'text/csv'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='mass-balance_'+d.from+'_to_'+d.to+'.csv';
    a.click();
}
function q(s){ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }

document.addEventListener('DOMContentLoaded',function(){
    var now=new Date();
    var yr=now.getFullYear();
    document.getElementById('from').value=yr+'-01-01';
    document.getElementById('to').value=now.toISOString().slice(0,10);
    run();
});
</script>
<script>
(function(){
  var back=document.getElementById('nav-back'), fwd=document.getElementById('nav-fwd');
  if(back){ back.disabled=(window.history.length<=1); back.onclick=function(){ window.history.back(); }; }
  if(fwd)  fwd.onclick=function(){ window.history.forward(); };
  window.addEventListener('popstate',function(){ if(back) back.disabled=(window.history.length<=1); });
})();
</script>
</body>
</html>
